<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MusicLens – SORA Edition v12.0</title>
    <style>
        :root {
            --bg0: #0b0f14;
            --bg1: #0f141b;
            --txt: #f7fafc;
            --gold: #ffd36b;
            --amber: #ff9f1c;
            --teal: #7fd1ff;
            --mint: #89ffe3;
            --rose: #ff6b6b;
            --violet: #9b7bff;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            background: radial-gradient(1200px 800px at 70% -10%, rgba(127, 209, 255, .08), transparent 60%),
                radial-gradient(900px 600px at 10% 20%, rgba(255, 211, 107, .06), transparent 65%),
                linear-gradient(180deg, var(--bg0), var(--bg1));
            color: var(--txt);
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            overflow-x: hidden;
        }

        /* ===== 背景パーティクル ===== */
        #fx {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none
        }

        /* ===== TOP ===== */
        #title {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .hero {
            width: min(920px, 92vw);
            padding: 40px 48px;
            border-radius: 24px;
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(18px) saturate(140%);
            box-shadow: 0 10px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .06);
            position: relative;
            z-index: 2;
        }

        .logo {
            font-size: clamp(40px, 7vw, 72px);
            line-height: 1.1;
            margin: 0 0 12px 0;
            background: linear-gradient(90deg, #f7e8b3, #ffd36b, #ff9f1c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 12px rgba(255, 211, 107, .25);
        }

        .tagline {
            font-size: clamp(14px, 1.9vw, 20px);
            opacity: .92;
            line-height: 1.8;
            margin: 8px 0 18px;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(270deg, #ffd36b, #ff9f1c);
            color: #111;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 211, 107, .25);
            transform: translateZ(0);
            transition: transform .25s ease, filter .25s ease;
        }

        .cta:hover {
            transform: translateY(-2px);
            filter: brightness(1.05)
        }

        .credit {
            margin-top: 16px;
            opacity: .85;
            font-size: 14px
        }

        /* ===== 常駐 Sora AI ボタン（Siri風＋グラデ流体アニメ＋リップル） ===== */
        .sora-fab {
            position: fixed;
            top: 16px;
            right: 18px;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(270deg, var(--teal), var(--mint), var(--gold), var(--amber));
            background-size: 800% 800%;
            color: #0b132b;
            font-weight: 800;
            letter-spacing: .35px;
            animation: fabFlow 10s ease infinite;
            box-shadow: 0 0 24px rgba(127, 209, 255, .35), inset 0 1px 0 rgba(255, 255, 255, .5);
            cursor: pointer;
            overflow: hidden;
        }

        .sora-fab:hover {
            filter: brightness(1.12)
        }

        .sora-fab:active::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(255, 255, 255, .5) 0, transparent 60%);
            animation: fabRipple .8s ease-out;
        }

        @keyframes fabFlow {
            0% {
                background-position: 0% 50%
            }

            50% {
                background-position: 100% 50%
            }

            100% {
                background-position: 0% 50%
            }
        }

        @keyframes fabPulse {

            0%,
            100% {
                box-shadow: 0 0 28px rgba(127, 209, 255, .35)
            }

            50% {
                box-shadow: 0 0 40px rgba(255, 211, 107, .45)
            }
        }

        @keyframes fabRipple {
            0% {
                transform: scale(.85);
                opacity: .7
            }

            100% {
                transform: scale(2.2);
                opacity: 0
            }
        }

        .sora-fab .dot {
            width: 12px;
            height: 12px;
            border-radius: 99px;
            background: radial-gradient(circle at 40% 40%, #fff, #7fd1ff 60%);
            box-shadow: 0 0 10px rgba(127, 209, 255, .7);
            animation: dotBreath 3s ease-in-out infinite;
        }

        @keyframes dotBreath {

            0%,
            100% {
                transform: scale(1);
                opacity: 1
            }

            50% {
                transform: scale(1.35);
                opacity: .7
            }
        }

        /* --- iOS Safari対策（固定位置の確実化） --- */
        .sora-fab,
        #fx {
            will-change: transform
        }

        .sora-fab {
            transform: translateZ(0)
        }

        /* 小画面では上部中央に固定 */
        @media (max-width: 768px) {
            .sora-fab {
                left: 50%;
                right: auto;
                transform: translate(-50%, 0)
            }
        }

        /* ===== Sora モーダル（Liquid + 状態連動グロー） ===== */
        #sora-overlay {
            position: fixed;
            inset: 0;
            z-index: 4000;
            display: none;
            backdrop-filter: blur(20px);
            background: rgba(10, 12, 16, .55);
            align-items: center;
            justify-content: center;
        }

        .sora-card {
            position: relative;
            width: min(680px, 92vw);
            max-width: 820px;
            border-radius: 18px;
            padding: 22px 24px 18px;
            background: rgba(18, 22, 30, .72);
            backdrop-filter: blur(20px) saturate(140%);
            box-shadow: 0 8px 35px rgba(0, 0, 0, .35);
            overflow: hidden;
        }

        .sora-card>* {
            position: relative;
            z-index: 1;
        }

        /* 動くグラデ境界 + 状態依存 */
        .sora-card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            padding: 2px;
            background: conic-gradient(from 0deg, #7fd1ff, #89ffe3, #ffd36b, #ff9f1c, #7fd1ff);
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: cardSpin 12s linear infinite;
        }

        .sora-card[data-state="idle"]::before {
            background: conic-gradient(from 0deg, #7fd1ff, #89ffe3, #7fd1ff);
            animation-duration: 16s;
            filter: brightness(1);
        }

        .sora-card[data-state="thinking"]::before {
            background: conic-gradient(from 0deg, #66aaff, #9b7bff, #66aaff);
            animation-duration: 9s;
            filter: brightness(1.25);
        }

        .sora-card[data-state="reply"]::before {
            background: conic-gradient(from 0deg, #ffd36b, #ff9f1c, #ffd36b);
            animation-duration: 12s;
            filter: brightness(1.15);
        }

        .sora-card[data-state="error"]::before {
            background: conic-gradient(from 0deg, #ff6b6b, #ff4b4b, #ff6b6b);
            animation-duration: 6s;
            filter: brightness(1.4);
        }

        @keyframes cardSpin {
            to {
                transform: rotate(360deg)
            }
        }

        /* 内部オーラ */
        .sora-card::after {
            content: "";
            position: absolute;
            inset: -48px;
            border-radius: inherit;
            background:
                radial-gradient(120px 120px at 15% 25%, rgba(137, 255, 227, .18), transparent 60%),
                radial-gradient(160px 160px at 85% 35%, rgba(255, 211, 107, .20), transparent 60%),
                radial-gradient(160px 160px at 60% 85%, rgba(127, 209, 255, .20), transparent 60%);
            filter: blur(30px);
            pointer-events: none;
            opacity: .8;
            animation: auraBreath 10s ease-in-out infinite;
        }

        @keyframes auraBreath {

            0%,
            100% {
                transform: translateY(0);
                opacity: .6
            }

            50% {
                transform: translateY(-8px);
                opacity: .9
            }
        }

        /* スキャンライン */
        .scan-line {
            position: absolute;
            left: -10%;
            right: -10%;
            top: -12%;
            height: 4px;
            opacity: .18;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent);
            filter: blur(4px);
            animation: scanMove 7s linear infinite;
        }

        @keyframes scanMove {
            0% {
                top: -12%;
                opacity: 0
            }

            20% {
                opacity: .35
            }

            50% {
                top: 100%
            }

            80% {
                opacity: 0
            }

            100% {
                top: 100%
            }
        }

        .sora-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .sora-title {
            font-weight: 800;
            letter-spacing: .4px;
            background: linear-gradient(90deg, #c6f0ff, #89ffe3, #ffd36b, #ff9f1c, #c6f0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleGlow 14s ease-in-out infinite;
        }

        @keyframes titleGlow {

            0%,
            100% {
                filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0));
            }

            50% {
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, .35));
            }
        }

        .sora-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 58vh;
            overflow: auto;
        }

        .sora-log {
            border-radius: 12px;
            padding: 14px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .08);
            min-height: 120px;
            max-height: 40vh;
            overflow: auto;
        }

        .sora-input {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 8px
        }

        .sora-input input {
            flex: 1;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, .2);
            padding: 12px 14px;
            background: rgba(255, 255, 255, .06);
            color: var(--txt);
            outline: none
        }

        .sora-send {
            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(270deg, #7fd1ff, #89ffe3);
            color: #0b132b;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(127, 209, 255, .35);
        }

        .sora-msg {
            margin: 8px 0;
            display: flex;
            gap: 10px;
            align-items: flex-start
        }

        .sora-msg::before {
            content: "";
            flex: 0 0 8px;
            height: 8px;
            width: 8px;
            border-radius: 999px;
            background: var(--teal);
            box-shadow: 0 0 8px rgba(127, 209, 255, .5)
        }

        .sora-msg .bubble {
            padding: 10px 12px;
            border-radius: 12px;
            background: #1117;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, .08)
        }

        /* 扉のレイヤー保障 */
        #doorContainer,
        .door {
            z-index: 999
        }

        /* iOS 固有のクリック取りこぼし対策 */
        .clickable {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body>

    <canvas id="fx"></canvas>

    <!-- Top / Hero -->
    <section id="title">
        <button id="soraFab" class="sora-fab clickable" aria-label="Chat with Sora AI">
            <span class="dot"></span>
            <span>Chat with Sora AI</span>
        </button>
        <div class="hero">
            <h1 class="logo">MusicLens</h1>
            <p class="tagline">好きなアーティスト/曲を入れるだけ。音の嗜好→今日のコンディションと仕事の強みまで見える、“音の性格診断”。</p>
            <button id="startBtn" class="cta clickable">SOUND JOURNEY ▶︎</button>
            <p class="credit">Produced by Daijiro Majima</p>
        </div>
    </section>

    <!-- Door animation -->
    <div id="doorContainer">
        <div class="door left"></div>
        <div class="door right"></div>
    </div>

    <!-- App main -->
    <main id="app" style="display:none; opacity:0">
        <section style="position:relative; padding:28px 24px">
            <button id="soraFabTop" class="sora-fab clickable" aria-label="Chat with Sora AI"
                style="right:24px; top:24px">
                <span class="dot"></span><span>Chat with Sora AI</span>
            </button>
            <h2 class="logo" style="text-align:center">MusicLens</h2>
        </section>

        <section style="max-width:1000px; margin: 0 auto; padding: 0 24px 64px">
            <!-- Input -->
            <div class="panel">
                <div class="section-title">Today's Feeling（アーティスト / 曲名）</div>
                <input id="inputBox" placeholder="例: Daft Punk, SZA, ずっと真夜中でいいのに。">
                <div style="display:flex; gap:10px; margin-top:12px">
                    <button id="addBtn" class="cta clickable" style="padding:12px 18px">Add</button>
                    <button id="analyzeBtn" class="cta clickable"
                        style="padding:12px 18px; background: linear-gradient(270deg, #ffd36b, #ff9f1c)">
                        Analyze
                    </button>
                </div>
                <div id="chips" style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap"></div>
                <div id="progressWrap" style="display:none; margin-top:14px">
                    <div style="height:10px; background:#ffffff1f; border-radius: 999px; overflow:hidden">
                        <div id="progfill"
                            style="height:10px; width:0%; background: linear-gradient(270deg,#7fd1ff,#89ffe3); transition: width .28s ease">
                        </div>
                    </div>
                    <div id="progtext" style="font-weight:700; margin-top:8px">0%</div>
                </div>
            </div>

            <!-- Listening Map -->
            <div class="panel">
                <div class="section-title">Listening Map（アーティストバブル）</div>
                <div id="mapArea"></div>
            </div>

            <!-- Emotion -->
            <div class="panel">
                <div class="section-title">Emotion Map（Valence × Arousal）</div>
                <canvas id="emotion" height="360" style="width:100%; display:block"></canvas>
                <div id="emotionTip" style="margin-top:8px; text-align:center; opacity:.9"></div>
            </div>

            <!-- Love -->
            <div class="panel" style="text-align:center">
                <div class="section-title">Music Love（音楽愛）</div>
                <svg id="loveSvg" viewBox="0 0 200 200" width="260" height="260">
                    <defs>
                        <linearGradient id="loveGrad" x1="0" y1="1" x2="0" y2="0">
                            <stop offset="0%" stop-color="#ff9f1c" />
                            <stop offset="100%" stop-color="#ffd36b" />
                        </linearGradient>
                    </defs>
                    <path id="heartLine" d="M100 175c-3 0-6 -1 -8.2 -2.9 C75 158 30 123 30 85
                                 c0 -25 20 -45 43 -45 c12 0 24 6 31 15 c7 -9 19 -15 31 -15
                                 c23 0 43 20 43 45 c0 38 -45 73 -61.8 87.1 c-2.2 2 -5.2 2.9 -8.2 2.9 z" fill="none"
                        stroke="#ffd36b" stroke-width="3" />
                    <clipPath id="loveClip">
                        <use href="#heartLine" />
                    </clipPath>
                    <rect id="loveFill" x="36" y="160" width="128" height="0" fill="url(#loveGrad)"
                        clip-path="url(#loveClip)" />
                </svg>
                <div id="lovePercent" style="font-size:20px; margin-top:10px">—%</div>
                <div id="loveComment" style="opacity:.9; margin-top:6px"></div>
            </div>

            <!-- Vector -->
            <div class="panel">
                <div class="section-title">Your Music Vector</div>
                <div id="profileBars"></div>
                <canvas id="vectorPie" width="320" height="320" style="display:block; margin:20px auto"></canvas>
                <div id="vectorLegend" style="text-align:center; margin-top:6px; opacity:.9"></div>
            </div>

            <!-- Work Strengths -->
            <div class="panel">
                <div class="section-title">Work Strengths</div>
                <div id="abilities"></div>
                <canvas id="workPie" width="320" height="320" style="display:block; margin:20px auto"></canvas>
                <div id="workLegend" style="text-align:center; margin-top:6px; opacity:.9"></div>
            </div>

            <!-- Recommendations -->
            <div class="panel">
                <div class="section-title">Music Recommendations</div>
                <div id="recs"></div>
            </div>
        </section>
    </main>

    <!-- Sora Modal -->
    <div id="sora-overlay" class="clickable" aria-hidden="true">
        <div class="sora-card" data-state="idle">
            <span class="scan-line"></span>
            <div class="sora-header">
                <div class="sora-title">Sora AI</div>
                <button id="soraClose" class="cta" style="padding:8px 12px">Close</button>
            </div>
            <div class="sora-body">
                <div id="soraLog" class="sora-log"></div>
                <div class="sora-input">
                    <input id="soraInput" placeholder="例: 大阪の天気は？ / 次は何聴く？" />
                    <button id="soraSend" class="cta" style="padding:10px 16px">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ========== 基本ユーティリティ ========== */
        const raf = () => new Promise(r => requestAnimationFrame(r));
        function onTap(el, fn) { if (!el) return; el.addEventListener('click', fn); el.addEventListener('pointerup', e => { e.preventDefault(); fn(e) }, { passive: false }); }
        function uniqueTokens(arr) { const s = new Set(), out = []; (arr || []).forEach(t => { const v = (t || '').trim(); if (!v) return; const k = v.toLowerCase(); if (!s.has(k)) { s.add(k); out.push(v) } }); return out; }

        /* ========== 背景パーティクル ========== */
        (() => {
            const c = document.getElementById('fx'), ctx = c.getContext('2d', { alpha: true });
            let W = innerWidth, H = innerHeight; c.width = W; c.height = H;
            const pts = Array.from({ length: 130 }).map(() => ({ x: Math.random() * W, y: Math.random() * H, dx: (Math.random() - .5) * .25, dy: (Math.random() - .5) * .25, r: 1 + Math.random() * 2, a: .25 + Math.random() * .3 }));
            const step = () => {
                ctx.clearRect(0, 0, W, H);
                for (const p of pts) {
                    p.x += p.dx; p.y += p.dy; if (p.x < 0 || p.x > W) p.dx *= -1; if (p.y < 0 || p.y > H) p.dy *= -1;
                    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 10);
                    g.addColorStop(0, `rgba(135,200,255,${p.a})`); g.addColorStop(1, 'transparent');
                    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 10, 0, Math.PI * 2); ctx.fill();
                } requestAnimationFrame(step);
            }; step();
            addEventListener('resize', () => { W = innerWidth; H = innerHeight; c.width = W; c.height = H; })
        })();

        /* ========== 扉アニメ ========== */
        onTap(document.getElementById('startBtn'), async () => {
            document.body.classList.add('doors-open');
            setTimeout(async () => {
                document.getElementById('title').style.display = 'none';
                const app = document.getElementById('app');
                app.style.display = 'block'; await raf(); app.style.opacity = 1;
            }, 3000);
        });

        /* ========== Sora モーダル & ボタン ========== */
        const $overlay = document.getElementById('sora-overlay');
        const $soraCard = () => document.querySelector('.sora-card');

        function setSoraState(st) {
            const card = $soraCard(); if (!card) return; card.setAttribute('data-state', st);
        }
        function openSora() {
            $overlay.style.display = 'flex';
            setSoraState('idle');
            document.body.style.overflow = 'hidden';
            const input = document.getElementById('soraInput');
            setTimeout(() => input && input.focus(), 50);
        }
        function closeSora() {
            $overlay.style.display = 'none';
            document.body.style.overflow = '';
        }
        onTap(document.getElementById('soraFab'), openSora);
        onTap(document.getElementById('soraFabTop'), openSora);
        onTap(document.getElementById('soraClose'), closeSora);

        /* ========== Sora 応答・状態連動 ========== */
        const SORA_ENDPOINT = 'https://tiny-fog-ae39.mjmdjr.workers.dev/';
        const soraLog = document.getElementById('soraLog');
        const soraInput = document.getElementById('soraInput');

        function appendLog(who, text) {
            const row = document.createElement('div'); row.className = 'sora-msg';
            row.innerHTML = `<div class="bubble"><strong>${who}：</strong> ${text}</div>`;
            soraLog.appendChild(row); soraLog.scrollTop = soraLog.scrollHeight;
        }

        async function callSora(message) {
            setSoraState('thinking');
            try {
                const ctrl = new AbortController();
                const t = setTimeout(() => ctrl.abort(), 15000);
                const res = await fetch(SORA_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message }),
                    signal: ctrl.signal
                });
                clearTimeout(t);
                if (!res.ok) { setSoraState('error'); return '今は混み合ってるみたい…ちょい待ってや。' }
                const data = await res.json().catch(() => ({}));
                setSoraState('reply');
                setTimeout(() => setSoraState('idle'), 3000);
                return data && (data.reply || data.message) ? (data.reply || data.message) : 'うん！了解やで。';
            } catch (e) {
                setSoraState('error');
                return 'ネットが不安定みたいや。もう一回試してみてな。';
            }
        }

        onTap(document.getElementById('soraSend'), async () => {
            const q = (soraInput.value || '').trim();
            if (!q) return;
            appendLog('🙋‍♂️', q);
            soraInput.value = '';
            const ans = await callSora(q);
            appendLog('Sora', ans);
        });

        /* ========== 入力/予測/追加 ========== */
        let TOKENS = [];
        const input = document.getElementById('inputBox');
        const chips = document.getElementById('chips');

        /* 予測補完（iTunes） */
        async function suggest(q) {
            const url = `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&limit=7`;
            try {

       const j=await r.json(); return j.results?.[0]?.previewUrl || ""; }
                catch{ return "" }
}
                async function getSimilarArtists(tokens, max=6){
  const exclude=new Set(tokens.map(x=>x.toLowerCase())), genres=new Set(), pool=[];
                for(const n of tokens){ const info=await getArtistInfo(n); if(info?.genre) genres.add(info.genre); }
                for(const g of genres){
    const e=encodeURIComponent(g);
                try{
      const j=await fetch(`https://itunes.apple.com/search?term=${e}&entity=musicArtist&limit=30`).then(r=>r.json());
      (j.results||[]).forEach(a=>{
        if(!a.artistName) return; const nm=a.artistName.trim();
                if(exclude.has(nm.toLowerCase())) return;
                pool.push({id:a.artistId, name:nm, link:a.artistLinkUrl||`https://music.apple.com/us/search?term=${encodeURIComponent(nm)}&app=music`,
                img:a.artworkUrl100 ? a.artworkUrl100.replace('100x100','300x300') : `https://picsum.photos/seed/${encodeURIComponent(nm)}/300/300` });
      });
    }catch{ }
  }
                const seen=new Set(), out=[];
                for(const a of pool){ const k=(a.name+':'+a.id).toLowerCase(); if(seen.has(k)) continue; seen.add(k); out.push(a); }
                return out.slice(0, max);
}
                async function renderRecommendations(){
  const box=document.getElementById('recs'); box.innerHTML='';
                const list = uniqueTokens(TOKENS||[]);
                if(!list.length){box.innerHTML = '<div style="opacity:.75">アーティストを入力して Analyze を押してください。</div>'; return; }
                const recs = await getSimilarArtists(list, 6);
                if(!recs.length){box.innerHTML = '<div style="opacity:.75">おすすめが見つかりませんでした。</div>'; return; }
  const rows = await Promise.all(recs.map(async a=>{
    const preview = await getPreviewUrl(a.name); // ← 30秒試聴
                const yt=`https://www.youtube.com/results?search_query=${encodeURIComponent(a.name + ' official')}`;
                return `<div style="display:flex;align-items:center;gap:12px;margin:10px 0">
                    <img src="${a.img}" alt="${a.name}" style="width:56px;height:56px;border-radius:10px;object-fit:cover">
                        <div style="flex:1;min-width:0">
                            <div style="font-weight:800">${a.name}</div>
                            <div style="display:flex;gap:12px;align-items:center;margin-top:6px">
                                <a href="${a.link}" target="_blank" title="Apple Music" style="display:inline-flex;align-items:center">${ICON_APPLE}</a>
                                <a href="${yt}" target="_blank" title="YouTube" style="display:inline-flex;align-items:center">${ICON_YT}</a>
                            </div>
                            ${preview ? `<audio controls preload="none" style="margin-top:6px;width:100%;max-width:340px"><source src="${preview}"></audio>`
                                : `<div style="margin-top:6px;opacity:.65">（プレビューなし）</div>`}
                        </div>
                </div>`;
  }));
  box.innerHTML = rows.join('');
}

const progWrap=document.getElementById('progressWrap'), progFill=document.getElementById('progfill'), progText=document.getElementById('progtext');
function startProgress(cb){
  progWrap.style.display='block'; progFill.style.width='0%'; progText.textContent='0%';
  let p=0; const id=setInterval(()=>{ p=Math.min(100,p+6); progFill.style.width=p+'%'; progText.textContent=p+'%'; }, 70);
  cb().finally(()=>{ clearInterval(id); setTimeout(()=> progWrap.style.display='none', 120); });
}
onTap(document.getElementById('analyzeBtn'), ()=> startProgress(analyze));

  await renderRecommendations().catch(()=>{});
