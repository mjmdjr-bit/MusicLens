<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MusicLens — Sound Journey</title>
  <style>
    :root {
      --gold: #ffcc33;
      --gold2: #ff8800;
      --ink: #0a0a0e;
      --ink2: #151722;
      --txt: #eef2ff;
      --muted: #a9b2c7;
      --glass: rgba(255, 255, 255, .18);
      --stroke: rgba(255, 255, 255, .22);
      --aqua: #8ee7ff;
      --cyan: #00c7ff;
      --glow: 0 0 18px rgba(255, 180, 60, .45);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      color: var(--txt);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Roboto, Segoe UI, sans-serif;
      background: linear-gradient(180deg, var(--ink), var(--ink2));
      overflow-x: hidden;
      position: relative;
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none
    }

    /* === Top === */
    #title {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center
    }

    .hero {
      max-width: 980px;
      width: 100%;
      padding: 36px 28px;
      border: 1px solid var(--stroke);
      border-radius: 28px;
      background: linear-gradient(180deg, var(--glass), rgba(255, 255, 255, .07));
      backdrop-filter: saturate(180%) blur(22px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, .45), inset 0 1px rgba(255, 255, 255, .28)
    }

    .logo {
      font-weight: 900;
      font-size: 48px;
      letter-spacing: 1.6px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: float 6s ease-in-out infinite, shine 4.5s linear infinite
    }

    .cta {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      cursor: pointer;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      color: #111;
      font-weight: 900
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    @keyframes shine {
      0% {
        background-position: 0% 50%
      }

      100% {
        background-position: 200% 50%
      }
    }

    /* === App === */
    #app {
      position: relative;
      z-index: 1;
      display: none;
      opacity: 0;
      transition: opacity .5s ease
    }

    #app.show {
      display: block;
      opacity: 1
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 18px 32px
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0
    }

    .titleSmall {
      font-weight: 900;
      font-size: 20px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    #backTop {
      color: #ffe28a;
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      cursor: pointer
    }

    .btn-primary {
      background: linear-gradient(90deg, #ffd766, #ff9f1c);
      color: #111;
      font-weight: 900
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .06);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .3)
    }

    /* === Bubbles map === */
    #bubbleMap {
      position: relative;
      min-height: 280px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center
    }

    .bubble {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      text-align: center;
      overflow: hidden;
      cursor: pointer;
      transition: transform .3s ease, filter .3s ease
    }

    .bubble:hover {
      transform: scale(1.2);
      filter: brightness(1.3)
    }

    .bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%
    }

    @keyframes floaty {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    /* === Liquid animation === */
    @keyframes wave {
      0% {
        d: path("M0 10 Q50 0 100 10 T200 10 V200 H0 Z")
      }

      50% {
        d: path("M0 12 Q50 22 100 12 T200 12 V200 H0 Z")
      }

      100% {
        d: path("M0 10 Q50 0 100 10 T200 10 V200 H0 Z")
      }
    }

    /* === Progress === */
    #progressWrap {
      display: none;
      margin-top: 10px
    }

    #progbar {
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .15);
      overflow: hidden
    }

    #progfill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffd766, #ff9f1c);
      box-shadow: 0 0 10px rgba(255, 255, 255, .35) inset
    }

    #progtext {
      margin-top: 6px
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <!-- === Top === -->
  <section id="title">
    <div class="hero">
      <div class="logo">MusicLens</div>
      <p class="small">今日の気分で音を選んで、新しい自分を見つけよう。</p>
      <button id="startBtn" class="cta">SOUND JOURNEY ▶︎</button>
    </div>
  </section>

  <!-- === App === -->
  <section id="app">
    <main class="container">
      <header class="header">
        <div class="titleSmall">MusicLens</div>
        <div id="backTop">← TOPへ戻る</div>
      </header>

      <!-- Today's Feeling -->
      <section class="panel">
        <div class="section-title">Today's Feeling（いま聴きたいアーティストを入力）</div>
        <input id="inputBox" type="text" placeholder="例：Daft Punk, FKJ, BLACKPINK…" autocomplete="off">
        <div style="margin-top:8px">
          <button id="addBtn" class="btn btn-ghost">Add</button>
          <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
        </div>
        <div id="chips" class="chips"></div>
        <div id="progressWrap">
          <div id="progbar">
            <div id="progfill"></div>
          </div>
          <div id="progtext" class="small"></div>
        </div>
      </section>

      <!-- Listening Map -->
      <section class="panel">
        <div class="section-title">Listening Map</div>
        <div id="bubbleMap"></div>
      </section>

      <!-- Music Love -->
      <section class="panel">
        <div class="section-title">Music Love</div>
        <div style="text-align:center">
          <svg id="loveGlass" viewBox="0 0 200 200" width="200" height="200">
            <defs>
              <clipPath id="heartClip">
                <path
                  d="M100 175c-3 0-6-.9-8.2-2.9C75 160 30 123 30 85 30 60 50 40 73 40c12 0 24 6 31 15 7-9 19-15 31-15 23 0 43 20 43 45 0 38-45 75-61.8 87.1-2.2 2-5.2 2.9-8.2 2.9z" />
              </clipPath>
            </defs>
            <path id="wavePath" d="M0 10 Q50 0 100 10 T200 10 V200 H0 Z" fill="url(#grad)" />
            <linearGradient id="grad" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#ff9f1c" />
              <stop offset="100%" stop-color="#fff3b0" />
            </linearGradient>
          </svg>
        </div>
      </section>

      <!-- Vector -->
      <section class="panel">
        <div class="section-title">Your Music Vector</div>
        <div id="profileBars"></div>
        <div id="vectorInsight" class="insight" style="display:none"></div>
      </section>

      <!-- Work Strengths -->
      <section class="panel">
        <div class="section-title">Work Strengths</div>
        <div id="abilities"></div>
        <div id="abilitiesInsight" class="insight" style="display:none"></div>
      </section>

      <!-- Recommendations -->
      <section class="panel">
        <div class="section-title">Open-Web Recommendations</div>
        <div id="recs" class="small">解析後に表示されます。</div>
      </section>
    </main>
  </section>

  <script>
    /* ========== Top↔App遷移 ========== */
    (function () {
      const title = document.getElementById('title');
      const app = document.getElementById('app');
      const start = document.getElementById('startBtn');
      const back = document.getElementById('backTop');
      start.addEventListener('click', () => { title.style.display = 'none'; app.style.display = 'block'; requestAnimationFrame(() => app.classList.add('show')); startHarakamiLoop(); });
      back.addEventListener('click', () => { app.classList.remove('show'); app.style.display = 'none'; title.style.display = 'grid'; });
    })();

    /* ========== 簡易BGM（メロディ付きハラカミ風） ========== */
    let AC, master, bus, delay, isLooping = false;
    function ensureAC() { if (AC) return; AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination); bus = AC.createGain(); bus.gain.value = .3; bus.connect(master); delay = AC.createDelay(); delay.delayTime.value = .25; const fb = AC.createGain(); fb.gain.value = .25; delay.connect(fb); fb.connect(delay); delay.connect(bus); }
    function playTone(f, t, l) { const o = AC.createOscillator(), v = AC.createGain(); o.type = 'sine'; o.frequency.value = f; o.connect(v); v.connect(bus); v.gain.setValueAtTime(.0001, t); v.gain.exponentialRampToValueAtTime(.18, t + .02); v.gain.exponentialRampToValueAtTime(.0001, t + l); o.start(t); o.stop(t + l); }
    function startHarakamiOnce() { ensureAC(); const t0 = AC.currentTime; const scale = [261.6, 293.7, 329.6, 392, 440, 523.3]; for (let i = 0; i < 6; i++) { playTone(scale[i], t0 + i * 0.4, 0.4); } }
    function startHarakamiLoop() { if (isLooping) return; startHarakamiOnce(); setInterval(startHarakamiOnce, 3000); isLooping = true; }

    /* ========== Today's Feeling 入力 ========== */
    let TOKENS = [];
    const input = document.getElementById('inputBox');
    const chips = document.getElementById('chips');
    function renderChips() { chips.innerHTML = TOKENS.map((t, i) => `<span class="chip">${t}<a onclick="remove(${i})">✕</a></span>`).join(''); }
    function add() { if (!input.value.trim()) return; TOKENS.push(input.value.trim()); input.value = ''; renderChips(); }
    function remove(i) { TOKENS.splice(i, 1); renderChips(); }
    document.getElementById('addBtn').onclick = add;

    /* ========== Listening Map (bubbles) ========== */
    function renderBubbles() { const map = document.getElementById('bubbleMap'); map.innerHTML = ''; TOKENS.forEach((t, i) => { const b = document.createElement('div'); b.className = 'bubble'; b.style.background = `hsla(${Math.random() * 360},70%,60%,0.8)`; b.style.animation = `floaty ${3 + Math.random() * 2}s ease-in-out infinite`; b.textContent = t; map.appendChild(b); }); }

    /* ========== Music Love (wave animation) ========== */
    const wave = document.getElementById('wavePath'); let phase = 0;
    function animateWave() { phase += .1; const a = Math.sin(phase / 3) * 2; wave.setAttribute('d', `M0 10 Q50 ${a} 100 10 T200 10 V200 H0 Z`); requestAnimationFrame(animateWave); } animateWave();

    /* ========== Vector / Work / Recs（シミュレーション） ========== */
    function randomVec() { return { energy: Math.random(), sophistication: Math.random(), groove: Math.random(), structure: Math.random(), experiment: Math.random(), urban: Math.random(), global: Math.random() }; }
    function drawProfile(v) { const el = document.getElementById('profileBars'); el.innerHTML = ''; for (const [k, val] of Object.entries(v)) { const pct = Math.round(val * 100); el.innerHTML += `<div class="kpi"><div>${k}</div><div class="badge">${pct}%</div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div>`; } const msgs = ['今日はエネルギー高め。新しい挑戦をしてみよう。', '穏やかなリズムの日。周りと協調して動けそう。', 'ひらめきが多い一日。感じたまま表現してみて。']; document.getElementById('vectorInsight').style.display = 'block'; document.getElementById('vectorInsight').textContent = msgs[Math.floor(Math.random() * msgs.length)]; }
    function drawAbilities(v) { const el = document.getElementById('abilities'); el.innerHTML = ''; for (const [k, val] of Object.entries(v)) { const pct = Math.round(val * 100); el.innerHTML += `<div class="kpi"><div>${k}</div><div class="badge">${pct}%</div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div>`; } const hints = ['整理整頓力が光る日。情報をまとめて伝えよう。', '共感力が高まっている。会話が弾みそう。', '想像力が冴える日。新しいアイデアを試して。']; document.getElementById('abilitiesInsight').style.display = 'block'; document.getElementById('abilitiesInsight').textContent = hints[Math.floor(Math.random() * hints.length)]; }
    function renderRecs() { const recs = document.getElementById('recs'); const all = ['FKJ', 'Thundercat', 'SZA', 'Robert Glasper', 'Disclosure', 'Khruangbin', 'Bonobo', 'Yaeji']; const pick = all.sort(() => .5 - Math.random()).slice(0, 4); recs.innerHTML = pick.map(p => `<div style="margin:6px 0"><img src="https://picsum.photos/seed/${encodeURIComponent(p)}/80/80" style="border-radius:8px;vertical-align:middle;margin-right:6px"/>${p} <a href="https://music.apple.com/us/search?term=${encodeURIComponent(p)}" target="_blank" style="color:#ffe28a">Apple</a> ／ <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(p + ' official')}" target="_blank" style="color:#ffe28a">YouTube</a></div>`).join(''); }

    /* ========== Analyze 実行 ========== */
    document.getElementById('analyzeBtn').onclick = () => {
      if (!TOKENS.length) return;
      const v = randomVec();
      drawProfile(v);
      drawAbilities(v);
      renderRecs();
      renderBubbles();
      TOKENS = []; render
