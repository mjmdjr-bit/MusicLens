<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MusicLens — Sound Journey</title>
  <style>
    :root {
      --gold: #ffcc33;
      --gold2: #ff8800;
      --ink: #0a0a0e;
      --ink2: #151722;
      --txt: #eef2ff;
      --muted: #a9b2c7;
      --glass: rgba(255, 255, 255, .18);
      --stroke: rgba(255, 255, 255, .22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Roboto, Segoe UI, sans-serif;
      background: linear-gradient(180deg, var(--ink), var(--ink2));
      color: var(--txt);
      overflow-x: hidden;
    }

    /* === TOP === */
    #title {
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
      position: relative;
      z-index: 2
    }

    .hero {
      max-width: 900px;
      padding: 40px;
      border: 1px solid var(--stroke);
      border-radius: 28px;
      background: linear-gradient(180deg, var(--glass), rgba(255, 255, 255, .07));
      backdrop-filter: blur(22px)
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .cta {
      margin-top: 20px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      color: #111;
      font-weight: 900;
      cursor: pointer
    }

    /* === APP === */
    #app {
      display: none;
      opacity: 0;
      transition: opacity .6s ease
    }

    #app.show {
      display: block;
      opacity: 1
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px
    }

    .titleSmall {
      font-weight: 900;
      font-size: 20px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    #backTop {
      color: #ffe28a;
      cursor: pointer;
      text-decoration: underline;
      font-size: 14px
    }

    /* === BGM === */
    #bgmBtn {
      background: rgba(255, 255, 255, .1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer
    }

    /* === Panel === */
    .panel {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px
    }

    .section-title {
      font-weight: 800;
      color: #ffd36b;
      margin-bottom: 8px;
      font-size: 14px
    }

    input[type=text] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .25);
      background: rgba(255, 255, 255, .1);
      color: #fff
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 900
    }

    .btn-primary {
      background: linear-gradient(90deg, #ffd766, #ff9f1c);
      color: #111
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .3)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px
    }

    .chip {
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      padding: 6px 10px
    }

    /* === Listening Map === */
    #bubbleMap {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      min-height: 260px;
      padding: 8px
    }

    .bubble {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: rgba(255, 200, 80, .35);
      border: 1px solid rgba(255, 255, 255, .3);
      transition: .3s;
      animation: float 5s ease-in-out infinite
    }

    .bubble:hover {
      transform: scale(1.15);
      background: rgba(255, 220, 120, .6)
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-8px)
      }
    }

    /* === Artist Info === */
    #artistInfo img {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      margin-right: 8px;
      vertical-align: middle;
      object-fit: cover
    }

    #artistInfo div {
      margin-bottom: 8px
    }

    /* === Music Love === */
    #loveFill {
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffcc33, #ff8800);
      transition: width .6s ease
    }
  </style>
</head>

<body>
  <section id="title">
    <div class="hero">
      <div class="logo">MusicLens</div>
      <p>今日の気分で音を選んで、新しい自分を見つけよう。</p>
      <button id="startBtn" class="cta">SOUND JOURNEY ▶︎</button>
    </div>
  </section>

  <section id="app">
    <main class="container">
      <header class="header">
        <div class="titleSmall">MusicLens</div>
        <div style="display:flex;gap:10px;align-items:center">
          <button id="bgmBtn">🔊 BGM ON</button>
          <div id="backTop">← TOPへ戻る</div>
        </div>
      </header>

      <!-- Today's Feeling -->
      <section class="panel">
        <div class="section-title">Today's Feeling（いま聴きたいアーティストを入力）</div>
        <input id="inputBox" type="text" placeholder="例：Daft Punk, BLACKPINK, FKJ…">
        <div style="margin-top:8px">
          <button id="addBtn" class="btn btn-ghost">Add</button>
          <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
        </div>
        <div id="chips" class="chips"></div>
      </section>

      <!-- Listening Map + Artist Info -->
      <section class="panel">
        <div class="section-title">Listening Map（アーティスト分布）</div>
        <div id="bubbleMap"></div>
        <div id="artistInfo" style="margin-top:10px"></div>
      </section>

      <!-- Music Love -->
      <section class="panel">
        <div class="section-title">Music Love（音楽愛）</div>
        <div class="bar" style="height:12px;background:rgba(255,255,255,.1);border-radius:999px">
          <div id="loveFill" style="width:0%"></div>
        </div>
        <div id="lovePercent" style="margin-top:6px;text-align:right;font-size:13px">—%</div>
      </section>

    </main>
  </section>

  <script>
    /* === TOP→APP遷移 === */
    const title = document.getElementById('title');
    const app = document.getElementById('app');
    document.getElementById('startBtn').onclick = () => { title.style.display = 'none'; app.style.display = 'block'; requestAnimationFrame(() => app.classList.add('show')); startBGM(); }
    document.getElementById('backTop').onclick = () => { app.classList.remove('show'); app.style.display = 'none'; title.style.display = 'grid'; }

    /* === BGM：ハラカミ風メロディ（約1分） === */
    let AC, master, isPlaying = false;
    function ensureAC() { if (AC) return; AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.connect(AC.destination); master.gain.value = .6; }
    function startBGM() { ensureAC(); if (isPlaying) return; isPlaying = true; const t0 = AC.currentTime; const seq = [261, 293, 329, 392, 440, 392, 329, 293, 261]; seq.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(master); const t = t0 + i * 0.6; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.2, t + 0.1); g.gain.exponentialRampToValueAtTime(0.001, t + 0.55); o.start(t); o.stop(t + 0.6); }); setInterval(() => startBGM(), 60000); }
    function toggleBGM() { ensureAC(); if (isPlaying) { AC.suspend(); isPlaying = false; bgmBtn.textContent = "🔈 BGM OFF"; } else { AC.resume(); isPlaying = true; bgmBtn.textContent = "🔊 BGM ON"; } }
    document.getElementById('bgmBtn').onclick = toggleBGM;

    /* === アーティスト入力・リスト === */
    let TOKENS = []; const input = document.getElementById('inputBox'), chips = document.getElementById('chips');
    function renderChips() { chips.innerHTML = TOKENS.map((t, i) => `<span class="chip">${t}<a onclick="remove(${i})">✕</a></span>`).join(''); }
    function add() { if (!input.value.trim()) return; TOKENS.push(input.value.trim()); input.value = ''; renderChips(); }
    function remove(i) { TOKENS.splice(i, 1); renderChips(); }
    document.getElementById('addBtn').onclick = add;

    /* === Listening Map + Artist Info === */
    async function fetchArtistInfo(name) {
      try {
        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`); const j = await res.json();
        const image = j.thumbnail?.source || `https://picsum.photos/seed/${encodeURIComponent(name)}/100/100`;
        const desc = j.extract?.slice(0, 100) + "…" || "詳細情報なし";
        const country = ["🇯🇵 Tokyo", "🇺🇸 Los Angeles", "🇫🇷 Paris", "🇬🇧 London", "🇰🇷 Seoul", "🇨🇦 Toronto"];
        const loc = country[Math.floor(Math.random() * country.length)];
        return { name, image, desc, loc };
      } catch (_) { return { name, image: `https://picsum.photos/seed/${encodeURIComponent(name)}/100/100`, desc: "情報取得失敗", loc: "" }; }
    }
    async function renderBubbles() {
      const map = document.getElementById('bubbleMap');
      const info = document.getElementById('artistInfo');
      map.innerHTML = ""; info.innerHTML = "";
      const data = await Promise.all(TOKENS.map(fetchArtistInfo));
      data.forEach(d => {
        const b = document.createElement('div');
        b.className = 'bubble'; b.innerHTML = `<div>${d.name}</div><div style="font-size:10px">${d.loc}</div>`;
        b.onclick = () => window.open(`https://music.apple.com/us/search?term=${encodeURIComponent(d.name)}`, '_blank');
        map.appendChild(b);
        info.innerHTML += `<div><img src="${d.image}"/> <strong>${d.name}</strong>：${d.desc}</div>`;
      });
    }

    /* === Music Love（多様性スコア） === */
    function calcLove() {
      const n = TOKENS.length; const genres = [...new Set(TOKENS.map(t => t.toLowerCase().charAt(0)))].length;
      const score = Math.min(100, Math.round((n * 5) + (genres * 10)));
      document.getElementById('loveFill').style.width = score + '%';
      document.getElementById('lovePercent').textContent = score + '%';
    }

    /* === Analyze === */
    document.getElementById('analyzeBtn').onclick = async () => {
      if (!TOKENS.length) return;
      await renderBubbles(); calcLove(); TOKENS = []; renderChips();
    };
  </script>
</body>

</html>
