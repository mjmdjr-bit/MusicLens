<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MusicLens — Final v3.3</title>
  <style>
    :root {
      --gold: #ffcc33;
      --gold2: #ff8800;
      --ink: #0a0a0e;
      --ink2: #151722;
      --txt: #f9f9f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Roboto, sans-serif;
      background: linear-gradient(180deg, var(--ink), var(--ink2));
      color: var(--txt);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* === 背景パーティクル === */
    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* === TOP画面 === */
    #title {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .hero {
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-size: 60px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      -webkit-background-clip: text;
      color: transparent;
      animation: float 6s ease-in-out infinite, glow 3s ease-in-out infinite;
    }

    .hero p {
      margin-top: 10px;
      font-size: 16px;
      opacity: 0.9;
    }

    .cta {
      margin-top: 20px;
      padding: 12px 26px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      color: #111;
      font-weight: 900;
      cursor: pointer;
      transition: transform .3s, filter .3s;
    }

    .cta:hover {
      transform: scale(1.05);
      filter: brightness(1.2);
    }

    /* === スライド扉 === */
    #doorContainer {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }

    .door {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px) saturate(150%);
      transform: translateX(0);
      transition: transform 3s cubic-bezier(.25, .8, .25, 1);
    }

    body.doors-open .door.left {
      transform: translateX(-100%);
    }

    body.doors-open .door.right {
      transform: translateX(100%);
    }

    /* === メイン === */
    #app {
      display: none;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }

    #app.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 10;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    #backTop {
      color: #ffd36b;
      cursor: pointer;
      margin-top: 6px;
    }

    /* === パネル === */
    .panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px;
    }

    .section-title {
      font-weight: 800;
      color: #ffd36b;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type=text] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 900;
    }

    .btn-primary {
      background: linear-gradient(90deg, #ffd766, #ff9f1c);
      color: #111;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .3);
    }

    /* === Progress Bar === */
    #progressWrap {
      display: none;
      margin-top: 10px;
    }

    #progbar {
      height: 10px;
      background: rgba(255, 255, 255, .1);
      border-radius: 999px;
      overflow: hidden;
    }

    #progfill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffcc33, #ff8800);
      transition: width .3s ease;
    }

    #progtext {
      margin-top: 6px;
      font-size: 13px;
      text-align: right;
      color: #fff;
    }

    /* === Listening Map === */
    .bubble {
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      width: 100px;
      height: 100px;
      margin: 8px;
      display: inline-block;
      box-shadow: 0 0 20px rgba(255, 215, 80, 0.5);
      animation: floaty 6s ease-in-out infinite alternate, glow 3s ease-in-out infinite;
      cursor: pointer;
    }

    .bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(255, 215, 80, 0.4);
      }

      50% {
        box-shadow: 0 0 40px rgba(255, 215, 80, 0.9);
      }
    }

    /* === レスポンシブ === */
    @media(max-width:768px) {
      .logo {
        font-size: 42px;
      }

      .hero {
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <!-- === TOP === -->
  <section id="title">
    <div class="hero">
      <div class="logo">MusicLens</div>
      <p>あなたの音楽嗜好を分析して、音の旅へ。</p>
      <button id="startBtn" class="cta">SOUND JOURNEY ▶︎</button>
      <small>Produced by Daijiro Majima</small>
    </div>
  </section>

  <div id="doorContainer">
    <div class="door left"></div>
    <div class="door right"></div>
  </div>

  <!-- === MAIN APP === -->
  <section id="app">
    <main class="container">
      <header class="header">
        <div class="logo">MusicLens</div>
        <div id="backTop">← TOPへ戻る</div>
      </header>

      <!-- === Today's Feeling === -->
      <section class="panel">
        <div class="section-title">Today's Feeling（アーティストを入力）</div>
        <input id="inputBox" type="text" placeholder="例：Daft Punk, FKJ, Disclosure …（カンマ区切りOK）">
        <div style="margin-top:8px">
          <button id="addBtn" class="btn btn-ghost">Add</button>
          <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
        </div>
        <div id="chips" style="margin-top:8px"></div>
        <div id="progressWrap">
          <div id="progbar">
            <div id="progfill"></div>
          </div>
          <div id="progtext">0%</div>
        </div>
      </section>

      <section class="panel">
        <div class="section-title">Listening Map（音楽ジャンル別アーティスト）</div>
        <div id="mapArea"></div>
      </section>
    </main>
  </section>

  <script>
    /* === ページ遷移 === */
    document.getElementById("startBtn").onclick = () => {
      window.scrollTo(0, 0);
      document.body.classList.add("doors-open");
      setTimeout(() => {
        document.getElementById("title").style.display = "none";
        document.getElementById("app").classList.add("show");
      }, 3000);
    };
    document.getElementById("backTop").onclick = () => {
      document.getElementById("app").classList.remove("show");
      document.getElementById("title").style.display = "flex";
      document.body.classList.remove("doors-open");
    };

    /* === 背景パーティクル === */
    (function () {
      const cvs = document.getElementById('fx'), ctx = cvs.getContext('2d', { alpha: true });
      let W = 0, H = 0, stars = [];
      function size() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
      function make() { stars = Array.from({ length: 120 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: 1 + Math.random() * 2, a: .2 + .2 * Math.random() })); }
      function draw() { ctx.clearRect(0, 0, W, H); for (const s of stars) { s.x += s.vx; s.y += s.vy; if (s.x < 0 || s.x > W) s.vx *= -1; if (s.y < 0 || s.y > H) s.vy *= -1; const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 8); g.addColorStop(0, `rgba(255,255,200,${s.a})`); g.addColorStop(1, 'transparent'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 8, 0, 6.283); ctx.fill(); } requestAnimationFrame(draw); } addEventListener('resize', () => { size(); make(); }); size(); make(); draw();
    })();

    /* === Add / Analyze === */
    document.addEventListener("DOMContentLoaded", () => {
      let TOKENS = [];
      const input = document.getElementById("inputBox");
      const chips = document.getElementById("chips");
      const addBtn = document.getElementById("addBtn");
      const analyzeBtn = document.getElementById("analyzeBtn");

      function renderChips() {
        chips.innerHTML = TOKENS.map((t, i) => `<span style="margin:4px;padding:4px 10px;border:1px solid rgba(255,255,255,.3);border-radius:20px;display:inline-block;">${t}<a onclick="remove(${i})" style="margin-left:6px;cursor:pointer;">✕</a></span>`).join("");
      }

      window.remove = function (i) { TOKENS.splice(i, 1); renderChips(); }

      addBtn.addEventListener("click", () => {
        if (!input.value.trim()) return;
        const raw = input.value.replace(/，/g, ",");
        const items = raw.split(",").map(t => t.trim()).filter(Boolean);
        TOKENS.push(...items); input.value = ""; renderChips();
      });

      analyzeBtn.addEventListener("click", () => {
        if (!TOKENS.length) { alert("アーティストを追加してください。"); return; }
        runProgress(async () => {
          await renderMap();
          window.scrollTo(0, 0);
        });
      });

      const progressWrap = document.getElementById('progressWrap'),
        progressFill = document.getElementById('progfill'),
        progressText = document.getElementById('progtext');

      function runProgress(cb) {
        progressWrap.style.display = 'block'; let p = 0;
        const id = setInterval(() => {
          p += 5 + Math.random() * 4;
          if (p >= 100) {
            clearInterval(id); p = 100;
            progressFill.style.width = '100%'; progressText.textContent = '100%';
            setTimeout(() => { progressWrap.style.display = 'none'; cb(); }, 400);
          }
          else { progressFill.style.width = p + '%'; progressText.textContent = Math.floor(p) + '%'; }
        }, 80);
      }

      async function renderMap() {
        const map = document.getElementById("mapArea"); map.innerHTML = "";
        TOKENS.forEach(a => {
          const el = document.createElement("div");
          el.className = "bubble";
          el.innerHTML = `<img src="https://picsum.photos/seed/${encodeURIComponent(a)}/200/200" alt="${a}" title="${a}">`;
          el.onclick = () => showPopup(a);
          map.appendChild(el);
        });
      }
      /* === ポップアップ生成 === */
      const popup = document.createElement("div");
      popup.id = "popup";
      popup.style.cssText = `
  display: none; position: fixed; inset: 0;
  justify-content: center; align-items: center;
  background: rgba(0, 0, 0, 0.6);
  z-index: 999;
`;
      popup.innerHTML = `
  <div id="popupBox" style="
    max-width: 360px; width: 90%;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 16px;
    padding: 20px;
    color: #fff;
    text-align: center;
    backdrop-filter: blur(12px);
  ">
    <img id="popupImg" src="" alt="Artist" style="width:120px;height:120px;border-radius:50%;object-fit:cover;box-shadow:0 0 20px rgba(255,255,180,.4);">
    <h2 id="popupName" style="margin-top:10px;color:#ffd36b;"></h2>
    <p id="popupDesc" style="font-size:14px;opacity:0.9;margin-top:8px;"></p>
    <div style="margin-top:10px;">
      <a id="popupApple" target="_blank" style="margin-right:12px;color:#ffcc33;font-weight:bold;">Apple Music</a>
      <a id="popupYT" target="_blank" style="color:#ff6666;font-weight:bold;">YouTube</a>
    </div>
    <button id="popupClose" style="
      margin-top:14px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;">閉じる</button>
  </div>
`;
      document.body.appendChild(popup);

      /* === バブルクリックでポップアップ表示 === */
      async function showPopup(artistName) {
        try {
          const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(artistName)}&entity=musicArtist&limit=1`);
          const data = await res.json();
          const info = data.results[0];
          document.getElementById("popupImg").src = info?.artworkUrl100?.replace("100x100", "300x300") || `https://picsum.photos/seed/${encodeURIComponent(artistName)}/300/300`;
          document.getElementById("popupName").textContent = info?.artistName || artistName;
          document.getElementById("popupDesc").textContent = info?.primaryGenreName
            ? `${info.artistName} は ${info.primaryGenreName} 系アーティストです。`
            : `${artistName} に関する情報が見つかりません。`;
          document.getElementById("popupApple").href = `https://music.apple.com/us/search?term=${encodeURIComponent(artistName)}`;
          document.getElementById("popupYT").href = `https://www.youtube.com/results?search_query=${encodeURIComponent(artistName)}+official`;
          popup.style.display = "flex";
        } catch (e) {
          console.warn("Popup Error:", e);
        }
      }

      document.getElementById("popupClose").onclick = () => popup.style.display = "none";
      popup.onclick = (e) => { if (e.target === popup) popup.style.display = "none"; };

    });
  </script>
</body>

</html>
