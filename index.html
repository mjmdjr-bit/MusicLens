<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MusicLens — Living Music Edition v4.1</title>
  <style>
    :root {
      --gold: #ffcc33;
      --gold2: #ff8800;
      --ink: #0a0a0e;
      --ink2: #151722;
      --txt: #f9f9f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Roboto, sans-serif;
      background: linear-gradient(180deg, var(--ink), var(--ink2));
      color: var(--txt);
      overflow-x: hidden;
      min-height: 100vh;
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .logo {
      font-size: 60px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      -webkit-background-clip: text;
      color: transparent;
      animation: float 6s ease-in-out infinite, glow 3s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    @keyframes glow {

      0%,
      100% {
        filter: drop-shadow(0 0 0 rgba(255, 220, 120, 0))
      }

      50% {
        filter: drop-shadow(0 0 16px rgba(255, 220, 120, .75))
      }
    }

    #title {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .hero {
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
    }

    .cta {
      margin-top: 20px;
      padding: 12px 26px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      color: #111;
      font-weight: 900;
      cursor: pointer;
      transition: transform .3s, filter .3s;
    }

    .cta:hover {
      transform: scale(1.05);
      filter: brightness(1.2);
    }

    small {
      display: block;
      margin-top: 16px;
      text-align: center;
      color: #ccc;
      font-size: 14px;
    }

    #doorContainer {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }

    .door {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px) saturate(150%);
      transform: translateX(0);
      transition: transform 3s cubic-bezier(.25, .8, .25, 1);
    }

    body.doors-open .door.left {
      transform: translateX(-100%)
    }

    body.doors-open .door.right {
      transform: translateX(100%)
    }

    #app {
      display: none;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }

    #app.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 10;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    #backTop {
      color: #ffd36b;
      cursor: pointer;
      margin-top: 6px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px;
    }

    .section-title {
      font-weight: 800;
      color: #ffd36b;
      margin-bottom: 8px;
      font-size: 14px;
    }

    @media(max-width:768px) {
      .logo {
        font-size: 42px;
      }

      .hero {
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <section id="title">
    <div class="hero">
      <div class="logo">MusicLens</div>
      <p>あなたの音楽嗜好を分析して、音の旅へ。</p>
      <button id="startBtn" class="cta">SOUND JOURNEY ▶︎</button>
      <small>Produced by Daijiro Majima</small>
    </div>
  </section>

  <div id="doorContainer">
    <div class="door left"></div>
    <div class="door right"></div>
  </div>

  <section id="app">
    <main class="container">
      <header class="header">
        <div class="logo">MusicLens</div>
        <div id="backTop">← TOPへ戻る</div>
      </header>
      <!-- === Today's Feeling === -->
      <section class="panel">
        <div class="section-title">Today's Feeling（アーティストを入力）</div>
        <input id="inputBox" type="text" placeholder="例：Daft Punk, FKJ, Disclosure …（カンマ区切りOK）">
        <div style="margin-top:8px">
          <button id="addBtn" class="btn btn-ghost">Add</button>
          <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
        </div>
        <div id="chips" style="margin-top:8px"></div>
        <div id="progressWrap">
          <div id="progbar" style="height:10px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;">
            <div id="progfill" style="height:100%;width:0%;
              background:linear-gradient(90deg,#ffcc33,#ff8800);transition:width .3s ease;">
            </div>
          </div>
          <div id="progtext" style="font-size:13px;text-align:right;margin-top:6px;">0%</div>
        </div>
      </section>

      <!-- === Listening Map === -->
      <section class="panel">
        <div class="section-title">Listening Map（音楽ジャンル別アーティスト）</div>
        <div id="mapArea"></div>
      </section>

      <!-- === Music Love === -->
      <section class="panel" style="text-align:center">
        <div class="section-title">Music Love（音楽愛）</div>
        <svg id="loveSvg" viewBox="0 0 200 200" style="width:180px;height:180px;">
          <defs>
            <clipPath id="heartClip">
              <path id="heartGlass" d="M100 175c-3 0-6-.9-8.2-2.9C75 160 30 123 30 85 30 60 50 40 73 40
                   c12 0 24 6 31 15 7-9 19-15 31-15 23 0 43 20 43 45
                   0 38-45 75-61.8 87.1-2.2 2-5.2 2.9-8.2 2.9z" fill="rgba(255,255,255,0.08)" stroke="#ffcc33"
                stroke-width="2" />
            </clipPath>
            <linearGradient id="liquidGrad" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#ff9f1c" />
              <stop offset="100%" stop-color="#fff3b0" />
            </linearGradient>
          </defs>
          <g clip-path="url(#heartClip)">
            <rect id="liquid" x="20" y="160" width="160" height="60" fill="url(#liquidGrad)">
              <animate attributeName="y" dur="3s" values="160;150;160" repeatCount="indefinite" />
            </rect>
          </g>
        </svg>
        <div id="lovePercent" style="font-size:18px;margin-top:6px">—%</div>
        <div id="loveComment" style="margin-top:4px"></div>
      </section>

      <!-- === Your Music Vector === -->
      <section class="panel">
        <div class="section-title">Your Music Vector</div>
        <div id="profileBars"></div>
      </section>

      <!-- === Work Strengths === -->
      <section class="panel">
        <div class="section-title">Work Strengths</div>
        <div id="abilities"></div>
      </section>

      <!-- === Recommendations === -->
      <section class="panel">
        <div class="section-title">Music Recommendations</div>
        <div id="recs" class="small">Analyze後に表示されます。</div>
      </section>

      <!-- === BGM === -->
      <div style="text-align:center;margin-top:20px;">
        <audio id="bgm"
          src="https://cdn.pixabay.com/download/audio/2023/10/15/audio_3d51b4f83c.mp3?filename=fkj_tui_style.mp3"
          loop></audio>
        <button id="bgmToggle" style="background:none;border:none;color:#ffd36b;font-size:16px;cursor:pointer;">🔇
          停止</button>
      </div>

      <script>
        // === 背景パーティクル ===
        (function () {
          const cvs = document.getElementById('fx'), ctx = cvs.getContext('2d', { alpha: true });
          let W = 0, H = 0, stars = [];
          function size() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
          function make() { stars = Array.from({ length: 120 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: 1 + Math.random() * 2, a: .2 + .2 * Math.random() })); }
          function draw() {
            ctx.clearRect(0, 0, W, H);
            for (const s of stars) {
              s.x += s.vx; s.y += s.vy;
              if (s.x < 0 || s.x > W) s.vx *= -1; if (s.y < 0 || s.y > H) s.vy *= -1;
              const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 8);
              g.addColorStop(0, `rgba(255,255,200,${s.a})`); g.addColorStop(1, 'transparent');
              ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 8, 0, 6.283); ctx.fill();
            }
            requestAnimationFrame(draw);
          }
          addEventListener('resize', () => { size(); make(); });
          size(); make(); draw();
        })();
        // === 扉アニメーション ===
        document.getElementById("startBtn").onclick = () => {
          window.scrollTo(0, 0);
          document.body.classList.add("doors-open");
          setTimeout(() => {
            document.getElementById("title").style.display = "none";
            document.getElementById("app").classList.add("show");
          }, 3000);
        };

        document.getElementById("backTop").onclick = () => {
          document.getElementById("app").classList.remove("show");
          document.getElementById("title").style.display = "flex";
          document.body.classList.remove("doors-open");
        };

        // === 入力管理 ===
        let TOKENS = [];
        const input = document.getElementById("inputBox");
        const chips = document.getElementById("chips");

        document.getElementById("addBtn").onclick = () => {
          if (!input.value.trim()) return;
          const raw = input.value.replace(/，/g, ",");
          const items = raw.split(",").map(t => t.trim()).filter(Boolean);
          TOKENS.push(...items);
          input.value = "";
          chips.innerHTML = TOKENS.map((t, i) =>
            `<span style='margin:4px;padding:4px 10px;border:1px solid rgba(255,255,255,.3);
      border-radius:20px;display:inline-block;'>${t}
      <a onclick='TOKENS.splice(${i},1);
      chips.innerHTML=\"\"' style='margin-left:6px;cursor:pointer;'>✕</a></span>`
          ).join("");
        };

        // === Progressバー ===
        const progressWrap = document.getElementById("progressWrap"),
          progressFill = document.getElementById("progfill"),
          progressText = document.getElementById("progtext");

        function runProgress(cb) {
          progressWrap.style.display = 'block';
          let p = 0;
          const id = setInterval(() => {
            p += 5 + Math.random() * 4;
            if (p >= 100) {
              clearInterval(id);
              p = 100;
              progressFill.style.width = '100%';
              progressText.textContent = '100%';
              setTimeout(() => { progressWrap.style.display = 'none'; cb(); }, 400);
            } else {
              progressFill.style.width = p + '%';
              progressText.textContent = Math.floor(p) + '%';
            }
          }, 80);
        }

        // === ジャンル分類 ===
        function genreOf(name) {
          const n = name.toLowerCase();
          if (/pop/.test(n)) return "Pop";
          if (/rock|metal/.test(n)) return "Rock";
          if (/jazz/.test(n)) return "Jazz";
          if (/elect|techno|edm/.test(n)) return "Electronic";
          if (/world|latin|afro/.test(n)) return "World";
          return "Other";
        }

        // === Listening Map ===
        async function renderMap() {
          const map = document.getElementById("mapArea");
          map.innerHTML = "";
          const data = await Promise.all(TOKENS.map(async n => {
            const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(n)}&entity=musicArtist&limit=1`);
            const j = await r.json();
            const a = j.results?.[0];
            return {
              name: n,
              genre: genreOf(a?.primaryGenreName || n),
              img: a?.artworkUrl100?.replace("100x100", "300x300")
                || `https://picsum.photos/seed/${encodeURIComponent(n)}/300/300`
            };
          }));

          const colors = { Pop: "#ff77aa", Rock: "#ff5555", Jazz: "#66ccff", Electronic: "#aa88ff", World: "#77ff88", Other: "#ffd966" };
          Object.entries(groupBy(data, 'genre')).forEach(([g, arr]) => {
            const h = document.createElement('h3');
            h.textContent = g;
            h.style.cssText = `text-align:center;color:${colors[g]};margin:20px 0 10px;`;
            map.appendChild(h);
            arr.forEach(a => {
              const b = document.createElement("div");
              b.className = "bubble";
              b.style.width = b.style.height = (80 + Math.random() * 40) + "px";
              b.style.boxShadow = `0 0 30px ${colors[a.genre]}`;
              b.style.margin = "10px";
              b.innerHTML = `<img src='${a.img}' alt='${a.name}'
        style='width:100%;height:100%;border-radius:50%;object-fit:cover;'>`;
              b.onclick = () => showPopup(a.name);
              map.appendChild(b);
            });
          });
        }
        function groupBy(arr, key) { return arr.reduce((acc, a) => (acc[a[key]] = acc[a[key]] || [], acc[a[key]].push(a), acc), {}); }

        function showPopup(name) {
          fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(name)}&entity=musicArtist&limit=1`)
            .then(r => r.json()).then(j => {
              const a = j.results?.[0];
              const img = a?.artworkUrl100?.replace("100x100", "300x300")
                || `https://picsum.photos/seed/${encodeURIComponent(name)}/300/300`;
              const desc = a?.primaryGenreName
                ? `${a.artistName} は ${a.primaryGenreName} 系アーティストです。`
                : `${name} に関する情報が見つかりません。`;
              const apple = `https://music.apple.com/us/search?term=${encodeURIComponent(name)}`;
              const yt = `https://www.youtube.com/results?search_query=${encodeURIComponent(name)}+official`;

              const p = document.createElement('div');
              p.style.cssText = `
        position:fixed;inset:0;display:flex;justify-content:center;align-items:center;
        background:rgba(0,0,0,.6);z-index:999;animation:fadeIn .4s ease;`;
              p.innerHTML = `
        <div style='background:rgba(255,255,255,.12);padding:22px;border-radius:16px;
          text-align:center;backdrop-filter:blur(12px);max-width:340px;width:90%;
          color:#fff;box-shadow:0 0 25px rgba(255,215,100,.3);'>
          <img src='${img}' style='width:120px;height:120px;border-radius:50%;
            object-fit:cover;box-shadow:0 0 25px rgba(255,255,180,.5);'>
          <h3 style='color:#ffd36b;margin:10px 0 6px;'>${name}</h3>
          <p style='font-size:14px;opacity:.9;'>${desc}</p>
          <div style="margin-top:10px;">
            <a href='${apple}' target='_blank' style='color:#ffcc33;margin-right:12px;'>Apple Music</a>
            <a href='${yt}' target='_blank' style='color:#ff6666;'>YouTube</a>
          </div>
          <button style='margin-top:14px;padding:6px 18px;border-radius:8px;
            background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);
            cursor:pointer;'>閉じる</button>
        </div>`;
              p.querySelector("button").onclick = () => p.remove();
              p.onclick = e => { if (e.target === p) p.remove(); };
              document.body.appendChild(p);
            });
        }

        // === Vector / Work / Recommendations / Music Love ===
        function randomVec() {
          return {
            energy: Math.random(), sophistication: Math.random(),
            groove: Math.random(), structure: Math.random(),
            experiment: Math.random(), urban: Math.random(), global: Math.random()
          };
        }

        function drawProfile(v) { /* 略（前パートと同じ処理） */ }
        function drawAbilities(v) { /* 略（前パートと同じ処理） */ }
        async function renderRecs() { /* 略（前パートと同じ処理） */ }

        async function analyze() {
          if (!TOKENS.length) return;
          runProgress(async () => {
            await renderMap();
            calcLove();
            const v = randomVec();
            drawProfile(v);
            drawAbilities(v);
            await renderRecs();
            window.scrollTo(0, 0);
          });
        }
        document.getElementById("analyzeBtn").onclick = analyze;
      </script>

    </main>
  </section>
</body>

</html>
