<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MusicLens — Living Music Edition v4.3.1</title>
  <style>
    :root {
      --gold: #ffcc33;
      --gold2: #ff8800;
      --ink: #0a0a0e;
      --ink2: #151722;
      --txt: #f9f9f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: linear-gradient(180deg, var(--ink), var(--ink2));
      color: var(--txt);
      overflow-x: hidden;
      min-height: 100vh;
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .logo {
      font-size: 60px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      -webkit-background-clip: text;
      color: transparent;
      animation: float 6s ease-in-out infinite, glow 3s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    @keyframes glow {

      0%,
      100% {
        filter: drop-shadow(0 0 0 rgba(255, 220, 120, 0))
      }

      50% {
        filter: drop-shadow(0 0 16px rgba(255, 220, 120, .75))
      }
    }

    #title {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      z-index: 10;
    }

    .hero {
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
    }

    .cta {
      margin-top: 20px;
      padding: 12px 26px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      color: #111;
      font-weight: 900;
      cursor: pointer;
      transition: transform .3s, filter .3s;
    }

    .cta:hover {
      transform: scale(1.05);
      filter: brightness(1.2);
    }

    .hero small {
      display: block;
      margin-top: 14px;
      color: #ccc;
    }

    #doorContainer {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }

    .door {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      transform: translateX(0);
      transition: transform 3s cubic-bezier(.25, .8, .25, 1);
    }

    body.doors-open .door.left {
      transform: translateX(-100%)
    }

    body.doors-open .door.right {
      transform: translateX(100%)
    }

    #app {
      display: none;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }

    #app.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      z-index: 10;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    #backTop {
      color: #ffd36b;
      cursor: pointer;
      margin-top: 6px;
    }

    input[type=text] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .25);
      background: rgba(255, 255, 255, .1);
      color: #fff;
      font-size: 16px;
      outline: none;
      backdrop-filter: blur(8px);
    }

    .btn {
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: .3s;
    }

    .btn-primary {
      background: linear-gradient(90deg, #ffcc33, #ff8800);
      color: #111;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .25);
      color: #fff;
    }

    .panel {
      background: rgba(255, 255, 255, .05);
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px;
    }

    .section-title {
      font-weight: 800;
      color: #ffd36b;
      margin-bottom: 8px;
      font-size: 14px;
    }

    #mapArea {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      /* ← バブル余白最適化 */
    }

    #loveSvg {
      width: 220px;
      height: 220px;
      margin: auto;
      display: block;
    }

    #heartOutline {
      stroke: #FFD700;
      stroke-width: 3;
      fill: rgba(255, 255, 255, 0.05);
    }

    @media(max-width:768px) {
      .logo {
        font-size: 42px
      }

      .hero {
        padding: 24px
      }
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <section id="title">
    <div class="hero">
      <div class="logo">MusicLens</div>
      <p>あなたの音楽嗜好を分析して、音の旅へ。</p>
      <button id="startBtn" class="cta">SOUND JOURNEY ▶︎</button>
      <small>Produced by Daijiro Majima</small>
    </div>
  </section>

  <div id="doorContainer">
    <div class="door left"></div>
    <div class="door right"></div>
  </div>

  <section id="app">
    <main class="container">
      <header class="header">
        <div class="logo">MusicLens</div>
        <div id="backTop">← TOPへ戻る</div>
      </header>

      <section class="panel">
        <div class="section-title">Today's Feeling（アーティストを入力）</div>
        <input id="inputBox" type="text" placeholder="例：Daft Punk, FKJ, Disclosure …（カンマ区切りOK）">
        <div style="margin-top:8px">
          <button id="addBtn" class="btn btn-ghost">Add</button>
          <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
        </div>
        <div id="chips" style="margin-top:8px"></div>
      </section>

      <section class="panel">
        <div class="section-title">Listening Map（アーティスト一覧）</div>
        <div id="mapArea"></div>
      </section>

      <section class="panel" style="text-align:center">
        <div class="section-title">Music Love（音楽愛）</div>
        <svg id="loveSvg" viewBox="0 0 200 200">
          <clipPath id="heartClip">
            <path id="heartOutline" d="M100 175c-3 0-6-.9-8.2-2.9C75 160 30 123 30 85
          30 60 50 40 73 40c12 0 24 6 31 15 7-9 19-15 31-15
          23 0 43 20 43 45 0 38-45 75-61.8 87.1-2.2 2-5.2 2.9-8.2 2.9z" stroke="#FFD700" stroke-width="3"
              fill="rgba(255,255,255,0.05)" />
          </clipPath>
          <linearGradient id="liquidGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#ff9f1c" />
            <stop offset="100%" stop-color="#fff3b0" />
          </linearGradient>
          <g clip-path="url(#heartClip)">
            <rect id="liquid" x="20" y="160" width="160" height="60" fill="url(#liquidGrad)">
              <animate attributeName="y" dur="4s" values="160;150;160" repeatCount="indefinite" />
            </rect>
          </g>
        </svg>
        <div id="lovePercent" style="font-size:18px;margin-top:6px">—%</div>
        <div id="loveComment" style="margin-top:4px"></div>
      </section>
      <section class="panel">
        <div class="section-title">Your Music Vector</div>
        <div id="profileBars"></div>
      </section>

      <section class="panel">
        <div class="section-title">Work Strengths</div>
        <div id="abilities"></div>
      </section>

      <section class="panel">
        <div class="section-title">Music Recommendations</div>
        <div id="recs" class="small">Analyze後に表示されます。</div>
      </section>

      <div id="bgmTitle" style="text-align:center;margin:20px;color:#ffd36b;">🎧 BGM: FKJ – TUI</div>
      <button id="bgmToggle" class="btn btn-primary" style="display:block;margin:10px auto;">🔇 停止</button>
      <audio id="bgm" src="https://cdn.pixabay.com/download/audio/2023/03/07/audio_9bba87c1ee.mp3?filename=fkj-tui.mp3"
        loop></audio>
    </main>
  </section>

  <script>
    // === 背景パーティクル ===
    (function () {
      const cvs = document.getElementById('fx'), ctx = cvs.getContext('2d', { alpha: true });
      let W = 0, H = 0, stars = [];
      function size() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
      function make() {
        stars = Array.from({ length: 120 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: 1 + Math.random() * 2, a: .2 + .2 * Math.random() }));
      }
      function draw() {
        ctx.clearRect(0, 0, W, H);
        for (const s of stars) {
          s.x += s.vx; s.y += s.vy;
          if (s.x < 0 || s.x > W) s.vx *= -1; if (s.y < 0 || s.y > H) s.vy *= -1;
          const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 8);
          g.addColorStop(0, `rgba(255,255,200,${s.a})`);
          g.addColorStop(1, 'transparent');
          ctx.fillStyle = g; ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 8, 0, 6.283); ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      addEventListener('resize', () => { size(); make(); });
      size(); make(); draw();
    })();

    // === 扉アニメーション + Safari用BGM起動 ===
    document.getElementById("startBtn").onclick = () => {
      const bgm = document.getElementById("bgm");
      bgm.play().catch(() => { }); // ← Safari対応：ユーザー操作でトリガー
      window.scrollTo(0, 0);
      document.body.classList.add("doors-open");
      setTimeout(() => {
        document.getElementById("title").style.display = "none";
        document.getElementById("app").classList.add("show");
      }, 3000);
    };
    document.getElementById("backTop").onclick = () => {
      document.getElementById("app").classList.remove("show");
      document.getElementById("title").style.display = "flex";
      document.body.classList.remove("doors-open");
    };

    // === 入力管理 ===
    let TOKENS = [];
    const input = document.getElementById("inputBox");
    const chips = document.getElementById("chips");
    document.getElementById("addBtn").onclick = () => {
      if (!input.value.trim()) return;
      const raw = input.value.replace(/，/g, ",");
      const items = raw.split(",").map(t => t.trim()).filter(Boolean);
      TOKENS.push(...items); input.value = "";
      chips.innerHTML = TOKENS.map((t, i) =>
        `<span style='margin:4px;padding:4px 10px;border:1px solid rgba(255,255,255,.3);
          border-radius:20px;display:inline-block;'>${t}
          <a onclick='TOKENS.splice(${i},1);chips.innerHTML=\"\"' style='margin-left:6px;cursor:pointer;'>✕</a></span>`).join("");
    };

    // === Progressバー ===
    const progressWrap = document.getElementById("progressWrap"),
      progressFill = document.getElementById("progfill"),
      progressText = document.getElementById("progtext");
    function runProgress(cb) {
      progressWrap.style.display = 'block';
      let p = 0;
      const id = setInterval(() => {
        p += 5 + Math.random() * 4;
        if (p >= 100) {
          clearInterval(id); p = 100;
          progressFill.style.width = '100%';
          progressText.textContent = '100%';
          setTimeout(() => { progressWrap.style.display = 'none'; cb(); }, 400);
        } else {
          progressFill.style.width = p + '%';
          progressText.textContent = Math.floor(p) + '%';
        }
      }, 80);
    }
    /* === Music Love === */
    function calcLove() {
      const n = TOKENS.length; if (!n) return;
      const score = Math.min(100, Math.round(n * 10 + Math.random() * 30));
      document.getElementById("lovePercent").textContent = score + "%";
      const c = document.getElementById("loveComment");
      if (score < 40) c.textContent = "音楽の鼓動が静かに始まっています。";
      else if (score < 70) c.textContent = "音楽が心のリズムに寄り添いはじめました。";
      else c.textContent = "音楽とあなたの鼓動が完全に共鳴しています。";
    }

    /* === Vector & Work Strengths === */
    function randomVec() {
      return {
        energy: Math.random(), sophistication: Math.random(),
        groove: Math.random(), structure: Math.random(),
        experiment: Math.random(), urban: Math.random(), global: Math.random()
      };
    }

    function drawProfile(v) {
      const el = document.getElementById("profileBars");
      el.innerHTML = "";
      const labels = {
        energy: "エネルギー", sophistication: "洗練", groove: "ノリ",
        structure: "構成力", experiment: "実験性", urban: "都会感", global: "グローバル感"
      };
      for (const [k, val] of Object.entries(v)) {
        const pct = Math.round(val * 100);
        const wrap = document.createElement("div");
        wrap.innerHTML = `
      <div class="kpi"><div>${labels[k]}</div><div>${pct}%</div></div>
      <div class="bar"><div class="fill" style="width:0%;transition:width 1s;"></div></div>`;
        el.appendChild(wrap);
        setTimeout(() => wrap.querySelector(".fill").style.width = pct + "%", 300); // ← delayを300msに
      }
    }

    function drawAbilities(v) {
      const el = document.getElementById("abilities");
      el.innerHTML = "";
      const factors = {
        collaboration: (v.groove + v.urban) / 2, planning: (v.structure + v.sophistication) / 2,
        creativity: (v.experiment + v.energy) / 2, empathy: (v.urban + v.global) / 2, leadership: (v.energy + v.structure) / 2
      };
      const labels = {
        collaboration: "協働力", planning: "計画力", creativity: "創造力",
        empathy: "共感力", leadership: "リーダーシップ"
      };
      for (const [k, val] of Object.entries(factors)) {
        const pct = Math.round(val * 100);
        const wrap = document.createElement("div");
        wrap.innerHTML = `
      <div class="kpi"><div>${labels[k]}</div><div>${pct}%</div></div>
      <div class="bar"><div class="fill" style="width:0%;transition:width 1s;"></div></div>`;
        el.appendChild(wrap);
        setTimeout(() => wrap.querySelector(".fill").style.width = pct + "%", 300); // ← delayを300msに
      }
    }

    /* === Recommendations === */
    async function fetchITunesPreview(n) {
      try {
        const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(n)}&entity=musicArtist&limit=3`);
        const j = await r.json(); return j.results.map(a => ({
          name: a.artistName,
          art: a.artworkUrl100?.replace("100x100", "200x200"),
          link: `https://music.apple.com/us/search?term=${encodeURIComponent(a.artistName)}`
        }));
      } catch { return []; }
    }

    async function renderRecs() {
      const recEl = document.getElementById("recs");
      recEl.innerHTML = "<p>音楽を分析中...</p>";
      const all = [];
      for (const n of TOKENS) { const rs = await fetchITunesPreview(n); all.push(...rs); }
      const unique = Array.from(new Map(all.map(a => [a.name, a])).values()).slice(0, 6);
      recEl.innerHTML = unique.map(a => `
    <div style="display:flex;align-items:center;gap:10px;margin:8px 0;">
      <img src="${a.art}" style="width:50px;height:50px;border-radius:8px;object-fit:cover;"/>
      <div>
        <strong>${a.name}</strong><br>
        <a href="${a.link}" target="_blank" style="color:#ffe28a">Apple Music</a> /
        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(a.name + ' official')}"
           target="_blank" style="color:#ff6666">YouTube</a>
      </div>
    </div>`).join('');
    }

    /* === Analyze === */
    async function analyze() {
      if (!TOKENS.length) return;
      runProgress(async () => {
        await renderMap();
        calcLove();
        const v = randomVec();
        drawProfile(v);
        drawAbilities(v);
        await renderRecs();
        window.scrollTo(0, 0);
      });
    }
    document.getElementById("analyzeBtn").onclick = analyze;

    /* === BGM & Glow/Heart同期 === */
    const bgm = document.getElementById("bgm");
    const btn = document.getElementById("bgmToggle");
    let playing = true; bgm.volume = 0.4;
    btn.onclick = () => {
      if (playing) { bgm.pause(); btn.textContent = "▶️ 再生"; }
      else { bgm.play(); btn.textContent = "🔇 停止"; } playing = !playing;
    };
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();
    const src = ctx.createMediaElementSource(bgm);
    const analyser = ctx.createAnalyser();
    src.connect(analyser); analyser.connect(ctx.destination);
    analyser.fftSize = 256; const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    function animateBeat() {
      requestAnimationFrame(animateBeat);
      analyser.getByteFrequencyData(dataArray);
      const avg = dataArray.reduce((a, b) => a + b, 0) / bufferLength;
      const scale = 1 + avg / 300;
      const glow = Math.min(1, avg / 200);
      const liquid = document.getElementById("liquid");
      if (liquid) liquid.setAttribute("transform", `scale(${scale})`);
      document.querySelectorAll(".bubble").forEach(b => {
        b.style.filter = `brightness(${1 + glow}) drop-shadow(0 0 ${20 + avg / 8}px rgba(255,255,180,${0.3 + glow / 2}))`;
      });
    }
    bgm.onplay = async () => { if (ctx.state === "suspended") await ctx.resume(); animateBeat(); };
  </script>
  </main>
  </section>
</body>

</html>
