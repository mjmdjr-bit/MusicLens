<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MusicLens — Final Edition</title>
  <style>
    :root {
      --gold: #ffcc33;
      --gold2: #ff8800;
      --ink: #0a0a0e;
      --ink2: #151722;
      --txt: #eef2ff;
      --muted: #a9b2c7;
      --glass: rgba(255, 255, 255, .18);
      --stroke: rgba(255, 255, 255, .22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Roboto, Segoe UI, sans-serif;
      background: linear-gradient(180deg, var(--ink), var(--ink2));
      color: var(--txt);
      overflow-x: hidden;
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none
    }

    /* === TOP === */
    #title {
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
      position: relative;
      z-index: 2
    }

    .hero {
      max-width: 900px;
      padding: 40px;
      border: 1px solid var(--stroke);
      border-radius: 28px;
      background: linear-gradient(180deg, var(--glass), rgba(255, 255, 255, .07));
      backdrop-filter: blur(22px)
    }

    .logo {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: .5px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: float 6s ease-in-out infinite, shine 5s linear infinite, glow 3s ease-in-out infinite;
      text-shadow: 0 0 0 rgba(255, 255, 200, 0);
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    @keyframes shine {
      0% {
        background-position: 0% 50%
      }

      100% {
        background-position: 300% 50%
      }
    }

    @keyframes glow {

      0%,
      100% {
        filter: drop-shadow(0 0 0 rgba(255, 220, 120, .0))
      }

      50% {
        filter: drop-shadow(0 0 16px rgba(255, 220, 120, .75))
      }
    }

    .cta {
      margin-top: 20px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      color: #111;
      font-weight: 900;
      cursor: pointer
    }

    .hero small {
      display: block;
      margin-top: 14px;
      color: #ccc
    }

    /* === APP 共通 === */
    #app {
      display: none;
      opacity: 0;
      transition: opacity .6s ease
    }

    #app.show {
      display: block;
      opacity: 1
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px
    }

    .titleSmall {
      font-weight: 900;
      font-size: 20px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    #backTop {
      color: #ffe28a;
      text-decoration: underline;
      cursor: pointer;
      font-size: 14px
    }

    /* Panels */
    .panel {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px
    }

    .section-title {
      font-weight: 800;
      color: #ffd36b;
      margin-bottom: 8px;
      font-size: 14px
    }

    input[type=text] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .25);
      background: rgba(255, 255, 255, .1);
      color: #fff
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 900
    }

    .btn-primary {
      background: linear-gradient(90deg, #ffd766, #ff9f1c);
      color: #111
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .3)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px
    }

    .chip {
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      padding: 6px 10px
    }

    /* Progress */
    #progressWrap {
      margin-top: 10px;
      display: none
    }

    #progbar {
      height: 10px;
      background: rgba(255, 255, 255, .1);
      border-radius: 999px;
      overflow: hidden
    }

    #progfill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffcc33, #ff8800);
      transition: width .3s ease
    }

    #progtext {
      margin-top: 6px;
      font-size: 13px;
      text-align: right
    }

    /* Listening Map */
    .genreGroup {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin: 30px 0;
      justify-content: center;
      position: relative
    }

    .genreTitle {
      font-weight: 800;
      font-size: 16px;
      color: #ffd36b;
      margin: 10px 0;
      text-transform: uppercase;
      letter-spacing: .4px
    }

    .bubble {
      position: relative;
      border-radius: 50%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      color: #fff;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      width: 120px;
      height: 120px;
      border: 2px solid currentColor;
      box-shadow: 0 0 20px currentColor;
      animation: floaty 6s ease-in-out infinite alternate;
      transition: transform .25s ease;
    }

    .bubble:hover {
      transform: scale(1.08)
    }

    .bubble::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, .3) 0%, transparent 70%);
      z-index: 0
    }

    .bubble span {
      position: absolute;
      bottom: 6px;
      left: 6px;
      right: 6px;
      font-size: 11px;
      font-weight: 700;
      z-index: 1;
      background: rgba(0, 0, 0, .35);
      border-radius: 8px;
      padding: 2px 4px;
      text-transform: uppercase;
      letter-spacing: .5px
    }

    .bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      z-index: 0
    }

    @keyframes floaty {
      0% {
        transform: translateY(0)
      }

      100% {
        transform: translateY(-10px)
      }
    }

    /* Music Love：ピンクすりガラス＋金色アウトライン＋液面 */
    #loveSvg {
      width: 220px;
      height: 220px;
      margin: 20px auto;
      filter: drop-shadow(0 0 10px rgba(255, 200, 255, .5))
    }

    #heartGlass {
      fill: rgba(255, 182, 193, 0.2);
      stroke: rgba(255, 215, 0, 0.95);
      stroke-width: 2.2;
      backdrop-filter: blur(12px);
    }

    #liquid {
      animation: wave 4s ease-in-out infinite alternate
    }

    @keyframes wave {
      0% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-4px)
      }

      100% {
        transform: translateY(0)
      }
    }

    /* Bars */
    .kpi {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      margin: 6px 0
    }

    .bar {
      height: 10px;
      background: rgba(255, 255, 255, .12);
      border-radius: 999px;
      overflow: hidden
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #ffcc33, #ff8800);
      width: 0%
    }

    .insight {
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      color: #111;
      font-weight: 700
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <!-- TOP -->
  <section id="title">
    <div class="hero">
      <div class="logo">MusicLens</div>
      <p>今日の気分で音を選んで、新しい自分を見つけよう。</p>
      <button id="startBtn" class="cta">SOUND JOURNEY ▶︎</button>
      <small>Produced by Daijiro Majima</small>
    </div>
  </section>
  <!-- APP -->
  <section id="app">
    <main class="container">
      <header class="header">
        <div class="titleSmall">MusicLens</div>
        <div id="backTop">← TOPへ戻る</div>
      </header>

      <!-- Today's Feeling -->
      <section class="panel">
        <div class="section-title">Today's Feeling（いま聴きたいアーティストを入力）</div>
        <input id="inputBox" type="text" placeholder='例：Daft Punk, Disclosure, 7co,…（カンマ区切りOK）' maxlength="300">
        <div style="margin-top:8px">
          <button id="addBtn" class="btn btn-ghost">Add</button>
          <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
        </div>
        <div id="chips" class="chips"></div>
        <div id="progressWrap">
          <div id="progbar">
            <div id="progfill"></div>
          </div>
          <div id="progtext">0%</div>
        </div>
      </section>

      <!-- Listening Map -->
      <section class="panel">
        <div class="section-title">Listening Map（音楽ジャンル別アーティスト）</div>
        <div id="mapArea"></div>
      </section>

      <!-- Music Love -->
      <section class="panel" style="text-align:center">
        <div class="section-title">Music Love（音楽愛）</div>
        <svg id="loveSvg" viewBox="0 0 200 200">
          <defs>
            <clipPath id="heartClip">
              <path id="heartGlass"
                d="M100 175c-3 0-6-.9-8.2-2.9C75 160 30 123 30 85 30 60 50 40 73 40c12 0 24 6 31 15 7-9 19-15 31-15 23 0 43 20 43 45 0 38-45 75-61.8 87.1-2.2 2-5.2 2.9-8.2 2.9z" />
            </clipPath>
            <linearGradient id="liquidGrad" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#ff9f1c" />
              <stop offset="100%" stop-color="#fff3b0" />
            </linearGradient>
          </defs>
          <use href="#heartGlass" />
          <g clip-path="url(#heartClip)">
            <rect id="liquid" x="20" y="150" width="160" height="60" fill="url(#liquidGrad)" />
          </g>
        </svg>
        <div id="lovePercent" style="font-size:18px;margin-top:6px">—%</div>
        <div id="loveComment" class="small" style="margin-top:4px"></div>
      </section>

      <!-- Vector -->
      <section class="panel">
        <div class="section-title">Your Music Vector</div>
        <div id="profileBars"></div>
        <div id="vectorInsight" class="insight" style="display:none"></div>
      </section>

      <!-- Work -->
      <section class="panel">
        <div class="section-title">Work Strengths</div>
        <div id="abilities"></div>
        <div id="abilitiesInsight" class="insight" style="display:none"></div>
      </section>

      <!-- Recommendations -->
      <section class="panel">
        <div class="section-title">Music Recommendations</div>
        <div id="recs" class="small">Analyze後に表示されます。</div>
      </section>
    </main>
  </section>

  <!-- Popup（アーティスト詳細） -->
  <div id="popup"
    style="display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;background:rgba(0,0,0,.6)">
    <div id="popBox"
      style="max-width:360px;width:92%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:16px;text-align:center">
      <img id="popImg" src="" alt="" style="width:110px;height:110px;border-radius:50%;object-fit:cover" />
      <div id="popName" style="font-weight:800;margin:8px 0 4px"></div>
      <div id="popDesc" style="font-size:13px;margin-bottom:10px;line-height:1.5"></div>
      <div style="display:flex;gap:12px;justify-content:center;align-items:center">
        <!-- Apple Music ロゴ -->
        <a id="popApple" target="_blank" aria-label="Apple Music" title="Apple Music">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#ff2d55">
            <circle cx="12" cy="12" r="10" />
            <path d="M16 7l-6 1.2V15a2 2 0 11-1-1.732V7.8L16 6v6a2 2 0 11-1-1.732V7z" fill="#fff" />
          </svg>
        </a>
        <!-- YouTube ロゴ -->
        <a id="popYT" target="_blank" aria-label="YouTube" title="YouTube">
          <svg width="30" height="30" viewBox="0 0 24 24">
            <path fill="#FF0000"
              d="M23.5 6.2s-.2-1.6-.8-2.3c-.8-.8-1.7-.8-2.1-.9C17.2 2.6 12 2.6 12 2.6h0s-5.2 0-8.6.4c-.4 0-1.3.1-2.1.9C.7 4.6.5 6.2.5 6.2S.3 8.1.3 10v1.9c0 1.9.2 3.8.2 3.8s.2 1.6.8 2.3c.8.8 1.9.8 2.3.9 1.7.2 7.4.4 7.4.4s5.2 0 8.6-.4c.4-.1 1.3-.1 2.1-.9.6-.7.8-2.3.8-2.3s.2-1.9.2-3.8V10c0-1.9-.2-3.8-.2-3.8z" />
            <path fill="#fff" d="M9.8 8.5l6 3.5-6 3.5z" />
          </svg>
        </a>
        <!-- Wikipedia ロゴ -->
        <a id="popWiki" target="_blank" aria-label="Wikipedia" title="Wikipedia">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff">
            <path d="M4 5h3l4 11 4-11h3l-5 14h-3z" />
          </svg>
        </a>
      </div>
      <button id="popClose" class="btn btn-ghost" style="margin-top:10px">閉じる</button>
    </div>
  </div>
  <script>
    /* === ページ遷移 === */
    document.addEventListener("DOMContentLoaded", () => {
      const title = document.getElementById("title"), app = document.getElementById("app");
      document.getElementById("startBtn").onclick = () => { title.style.display = "none"; app.style.display = "block"; requestAnimationFrame(() => app.classList.add("show")); }
      document.getElementById("backTop").onclick = () => { app.classList.remove("show"); app.style.display = "none"; title.style.display = "grid"; }
    });

    /* === 背景パーティクル === */
    (function () {
      const cvs = document.getElementById('fx'), ctx = cvs.getContext('2d', { alpha: true });
      let W = 0, H = 0, stars = [];
      function size() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
      function make() { stars = Array.from({ length: 160 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: 1 + Math.random() * 2, a: .2 + .2 * Math.random() })); }
      function draw() { ctx.clearRect(0, 0, W, H); for (const s of stars) { s.x += s.vx; s.y += s.vy; if (s.x < 0 || s.x > W) s.vx *= -1; if (s.y < 0 || s.y > H) s.vy *= -1; const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 8); g.addColorStop(0, `rgba(255,255,200,${s.a})`); g.addColorStop(1, 'transparent'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 8, 0, 6.283); ctx.fill(); } requestAnimationFrame(draw); } addEventListener('resize', () => { size(); make(); }); size(); make(); draw();
    })();

    /* === 入力（CSV対応：カンマ区切り） === */
    let TOKENS = []; const input = document.getElementById('inputBox'), chips = document.getElementById('chips');
    function renderChips() { chips.innerHTML = TOKENS.map((t, i) => `<span class="chip">${t}<a onclick="remove(${i})">✕</a></span>`).join(''); }
    function addFromText(text) { const parts = (text || '').split(',').map(s => s.trim()).filter(Boolean); for (const p of parts) { if (TOKENS.length >= 20) break; if (!TOKENS.includes(p)) TOKENS.push(p); } renderChips(); }
    function add() { if (!input.value.trim()) return; addFromText(input.value); input.value = ''; }
    function remove(i) { TOKENS.splice(i, 1); renderChips(); }
    document.getElementById('addBtn').onclick = add;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } });

    /* === 進捗バー === */
    const progressWrap = document.getElementById('progressWrap'), progressFill = document.getElementById('progfill'), progressText = document.getElementById('progtext');
    function runProgress(cb) { progressWrap.style.display = 'block'; let p = 0; const id = setInterval(() => { p += 4 + Math.random() * 5; if (p >= 100) { clearInterval(id); p = 100; progressFill.style.width = '100%'; progressText.textContent = '100%'; setTimeout(() => { progressWrap.style.display = 'none'; cb(); }, 300); } else { progressFill.style.width = p + '%'; progressText.textContent = Math.floor(p) + '%'; } }, 80); }

    /* === ジャンル関数 === */
    const genreColors = { Pop: '#ff66cc', Jazz: '#66ccff', Rock: '#ff6666', Electronic: '#aa88ff', World: '#77ff88', Other: '#ffd966' };
    function genreOf(n) { n = (n || '').toLowerCase(); if (/jazz/.test(n)) return 'Jazz'; if (/rock|metal/.test(n)) return 'Rock'; if (/pop/.test(n)) return 'Pop'; if (/elect|techno|edm/.test(n)) return 'Electronic'; if (/world|latin|afro/.test(n)) return 'World'; return 'Other'; }

    /* === Popup制御 === */
    const popup = document.getElementById('popup'), popImg = document.getElementById('popImg'), popName = document.getElementById('popName'),
      popDesc = document.getElementById('popDesc'), popApple = document.getElementById('popApple'),
      popYT = document.getElementById('popYT'), popWiki = document.getElementById('popWiki'),
      popClose = document.getElementById('popClose'); popClose.onclick = () => popup.style.display = 'none';

    /* === Spotify 接続（Bearerを入れてね） === */
    const SPOTIFY_TOKEN = "YOUR_SPOTIFY_BEARER_TOKEN";  // ← ここに Bearer トークン
    const SP_BASE = "https://api.spotify.com/v1";

    async function spFetch(path) {
      if (!SPOTIFY_TOKEN) throw new Error("No Spotify token");
      const r = await fetch(SP_BASE + path, { headers: { Authorization: `Bearer ${SPOTIFY_TOKEN}` } });
      if (!r.ok) throw new Error("Spotify API error"); return r.json();
    }
    async function spSearchArtistByName(name) {
      try {
        const j = await spFetch(`/search?type=artist&limit=1&q=${encodeURIComponent(name)}`);
        const a = j.artists.items[0]; if (!a) return null;
        const img = a.images?.[0]?.url || ""; return { id: a.id, name: a.name, genres: a.genres || [], image: img, followers: a.followers?.total || 0 };
      }
      catch (e) { return null }
    }
    async function spRelatedArtists(id) {
      try { const j = await spFetch(`/artists/${id}/related-artists`); return (j.artists || []).map(a => ({ id: a.id, name: a.name, genres: a.genres || [], image: a.images?.[0]?.url || "" })) }
      catch (e) { return [] }
    }
    async function spArtistTopTracksFeatures(id) {
      try {
        const top = await spFetch(`/artists/${id}/top-tracks?market=US`);
        const ids = (top.tracks || []).slice(0, 5).map(t => t.id);
        if (!ids.length) return null;
        const feats = await spFetch(`/audio-features?ids=${ids.join(',')}`);
        const arr = (feats.audio_features || []).filter(Boolean);
        if (!arr.length) return null;
        // 平均化
        const avg = k => arr.reduce((s, x) => s + (x[k] || 0), 0) / arr.length;
        return {
          energy: avg('energy'),
          danceability: avg('danceability'),
          valence: avg('valence'),
          acousticness: avg('acousticness'),
          instrumentalness: avg('instrumentalness'),
          tempo: avg('tempo'),
          liveness: avg('liveness'),
          speechiness: avg('speechiness')
        };
      } catch (e) { return null }
    }

    /* === Wikipedia / iTunes フォールバック === */
    async function fetchWikiSummary(n) { try { const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(n)}`); const j = await r.json(); return { image: j.thumbnail?.source || "", desc: j.extract?.slice(0, 140) + "…" || "情報なし" } } catch { return { image: "", desc: "情報取得失敗" } } }
    async function fetchITunesPreview(n) { try { const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(n)}&entity=musicTrack&limit=1`); const j = await r.json(); const t = j.results?.[0]; return { preview: t?.previewUrl || "", art: t?.artworkUrl100?.replace('100x100', '200x200') || "" } } catch { return { preview: "", art: "" } } }

    /* === Map（ジャンル別分散・写真＋名前・ポップアップ） === */
    const mapArea = document.getElementById('mapArea');
    async function fetchArtistCard(name) {
      // 1) Spotify優先
      const sp = await spSearchArtistByName(name);
      let img = "", desc = ""; let id = null; let genres = [];
      if (sp) { img = sp.image; id = sp.id; genres = sp.genres; }
      // 2) Wiki補完
      if (!img) { const w = await fetchWikiSummary(name); img = w.image || img; desc = w.desc; }
      if (!desc) { const w = await fetchWikiSummary(name); desc = w.desc; }
      return { name, img: img || `https://picsum.photos/seed/${encodeURIComponent(name)}/160/160`, desc, id, genres };
    }
    async function renderMap() {
      mapArea.innerHTML = "";
      const cards = await Promise.all(TOKENS.map(n => fetchArtistCard(n)));
      const byGenre = {};
      cards.forEach(a => {
        const g = a.genres?.[0] ? genreOf(a.genres[0]) : genreOf(a.name);
        (byGenre[g] ??= []).push(a);
      });
      for (const [g, arr] of Object.entries(byGenre)) {
        const gEl = document.createElement('div'); gEl.className = 'genreGroup';
        const title = document.createElement('div'); title.className = 'genreTitle'; title.textContent = g; gEl.appendChild(title);
        arr.forEach(a => {
          const size = 80 + Math.random() * 60;
          const b = document.createElement('div');
          b.className = 'bubble'; b.style.width = b.style.height = size + 'px';
          b.style.color = genreColors[g];
          b.innerHTML = `<img src="${a.img}"><span>${a.name}</span>`;
          b.onclick = () => {
            popImg.src = a.img; popName.textContent = a.name; popDesc.textContent = a.desc || "";
            popApple.href = `https://music.apple.com/us/search?term=${encodeURIComponent(a.name)}`;
            popYT.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(a.name + ' official')}`;
            popWiki.href = `https://en.wikipedia.org/wiki/${encodeURIComponent(a.name)}`;
            popup.style.display = 'flex';
          };
          gEl.appendChild(b);
        });
        mapArea.appendChild(gEl);
      }
    }

    /* === Music Love（ピンクすりガラス＋金色枠、液面で充填） === */
    function calcLove() {
      const n = TOKENS.length;
      const g = [...new Set(TOKENS.map(t => genreOf(t)))].length;
      const score = Math.min(100, Math.round(n * 5 + g * 10));
      document.getElementById('lovePercent').textContent = score + '%';
      const y = 180 - score * 1.3; document.getElementById('liquid').setAttribute('y', Math.max(20, Math.min(180, y)));
      const c = document.getElementById('loveComment');
      if (score < 40) c.textContent = "まだまだ音楽の旅は始まったばかり。";
      else if (score < 70) c.textContent = "音楽を通じて、あなたの世界が広がっています。";
      else c.textContent = "音楽はあなたの人生そのもの。最高のシンフォニーを。";
    }

    /* === Vector / Work：Spotify Audio Features から算出 === */
    function computeVectorFromFeatures(f) {
      // f: {energy,danceability,valence,acousticness,instrumentalness,tempo,liveness,speechiness}
      if (!f) return null;
      const tempoNorm = Math.min(1, Math.max(0, (f.tempo - 60) / 120)); // 60-180 BPM → 0-1
      return {
        energy: f.energy,
        sophistication: (f.instrumentalness + f.acousticness) / 2,
        groove: f.danceability,
        structure: (1 - Math.abs(0.5 - f.danceability)) * 0.4 + tempoNorm * 0.6, // 簡易
        experiment: (f.liveness + f.speechiness) / 2,
        urban: (f.valence + f.danceability) / 2,
        global: 0.5 // 簡易（将来：多言語・多ジャンル量で補正）
      };
    }
    function avgVector(vs) {
      const keys = ["energy", "sophistication", "groove", "structure", "experiment", "urban", "global"];
      const out = {}; keys.forEach(k => out[k] = 0);
      vs.forEach(v => keys.forEach(k => out[k] += v[k] || 0));
      keys.forEach(k => out[k] /= vs.length || 1); return out;
    }
    function drawProfile(v) {
      const el = document.getElementById('profileBars'); el.innerHTML = '';
      const labels = { energy: "エネルギー", sophistication: "洗練", groove: "ノリ", structure: "構成力", experiment: "実験性", urban: "都会感", global: "グローバル感" };
      Object.entries(v).forEach(([k, val]) => {
        const pct = Math.round((val || 0) * 100);
        el.innerHTML += `<div class="kpi"><div>${labels[k]}</div><div class="badge">${pct}%</div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div>`;
      });
      const msgs = [
        "今日は自分の感性を信じて動ける日。", "穏やかに流れながらも、芯の強さが光ります。",
        "ひらめきが冴えるタイミング。新しい発想に挑戦して。", "音のリズムのように自然体で過ごすと運気アップ。",
        "周囲と調和しながらも、独自の世界観が輝く日。"
      ];
      const insight = document.getElementById('vectorInsight'); insight.style.display = 'block';
      insight.textContent = msgs[Math.floor(Math.random() * msgs.length)];
    }

    /* Work Strengths：Vectorをマップ */
    function drawAbilities(v) {
      const el = document.getElementById('abilities'); el.innerHTML = '';
      const factors = {
        collaboration: (v.groove + v.urban) / 2,
        planning: (v.structure + v.sophistication) / 2,
        creativity: (v.experiment + v.energy) / 2,
        empathy: (v.urban + v.global) / 2,
        leadership: (v.energy + v.structure) / 2
      };
      const labels = { collaboration: "協働力", planning: "計画力", creativity: "創造力", empathy: "共感力", leadership: "リーダーシップ" };
      Object.entries(factors).forEach(([k, val]) => {
        const pct = Math.round((val || 0) * 100);
        el.innerHTML += `<div class="kpi"><div>${labels[k]}</div><div class="badge">${pct}%</div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div>`;
      });
      const hints = [
        "協力しながら進めると良い成果が出やすい日です。", "計画的に進めることで安心感が生まれます。",
        "創造性が高まっています。新しい企画に挑戦を。", "共感力が高まり、人との絆が深まりやすい日です。",
        "リーダーシップを発揮してチームを導けるタイミング。"
      ];
      const insight = document.getElementById('abilitiesInsight'); insight.style.display = 'block';
      insight.textContent = hints[Math.floor(Math.random() * hints.length)];
    }

    /* === Recommendations（Spotify related＋同ジャンル・別アーティスト） === */
    async function buildRecsFromSpotify() {
      const out = [];
      for (const name of TOKENS) {
        const a = await spSearchArtistByName(name); if (!a) continue;
        const baseG = (a.genres?.[0] || "").toString();
        const rel = await spRelatedArtists(a.id);
        const picks = rel.filter(x => (x.genres || []).some(g => baseG && g.includes(baseG)) && x.name.toLowerCase() !== a.name.toLowerCase())
          .slice(0, 2);
        for (const p of picks) {
          const it = await fetchITunesPreview(p.name); // 試聴URL/iTunes画像
          out.push({ name: p.name, image: p.image || it.art, preview: it.preview });
        }
      }
      return out.length ? out : null;
    }
    async function renderRecs() {
      const recEl = document.getElementById('recs'); recEl.innerHTML = '';
      let list = null;
      try { list = await buildRecsFromSpotify(); } catch { list = null; }
      if (!list) { /* フォールバック：ジャンル候補から */
        const alt = ["RAYE", "Bonobo", "Four Tet", "Bicep", "Tom Misch", "Yussef Dayes", "Khruangbin", "Parcels"];
        list = await Promise.all(alt.slice(0, 6).map(async n => { const it = await fetchITunesPreview(n); return { name: n, image: it.art, preview: it.preview } }));
      }
      list.forEach(item => {
        const row = document.createElement('div');
        row.style.cssText = "display:flex;align-items:center;gap:8px;margin:8px 0";
        row.innerHTML = `
        <img src="${item.image || `https://picsum.photos/seed/${encodeURIComponent(item.name)}/100/100`}"
             style="width:48px;height:48px;border-radius:10px;object-fit:cover"/>
        <div style="flex:1">
          <strong>${item.name}</strong><br>
          <a href="https://music.apple.com/us/search?term=${encodeURIComponent(item.name)}" target="_blank" style="color:#ffe28a;margin-right:6px">Apple</a>
          <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(item.name + ' official')}" target="_blank" style="color:#ffe28a">YouTube</a>
        </div>
        ${item.preview ? `<audio controls src="${item.preview}" style="height:28px"></audio>` : ""}
      `;
        recEl.appendChild(row);
      });
    }

    /* === Analyze（Spotify特徴量→Vector/Work、Map、Love、Recs） === */
    async function analyze() {
      if (!TOKENS.length) return;
      runProgress(async () => {
        // SpotifyからAudio Features集約（失敗時はランダム補完）
        const vecs = [];
        for (const name of TOKENS) {
          const a = await spSearchArtistByName(name);
          let v = null;
          if (a) {
            const f = await spArtistTopTracksFeatures(a.id);
            v = computeVectorFromFeatures(f || { energy: .6, danceability: .6, valence: .5, acousticness: .4, instrumentalness: .3, tempo: 110, liveness: .2, speechiness: .2 });
          } else {
            v = computeVectorFromFeatures({ energy: .6, danceability: .6, valence: .5, acousticness: .4, instrumentalness: .3, tempo: 110, liveness: .2, speechiness: .2 });
          }
          vecs.push(v);
        }
        const vAll = avgVector(vecs);
        await renderMap();
        calcLove();
        drawProfile(vAll);
        drawAbilities(vAll);
        await renderRecs(); // 同ジャンル・別アーティスト＋試聴
        // 入力は保持（クリアしない）
      });
    }
    document.getElementById('analyzeBtn').onclick = analyze;
  </script>
