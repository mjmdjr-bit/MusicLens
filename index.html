<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MusicLens — Sound Journey</title>
  <style>
    :root {
      --gold: #ffcc33;
      --gold2: #ff8800;
      --ink: #0a0a0e;
      --ink2: #151722;
      --txt: #eef2ff;
      --muted: #a9b2c7;
      --glass: rgba(255, 255, 255, .18);
      --stroke: rgba(255, 255, 255, .22);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      color: var(--txt);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Roboto, Segoe UI, sans-serif;
      background: linear-gradient(180deg, var(--ink), var(--ink2));
      overflow-x: hidden
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none
    }

    /* === Top === */
    #title {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px
    }

    .hero {
      max-width: 900px;
      width: 100%;
      padding: 40px;
      border: 1px solid var(--stroke);
      border-radius: 28px;
      background: linear-gradient(180deg, var(--glass), rgba(255, 255, 255, .07));
      backdrop-filter: blur(22px)
    }

    .logo {
      font-weight: 900;
      font-size: 48px;
      letter-spacing: 1.6px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .cta {
      margin-top: 20px;
      border: none;
      border-radius: 14px;
      padding: 16px 28px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 900;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      color: #111
    }

    /* === App === */
    #app {
      position: relative;
      z-index: 1;
      display: none;
      opacity: 0;
      transition: opacity .5s ease
    }

    #app.show {
      display: block;
      opacity: 1
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px
    }

    .titleSmall {
      font-weight: 900;
      font-size: 20px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    #backTop {
      color: #ffe28a;
      text-decoration: underline;
      cursor: pointer;
      font-size: 14px
    }

    /* === Panels === */
    .panel {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 16px;
      padding: 18px;
      margin-top: 14px
    }

    .section-title {
      font-weight: 800;
      color: #ffd36b;
      margin-bottom: 10px;
      font-size: 14px
    }

    input[type=text] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .25);
      background: rgba(255, 255, 255, .1);
      color: #fff
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 900
    }

    .btn-primary {
      background: linear-gradient(90deg, #ffd766, #ff9f1c);
      color: #111
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .3)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px
    }

    .chip {
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      padding: 6px 10px
    }

    /* === Bubble Map === */
    #bubbleMap {
      min-height: 300px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 12px
    }

    .bubble {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      cursor: pointer;
      animation: float 4s ease-in-out infinite
    }

    .bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    /* === Bars === */
    .kpi {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      margin: 6px 0
    }

    .bar {
      height: 10px;
      background: rgba(255, 255, 255, .12);
      border-radius: 999px;
      overflow: hidden
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #ffcc33, #ff8800);
      width: 0%
    }

    .insight {
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      color: #111;
      font-weight: 700
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <!-- Top -->
  <section id="title">
    <div class="hero">
      <div class="logo">MusicLens</div>
      <p>今日の気分で音を選んで、新しい自分を見つけよう。</p>
      <button id="startBtn" class="cta">SOUND JOURNEY ▶︎</button>
    </div>
  </section>

  <!-- App -->
  <section id="app">
    <main class="container">
      <header class="header">
        <div class="titleSmall">MusicLens</div>
        <div id="backTop">← TOPへ戻る</div>
      </header>

      <section class="panel">
        <div class="section-title">Today's Feeling（いま聴きたいアーティストを入力）</div>
        <input id="inputBox" type="text" placeholder="例：Daft Punk, BLACKPINK, FKJ…">
        <div style="margin-top:8px">
          <button id="addBtn" class="btn btn-ghost">Add</button>
          <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
        </div>
        <div id="chips" class="chips"></div>
      </section>

      <section class="panel">
        <div class="section-title">Listening Map</div>
        <div id="bubbleMap"></div>
      </section>

      <section class="panel">
        <div class="section-title">Music Love</div>
        <div style="text-align:center">
          <svg viewBox="0 0 200 200" width="200" height="200">
            <defs>
              <clipPath id="heartClip">
                <path
                  d="M100 175c-3 0-6-.9-8.2-2.9C75 160 30 123 30 85 30 60 50 40 73 40c12 0 24 6 31 15 7-9 19-15 31-15 23 0 43 20 43 45 0 38-45 75-61.8 87.1-2.2 2-5.2 2.9-8.2 2.9z" />
              </clipPath>
              <linearGradient id="liquidGrad" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#ff9f1c" />
                <stop offset="100%" stop-color="#fff3b0" />
              </linearGradient>
            </defs>
            <g clip-path="url(#heartClip)">
              <rect id="wave" x="0" y="150" width="200" height="50" fill="url(#liquidGrad)"></rect>
            </g>
          </svg>
        </div>
      </section>

      <section class="panel">
        <div class="section-title">Your Music Vector</div>
        <div id="profileBars"></div>
        <div id="vectorInsight" class="insight" style="display:none"></div>
      </section>

      <section class="panel">
        <div class="section-title">Work Strengths</div>
        <div id="abilities"></div>
        <div id="abilitiesInsight" class="insight" style="display:none"></div>
      </section>

      <section class="panel">
        <div class="section-title">Open-Web Recommendations</div>
        <div id="recs" class="small">Analyze後に表示されます。</div>
      </section>
    </main>
  </section>

  <script>
    /* === 背景パーティクル === */
    (function () {
      const cvs = document.getElementById('fx'), ctx = cvs.getContext('2d', { alpha: true });
      let W = 0, H = 0, stars = [];
      function size() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
      function make() { stars = Array.from({ length: 150 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3, r: 1 + Math.random() * 2, h: 20 + Math.random() * 40, a: .2 + .2 * Math.random() })); }
      function draw() { ctx.clearRect(0, 0, W, H); for (const s of stars) { s.x += s.vx; s.y += s.vy; if (s.x < 0 || s.x > W) s.vx *= -1; if (s.y < 0 || s.y > H) s.vy *= -1; const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 8); g.addColorStop(0, `hsla(${40 + s.h},100%,60%,${s.a})`); g.addColorStop(1, 'transparent'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 8, 0, 6.283); ctx.fill(); } requestAnimationFrame(draw); }
      addEventListener('resize', () => { size(); make(); }); size(); make(); draw();
    })();

    /* === Top→App遷移 === */
    (function () {
      const title = document.getElementById('title'), app = document.getElementById('app');
      document.getElementById('startBtn').addEventListener('click', () => { title.style.display = 'none'; app.style.display = 'block'; requestAnimationFrame(() => app.classList.add('show')); startBGM(); });
      document.getElementById('backTop').addEventListener('click', () => { app.classList.remove('show'); app.style.display = 'none'; title.style.display = 'grid'; });
    })();

    /* === メロディ付きハラカミ風BGM === */
    let AC, master, isLoop = false;
    function startBGM() {
      if (isLoop) return; AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.connect(AC.destination); master.gain.value = .5;
      function play() { const base = [220, 246, 261, 293, 329, 392]; base.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(master); const t = AC.currentTime + i * 0.4; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.2, t + 0.1); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35); o.start(t); o.stop(t + 0.4); }); }
      play(); setInterval(play, 2800); isLoop = true;
    }

    /* === Today's Feeling === */
    let TOKENS = []; const input = document.getElementById('inputBox'), chips = document.getElementById('chips');
    function renderChips() { chips.innerHTML = TOKENS.map((t, i) => `<span class="chip">${t}<a onclick="remove(${i})">✕</a></span>`).join(''); }
    function add() { if (!input.value.trim()) return; TOKENS.push(input.value.trim()); input.value = ''; renderChips(); }
    function remove(i) { TOKENS.splice(i, 1); renderChips(); }
    document.getElementById('addBtn').onclick = add;

    /* === Listening Map：Apple Watch風 === */
    function renderBubbles() {
      const map = document.getElementById('bubbleMap'); map.innerHTML = '';
      TOKENS.forEach(t => {
        const b = document.createElement('div'); b.className = 'bubble'; b.style.background = `hsla(${Math.random() * 360},70%,60%,0.8)`; b.textContent = t; map.appendChild(b);
      });
    }

    /* === Music Love（水面アニメ） === */
    (function animateWave() {
      const wave = document.getElementById('wave'); if (!wave) return; let p = 0;
      function step() { p += .1; const y = 150 + Math.sin(p) * 5; wave.setAttribute('y', y); requestAnimationFrame(step); }
      step();
    })();

    /* === 分析 === */
    function analyze() {
      if (!TOKENS.length) return;
      renderBubbles();
      // Vector & Work (差を大きくランダム化)
      const vec = { energy: Math.random(), sophistication: Math.random(), groove: Math.random(), structure: Math.random(), experiment: Math.random(), urban: Math.random(), global: Math.random() };
      drawProfile(vec); drawAbilities(vec); renderRecs(); TOKENS = []; renderChips();
    }

    /* === Vector === */
    function drawProfile(v) {
      const el = document.getElementById('profileBars'); el.innerHTML = '';
      for (const [k, val] of Object.entries(v)) { const p = Math.round(val * 100); el.innerHTML += `<div class="kpi"><div>${k}</div><div class="badge">${p}%</div></div><div class="bar"><div class="fill" style="width:${p}%"></div></div>`; }
      const msgs = ['今日はエネルギッシュに動けそう。', '静かに集中できる時間を大切に。', '新しい発見がありそうな一日。', '仲間とのつながりが深まりそう。', 'リズムに身を任せて、流れに乗ろう。']; document.getElementById('vectorInsight').style.display = 'block'; document.getElementById('vectorInsight').textContent = msgs[Math.floor(Math.random() * msgs.length)];
    }

    /* === Work === */
    function drawAbilities(v) {
      const el = document.getElementById('abilities'); el.innerHTML = '';
      for (const [k, val] of Object.entries(v)) { const p = Math.round(val * 100); el.innerHTML += `<div class="kpi"><div>${k}</div><div class="badge">${p}%</div></div><div class="bar"><div class="fill" style="width:${p}%"></div></div>`; }
      const hints = ['協力が成功の鍵。チームと一歩踏み出そう。', '整理力が光る日。情報をまとめよう。', '感性が冴える。少し冒険してみよう。', '冷静に判断できる日。先を読んで行動を。']; document.getElementById('abilitiesInsight').style.display = 'block'; document.getElementById('abilitiesInsight').textContent = hints[Math.floor(Math.random() * hints.length)];
    }

    /* === Recommendations === */
    function renderRecs() {
      const recs = document.getElementById('recs');
      const pool = ['FKJ', 'Thundercat', 'SZA', 'Robert Glasper', 'Disclosure', 'Khruangbin', 'Bonobo', 'Yaeji', 'Tom Misch', 'Cimafunk', 'Peggy Gou', 'Vulfpeck'];
      const pick = pool.sort(() => .5 - Math.random()).slice(0, 5);
      recs.innerHTML = pick.map(p => `<div style="margin:6px 0;display:flex;align-items:center"><img src="https://picsum.photos/seed/${encodeURIComponent(p)}/60/60" style="border-radius:50%;margin-right:6px"/><div>${p}<br><a href="https://music.apple.com/us/search?term=${encodeURIComponent(p)}" target="_blank" style="color:#ffe28a">Apple</a> ／ <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(p + ' official')}" target="_blank" style="color:#ffe28a">YouTube</a></div></div>`).join('');
    }

    document.getElementById('analyzeBtn').onclick = analyze;
  </script>
</body>

</html>
