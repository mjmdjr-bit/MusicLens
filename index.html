<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MusicLens — Final Integrated Edition v3.1</title>
  <style>
    :root {
      --gold: #ffcc33;
      --gold2: #ff8800;
      --ink: #0a0a0e;
      --ink2: #151722;
      --txt: #eef2ff;
      --glass: rgba(255, 255, 255, .18);
      --stroke: rgba(255, 255, 255, .22);
      --spotify: #1DB954;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Roboto, Segoe UI, sans-serif;
      background: linear-gradient(180deg, var(--ink), var(--ink2));
      color: var(--txt);
      overflow-x: hidden;
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .logo {
      font-size: 56px;
      font-weight: 900;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      color: transparent;
      animation: float 6s ease-in-out infinite, shine 5s linear infinite, glow 3s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    @keyframes shine {
      0% {
        background-position: 0% 50%
      }

      100% {
        background-position: 300% 50%
      }
    }

    @keyframes glow {

      0%,
      100% {
        filter: drop-shadow(0 0 0 rgba(255, 220, 120, 0))
      }

      50% {
        filter: drop-shadow(0 0 16px rgba(255, 220, 120, .75))
      }
    }

    /* === スライド扉 === */
    #doorContainer {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
      /* ← 通常は無効 */
    }

    .door {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px) saturate(130%);
      transform: translateX(0);
      transition: transform 3s cubic-bezier(.25, .8, .25, 1);
    }

    body.doors-active #doorContainer {
      pointer-events: auto;
    }

    /* ← アニメ中のみ操作ブロック */
    body.doors-open .door.left {
      transform: translateX(-100%)
    }

    body.doors-open .door.right {
      transform: translateX(100%)
    }

    /* === TOP === */
    #title {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      z-index: 10;
    }

    .hero {
      text-align: center;
      padding: 40px;
      border: 1px solid var(--stroke);
      border-radius: 28px;
      background: linear-gradient(180deg, var(--glass), rgba(255, 255, 255, .07));
      backdrop-filter: blur(22px);
    }

    .cta {
      margin-top: 20px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      color: #111;
      font-weight: 900;
      cursor: pointer;
    }

    .hero small {
      display: block;
      margin-top: 14px;
      color: #ccc
    }

    .spotify-login {
      margin-top: 16px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: var(--spotify);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background .3s;
    }

    .spotify-login:hover {
      background: #1ed760;
    }

    #app {
      display: none;
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }

    #app.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px;
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <section id="title">
    <div class="hero">
      <div class="logo">MusicLens</div>
      <p>Spotifyであなたの音楽世界を分析しよう。</p>
      <button id="spotifyLogin" class="spotify-login">Login with Spotify</button>
      <button id="startBtn" class="cta">SOUND JOURNEY ▶︎</button>
      <small>Produced by Daijiro Majima</small>
    </div>
  </section>

  <div id="doorContainer">
    <div class="door left"></div>
    <div class="door right"></div>
  </div>
  <section id="app">
    <main class="container">
      <header class="header" style="text-align:center;">
        <div class="logo">MusicLens</div>
        <div id="userStatus" style="font-size:14px;margin-top:4px;">🎵 Spotify: 未接続</div>
        <div id="backTop" style="cursor:pointer;color:#ffd36b;margin-top:6px;">← TOPへ戻る</div>
      </header>

      <section class="panel">
        <div class="section-title">Today's Feeling（アーティストを入力）</div>
        <input id="inputBox" type="text" placeholder="例：Daft Punk, Disclosure, FKJ, 7co …（カンマ区切りOK）">
        <div style="margin-top:8px">
          <button id="addBtn" class="btn btn-ghost">Add</button>
          <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
        </div>
        <div id="chips" class="chips"></div>
        <div id="progressWrap" style="display:none;margin-top:10px;">
          <div style="height:10px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;">
            <div id="progfill"
              style="height:100%;width:0%;background:linear-gradient(90deg,#ffcc33,#ff8800);transition:width .3s;">
            </div>
          </div>
          <div id="progtext" style="font-size:13px;text-align:right;margin-top:6px;">0%</div>
        </div>
      </section>

      <section class="panel">
        <div class="section-title">Listening Map</div>
        <div id="mapArea"></div>
      </section>

      <section class="panel" style="text-align:center">
        <div class="section-title">Music Love</div>
        <svg id="loveSvg" viewBox="0 0 200 200">
          <defs>
            <clipPath id="heartClip">
              <path id="heartGlass"
                d="M100 175c-3 0-6-.9-8.2-2.9C75 160 30 123 30 85 30 60 50 40 73 40c12 0 24 6 31 15 7-9 19-15 31-15 23 0 43 20 43 45 0 38-45 75-61.8 87.1-2.2 2-5.2 2.9-8.2 2.9z" />
            </clipPath>
            <linearGradient id="liquidGrad" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#ff9f1c" />
              <stop offset="100%" stop-color="#fff3b0" />
            </linearGradient>
          </defs>
          <use href="#heartGlass" fill="rgba(255,182,193,0.2)" stroke="rgba(255,215,0,0.95)" stroke-width="2.2" />
          <path id="wave" fill="url(#liquidGrad)" d="M0 150 Q50 145 100 150 T200 150 V200 H0 Z">
            <animateTransform attributeName="transform" attributeType="XML" type="translate" from="0,0" to="-50,0"
              dur="2s" repeatCount="indefinite" />
          </path>
        </svg>
        <div id="lovePercent" style="font-size:18px;margin-top:6px">—%</div>
        <div id="loveComment" style="font-size:14px;color:#fff;margin-top:4px"></div>
      </section>

      <section class="panel">
        <div class="section-title">Your Music Vector</div>
        <div id="profileBars"></div>
      </section>
      <section class="panel">
        <div class="section-title">Work Strengths</div>
        <div id="abilities"></div>
      </section>
      <section class="panel">
        <div class="section-title">Music Recommendations</div>
        <div id="recs" class="small">Analyze後に表示されます。</div>
      </section>
      <section class="panel" style="text-align:center"><button id="bgmBtn" class="btn btn-ghost">BGM: FKJ – TUI
          ■</button>
      </section>
    </main>
  </section>
  <script>
    const clientId = "9ba439fa2d564681aaabe96e6c4a5fd4";
    const redirectUri = "https://mjmdjr-bit.github.io/MusicLens/callback.html";
    const scopes = ["user-read-private", "user-read-email"];
    const authUrl = `https://accounts.spotify.com/authorize?client_id=${clientId}&response_type=token&redirect_uri=${encodeURIComponent(redirectUri)}&scope=${scopes.join("%20")}`;
    document.getElementById("spotifyLogin").onclick = () => window.location.href = authUrl;

    // スライド扉アニメーション修正版
    document.getElementById("startBtn").onclick = () => {
      document.body.classList.add("doors-active");
      setTimeout(() => document.body.classList.add("doors-open"), 50);
      setTimeout(() => {
        document.body.classList.remove("doors-active");
        document.getElementById("title").style.display = "none";
        const app = document.getElementById("app");
        app.classList.add("show");
        playBGM();
      }, 3000);
    };
    document.getElementById("backTop").onclick = () => {
      const app = document.getElementById("app");
      app.classList.remove("show");
      document.getElementById("title").style.display = "flex";
      document.body.classList.remove("doors-open");
    };

    // BGM自動再生
    let bgm = null;
    const bgmBtn = document.getElementById("bgmBtn");
    async function playBGM() {
      if (bgm) return;
      const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent("FKJ TUI")}&entity=musicTrack&limit=1`);
      const j = await r.json(); const t = j.results?.[0];
      bgm = new Audio(t?.previewUrl || ""); bgm.loop = true; bgm.volume = 0.5;
      try { await bgm.play(); } catch { }
    }
    bgmBtn.onclick = () => { if (!bgm) return; if (bgm.paused) { bgm.play(); bgmBtn.textContent = "BGM: FKJ – TUI ■"; } else { bgm.pause(); bgmBtn.textContent = "BGM: FKJ – TUI ▶︎"; } };
    // === 背景パーティクル ===
    (function () {
      const cvs = document.getElementById('fx'), ctx = cvs.getContext('2d', { alpha: true });
      let W = 0, H = 0, stars = [];
      function size() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
      function make() { stars = Array.from({ length: 160 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: 1 + Math.random() * 2, a: .2 + .2 * Math.random() })); }
      function draw() {
        ctx.clearRect(0, 0, W, H);
        for (const s of stars) {
          s.x += s.vx; s.y += s.vy;
          if (s.x < 0 || s.x > W) s.vx *= -1;
          if (s.y < 0 || s.y > H) s.vy *= -1;
          const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 8);
          g.addColorStop(0, `rgba(255,255,200,${s.a})`);
          g.addColorStop(1, 'transparent');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 8, 0, 6.283); ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      addEventListener('resize', () => { size(); make() });
      size(); make(); draw();
    })();

    // === Spotifyユーザー情報 ===
    const token = localStorage.getItem("spotify_token") || "";
    async function fetchSpotifyUser() {
      if (!token) return;
      try {
        const res = await fetch("https://api.spotify.com/v1/me", { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) return;
        const user = await res.json();
        document.getElementById("userStatus").innerHTML = `🎵 Spotify: ${user.display_name}`;
      } catch (e) { console.warn("User fetch failed", e); }
    }
    fetchSpotifyUser();

    // === アーティスト入力 ===
    let TOKENS = [];
    const input = document.getElementById('inputBox');
    const chips = document.getElementById('chips');
    function renderChips() {
      chips.innerHTML = TOKENS.map((t, i) => `<span class="chip">${t}<a onclick="remove(${i})">✕</a></span>`).join('');
    }
    function add() {
      if (!input.value.trim()) return;
      const items = input.value.split(",").map(t => t.trim()).filter(Boolean);
      TOKENS.push(...items);
      input.value = ''; renderChips();
    }
    function remove(i) { TOKENS.splice(i, 1); renderChips(); }
    document.getElementById('addBtn').onclick = add;
    // === Progressバー ===
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progfill');
    const progressText = document.getElementById('progtext');
    function runProgress(cb) {
      progressWrap.style.display = 'block';
      let p = 0;
      const id = setInterval(() => {
        p += 3 + Math.random() * 5;
        if (p >= 100) {
          clearInterval(id); p = 100;
          progressFill.style.width = '100%';
          progressText.textContent = '100%';
          setTimeout(() => { progressWrap.style.display = 'none'; cb(); }, 400);
        } else {
          progressFill.style.width = p + '%';
          progressText.textContent = Math.floor(p) + '%';
        }
      }, 80);
    }

    // === Listening Map ===
    const mapArea = document.getElementById("mapArea");
    async function fetchArtistData(name) {
      try {
        const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(name)}&type=artist&limit=1`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const j = await res.json();
        const a = j.artists?.items?.[0];
        if (!a) return null;
        return {
          name: a.name,
          img: a.images?.[0]?.url || `https://picsum.photos/seed/${encodeURIComponent(name)}/160/160`,
          genre: a.genres?.[0] || "Other",
          url: a.external_urls.spotify
        };
      } catch { return null; }
    }

    async function renderMap() {
      mapArea.innerHTML = "";
      const data = await Promise.all(TOKENS.map(t => fetchArtistData(t)));
      const groups = {};
      for (const a of data.filter(Boolean)) {
        (groups[a.genre] ??= []).push(a);
      }
      for (const [g, arr] of Object.entries(groups)) {
        const gEl = document.createElement("div");
        gEl.className = "genreGroup";
        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = g;
        gEl.appendChild(title);
        arr.forEach(a => {
          const b = document.createElement("div");
          b.className = "bubble";
          b.style.color = "#ffcc33";
          b.innerHTML = `<img src="${a.img}"><span>${a.name}</span>`;
          b.onclick = () => window.open(a.url, "_blank");
          gEl.appendChild(b);
        });
        mapArea.appendChild(gEl);
      }
    }

    // === Music Love ===
    function calcLove() {
      const score = Math.min(100, Math.round(TOKENS.length * 5));
      document.getElementById("lovePercent").textContent = score + "%";
      const c = document.getElementById("loveComment");
      if (score < 40) c.textContent = "まだまだ音楽の旅は始まったばかり。";
      else if (score < 70) c.textContent = "音楽を通じて、あなたの世界が広がっています。";
      else c.textContent = "音楽はあなたの人生そのもの。最高のシンフォニーを。";
    }

    // === Vector / Work ===
    function randomVec() {
      return {
        energy: Math.random(), sophistication: Math.random(), groove: Math.random(),
        structure: Math.random(), experiment: Math.random(), urban: Math.random(), global: Math.random()
      };
    }
    function drawProfile(v) {
      const el = document.getElementById("profileBars"); el.innerHTML = "";
      const labels = { energy: "エネルギー", sophistication: "洗練", groove: "ノリ", structure: "構成力", experiment: "実験性", urban: "都会感", global: "グローバル感" };
      for (const [k, val] of Object.entries(v)) {
        const pct = Math.round(val * 100);
        el.innerHTML += `<div class="kpi"><div>${labels[k]}</div><div>${pct}%</div></div>
                   <div class="bar"><div class="fill" style="width:${pct}%"></div></div>`;
      }
    }
    function drawAbilities(v) {
      const el = document.getElementById("abilities"); el.innerHTML = "";
      const factors = {
        collaboration: (v.groove + v.urban) / 2, planning: (v.structure + v.sophistication) / 2,
        creativity: (v.experiment + v.energy) / 2, empathy: (v.urban + v.global) / 2, leadership: (v.energy + v.structure) / 2
      };
      const labels = { collaboration: "協働力", planning: "計画力", creativity: "創造力", empathy: "共感力", leadership: "リーダーシップ" };
      for (const [k, val] of Object.entries(factors)) {
        const pct = Math.round(val * 100);
        el.innerHTML += `<div class="kpi"><div>${labels[k]}</div><div>${pct}%</div></div>
                   <div class="bar"><div class="fill" style="width:${pct}%"></div></div>`;
      }
    }

    // === Recommendations（試聴＋YouTubeリンク＋重複除外） ===
    async function fetchITunesPreview(n) {
      try {
        const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(n)}&entity=musicArtist&limit=1`);
        const j = await r.json(); const a = j.results?.[0];
        return a ? { name: a.artistName, art: a.artworkUrl100?.replace("100x100", "200x200"), preview: a.artistLinkUrl } : {};
      } catch { return {} }
    }
    async function renderRecs() {
      const exclude = new Set(TOKENS.map(t => t.toLowerCase()));
      const recs = [];
      for (const name of TOKENS) {
        const r = await fetchITunesPreview(name);
        if (r.name && !exclude.has(r.name.toLowerCase())) recs.push(r);
      }
      const recEl = document.getElementById("recs");
      recEl.innerHTML = recs.map(a => `
  <div style="display:flex;align-items:center;gap:10px;margin:8px 0">
    <img src="${a.art}" style="width:50px;height:50px;border-radius:8px;object-fit:cover"/>
    <div><strong>${a.name}</strong><br>
      <a href="${a.preview}" target="_blank" style="color:#ffe28a">Apple</a> /
      <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(a.name + ' official')}"
         target="_blank" style="color:#ff6">YouTube</a>
    </div>
  </div>`).join('');
    }

    // === Analyze統合 ===
    async function analyze() {
      if (!TOKENS.length) return;
      runProgress(async () => {
        await renderMap();
        calcLove();
        const v = randomVec(); drawProfile(v); drawAbilities(v);
        await renderRecs();
      });
    }
    document.getElementById("analyzeBtn").onclick = analyze;
  </script>
</body>
<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spotify Callback</title>
  <style>
    body {
      margin: 0;
      position: relative;
      z-index: 100;
      background: radial-gradient(circle at center, #0a0a0e, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #ffd36b;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    }

    .loader {
      width: 70px;
      height: 70px;
      border: 3px solid rgba(255, 215, 100, .6);
      border-top-color: #ffd36b;
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
      margin-top: 30px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .6;
        text-shadow: 0 0 10px rgba(255, 215, 100, .3);
      }

      50% {
        opacity: 1;
        text-shadow: 0 0 25px rgba(255, 215, 100, .8);
      }
    }

    .msg {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      animation: pulse 2s ease-in-out infinite;
    }
  </style>
</head>

<body>
  <div class="msg">Spotify 認証中...</div>
  <div class="loader"></div>
  <script>
    const hash = window.location.hash;
    const token = new URLSearchParams(hash.substring(1)).get("access_token");
    if (token) {
      localStorage.setItem("spotify_token", token);
      setTimeout(() => window.location.href = "https://mjmdjr-bit.github.io/MusicLens/", 2500);
    } else {
      document.body.innerHTML = "<h2 style='color:#f77'>認証エラー。設定を確認してください。</h2>";
    }
  </script>
</body>

</html>
