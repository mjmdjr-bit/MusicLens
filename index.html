<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MusicLens — Final Edition</title>
  <style>
    :root {
      --gold: #ffcc33;
      --gold2: #ff8800;
      --ink: #0a0a0e;
      --ink2: #151722;
      --txt: #eef2ff;
      --muted: #a9b2c7;
      --glass: rgba(255, 255, 255, .18);
      --stroke: rgba(255, 255, 255, .22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Roboto, Segoe UI, sans-serif;
      background: linear-gradient(180deg, var(--ink), var(--ink2));
      color: var(--txt);
      overflow-x: hidden;
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none
    }

    /* === TOP === */
    #title {
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
      position: relative;
      z-index: 2
    }

    .hero {
      max-width: 900px;
      padding: 40px;
      border: 1px solid var(--stroke);
      border-radius: 28px;
      background: linear-gradient(180deg, var(--glass), rgba(255, 255, 255, .07));
      backdrop-filter: blur(22px)
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      animation: float 6s ease-in-out infinite
    }

    .cta {
      margin-top: 20px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      color: #111;
      font-weight: 900;
      cursor: pointer
    }

    .hero small {
      display: block;
      margin-top: 14px;
      color: #ccc
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    /* === APP === */
    #app {
      display: none;
      opacity: 0;
      transition: opacity .6s ease
    }

    #app.show {
      display: block;
      opacity: 1
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px
    }

    .titleSmall {
      font-weight: 900;
      font-size: 20px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent
    }

    #backTop {
      color: #ffe28a;
      text-decoration: underline;
      cursor: pointer;
      font-size: 14px
    }

    /* === Panel === */
    .panel {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px
    }

    .section-title {
      font-weight: 800;
      color: #ffd36b;
      margin-bottom: 8px;
      font-size: 14px
    }

    input[type=text] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .25);
      background: rgba(255, 255, 255, .1);
      color: #fff
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 900
    }

    .btn-primary {
      background: linear-gradient(90deg, #ffd766, #ff9f1c);
      color: #111
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .3)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px
    }

    .chip {
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      padding: 6px 10px
    }

    /* === Progress === */
    #progressWrap {
      margin-top: 10px;
      display: none
    }

    #progbar {
      height: 10px;
      background: rgba(255, 255, 255, .1);
      border-radius: 999px;
      overflow: hidden
    }

    #progfill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffcc33, #ff8800);
      transition: width .3s ease
    }

    #progtext {
      margin-top: 6px;
      font-size: 13px;
      text-align: right
    }

    /* === Listening Map === */
    .genreGroup {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin: 30px 0;
      justify-content: center;
      position: relative
    }

    .genreTitle {
      font-weight: 800;
      font-size: 16px;
      color: #ffd36b;
      margin: 10px 0
    }

    .bubble {
      position: relative;
      border-radius: 50%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 255, 255, .3);
      overflow: hidden;
      animation: floaty 6s ease-in-out infinite alternate;
      transition: transform .4s ease;
    }

    .bubble:hover {
      transform: scale(1.15);
    }

    .bubble::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, .3) 0%, transparent 70%);
      z-index: 0;
    }

    .bubble span {
      position: absolute;
      bottom: 6px;
      font-size: 11px;
      z-index: 1;
      background: rgba(0, 0, 0, .3);
      border-radius: 8px;
      padding: 2px 4px;
    }

    .bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      z-index: 0
    }

    @keyframes floaty {
      0% {
        transform: translateY(0)
      }

      100% {
        transform: translateY(-10px)
      }
    }

    /* === Music Love === */
    #loveSvg {
      width: 220px;
      height: 220px;
      margin: 20px auto;
      filter: drop-shadow(0 0 10px rgba(255, 200, 255, .5))
    }

    #heartGlass {
      fill: rgba(255, 182, 193, 0.2);
      stroke: rgba(255, 220, 240, 0.9);
      stroke-width: 2.5;
      backdrop-filter: blur(12px);
    }

    #liquid {
      animation: wave 4s ease-in-out infinite alternate
    }

    @keyframes wave {
      0% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-4px)
      }

      100% {
        transform: translateY(0)
      }
    }

    /* === Bars === */
    .kpi {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      margin: 6px 0
    }

    .bar {
      height: 10px;
      background: rgba(255, 255, 255, .12);
      border-radius: 999px;
      overflow: hidden
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #ffcc33, #ff8800);
      width: 0%
    }

    .insight {
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      color: #111;
      font-weight: 700
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <!-- TOP -->
  <section id="title">
    <div class="hero">
      <div class="logo">MusicLens</div>
      <p>今日の気分で音を選んで、新しい自分を見つけよう。</p>
      <button id="startBtn" class="cta">SOUND JOURNEY ▶︎</button>
      <small>Produced by Daijiro Majima</small>
    </div>
  </section>
  <!-- APP -->
  <section id="app">
    <main class="container">
      <header class="header">
        <div class="titleSmall">MusicLens</div>
        <div id="backTop">← TOPへ戻る</div>
      </header>

      <!-- Today's Feeling -->
      <section class="panel">
        <div class="section-title">Today's Feeling（いま聴きたいアーティストを入力）</div>
        <input id="inputBox" type="text" placeholder="例：Daft Punk, BLACKPINK, FKJ…" maxlength="50">
        <div style="margin-top:8px">
          <button id="addBtn" class="btn btn-ghost">Add</button>
          <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
        </div>
        <div id="chips" class="chips"></div>
        <div id="progressWrap">
          <div id="progbar">
            <div id="progfill"></div>
          </div>
          <div id="progtext">0%</div>
        </div>
      </section>

      <!-- Listening Map -->
      <section class="panel">
        <div class="section-title">Listening Map（音楽ジャンル別アーティスト）</div>
        <div id="mapArea"></div>
      </section>

      <!-- Music Love -->
      <section class="panel" style="text-align:center">
        <div class="section-title">Music Love（音楽愛）</div>
        <svg id="loveSvg" viewBox="0 0 200 200">
          <defs>
            <clipPath id="heartClip">
              <path id="heartGlass"
                d="M100 175c-3 0-6-.9-8.2-2.9C75 160 30 123 30 85 30 60 50 40 73 40c12 0 24 6 31 15 7-9 19-15 31-15 23 0 43 20 43 45 0 38-45 75-61.8 87.1-2.2 2-5.2 2.9-8.2 2.9z" />
            </clipPath>
            <linearGradient id="liquidGrad" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#ff9f1c" />
              <stop offset="100%" stop-color="#fff3b0" />
            </linearGradient>
          </defs>
          <g clip-path="url(#heartClip)">
            <rect id="liquid" x="20" y="150" width="160" height="60" fill="url(#liquidGrad)" />
          </g>
        </svg>
        <div id="lovePercent" style="font-size:18px;margin-top:6px">—%</div>
        <div id="loveComment" class="small" style="margin-top:4px"></div>
      </section>

      <!-- Vector -->
      <section class="panel">
        <div class="section-title">Your Music Vector</div>
        <div id="profileBars"></div>
        <div id="vectorInsight" class="insight" style="display:none"></div>
      </section>

      <!-- Work -->
      <section class="panel">
        <div class="section-title">Work Strengths</div>
        <div id="abilities"></div>
        <div id="abilitiesInsight" class="insight" style="display:none"></div>
      </section>

      <!-- Recommendation -->
      <section class="panel">
        <div class="section-title">Music Recommendations</div>
        <div id="recs" class="small">Analyze後に表示されます。</div>
      </section>
    </main>
  </section>
  <script>
    /* === ページ遷移 === */
    document.addEventListener("DOMContentLoaded", () => {
      const title = document.getElementById("title"), app = document.getElementById("app");
      document.getElementById("startBtn").onclick = () => { title.style.display = "none"; app.style.display = "block"; requestAnimationFrame(() => app.classList.add("show")); }
      document.getElementById("backTop").onclick = () => { app.classList.remove("show"); app.style.display = "none"; title.style.display = "grid"; }
    });

    /* === 背景パーティクル === */
    (function () {
      const cvs = document.getElementById('fx'), ctx = cvs.getContext('2d', { alpha: true });
      let W = 0, H = 0, stars = [];
      function size() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
      function make() { stars = Array.from({ length: 150 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: 1 + Math.random() * 2, a: .2 + .2 * Math.random() })); }
      function draw() {
        ctx.clearRect(0, 0, W, H);
        for (const s of stars) {
          s.x += s.vx; s.y += s.vy;
          if (s.x < 0 || s.x > W) s.vx *= -1;
          if (s.y < 0 || s.y > H) s.vy *= -1;
          const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 8);
          g.addColorStop(0, `rgba(255,255,200,${s.a})`);
          g.addColorStop(1, 'transparent');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 8, 0, 6.283); ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      addEventListener('resize', () => { size(); make(); });
      size(); make(); draw();
    })();

    /* === 入力 === */
    let TOKENS = [];
    const input = document.getElementById('inputBox'), chips = document.getElementById('chips');
    function renderChips() { chips.innerHTML = TOKENS.map((t, i) => `<span class="chip">${t}<a onclick="remove(${i})">✕</a></span>`).join(''); }
    function add() { if (!input.value.trim()) return; if (TOKENS.length >= 20) return; TOKENS.push(input.value.trim()); input.value = ''; renderChips(); }
    function remove(i) { TOKENS.splice(i, 1); renderChips(); }
    document.getElementById('addBtn').onclick = add;

    /* === 進捗バー === */
    const progressWrap = document.getElementById('progressWrap'), progressFill = document.getElementById('progfill'), progressText = document.getElementById('progtext');
    function runProgress(cb) {
      progressWrap.style.display = 'block';
      let p = 0;
      const id = setInterval(() => {
        p += 4 + Math.random() * 5;
        if (p >= 100) {
          clearInterval(id);
          p = 100;
          progressFill.style.width = '100%';
          progressText.textContent = '100%';
          setTimeout(() => { progressWrap.style.display = 'none'; cb(); }, 300);
        } else {
          progressFill.style.width = p + '%';
          progressText.textContent = Math.floor(p) + '%';
        }
      }, 80);
    }

    /* === ジャンル === */
    const genreColors = { Pop: '#ff66cc', Jazz: '#66ccff', Rock: '#ff6666', Electronic: '#aa88ff', World: '#77ff88', Other: '#ffd966' };
    function genreOf(n) {
      n = n.toLowerCase();
      if (/jazz/.test(n)) return 'Jazz';
      if (/rock|metal/.test(n)) return 'Rock';
      if (/pop/.test(n)) return 'Pop';
      if (/elect|techno|edm/.test(n)) return 'Electronic';
      if (/world|latin|afro/.test(n)) return 'World';
      return 'Other';
    }

    /* === Map === */
    const mapArea = document.getElementById('mapArea');
    async function fetchArtistData(n) {
      try {
        const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(n)}`);
        const j = await r.json();
        return {
          img: j.thumbnail?.source || `https://picsum.photos/seed/${encodeURIComponent(n)}/120/120`,
          desc: j.extract?.slice(0, 100) + "…" || "情報なし"
        };
      } catch {
        return { img: `https://picsum.photos/seed/${encodeURIComponent(n)}/120/120`, desc: "情報取得失敗" };
      }
    }
    async function renderMap() {
      mapArea.innerHTML = "";
      const groups = {};
      const data = await Promise.all(TOKENS.map(async n => {
        const g = genreOf(n); const d = await fetchArtistData(n);
        return { name: n, genre: g, img: d.img, desc: d.desc };
      }));
      data.forEach(a => {
        if (!groups[a.genre]) groups[a.genre] = [];
        groups[a.genre].push(a);
      });
      for (const [genre, arr] of Object.entries(groups)) {
        const gEl = document.createElement('div');
        gEl.className = 'genreGroup';
        const title = document.createElement('div');
        title.className = 'genreTitle';
        title.textContent = genre;
        gEl.appendChild(title);
        arr.forEach(a => {
          const b = document.createElement('div');
          const size = 80 + Math.random() * 60;
          b.className = 'bubble';
          b.style.width = b.style.height = size + 'px';
          b.style.background = genreColors[genre];
          b.innerHTML = `<img src="${a.img}"><span>${a.name}</span>`;
          b.onclick = () => window.open(`https://music.apple.com/us/search?term=${encodeURIComponent(a.name)}`, '_blank');
          gEl.appendChild(b);
        });
        mapArea.appendChild(gEl);
      }
    }

    /* === Music Love === */
    function calcLove() {
      const n = TOKENS.length;
      const g = [...new Set(TOKENS.map(t => genreOf(t)))].length;
      const score = Math.min(100, Math.round(n * 5 + g * 10));
      document.getElementById('lovePercent').textContent = score + '%';
      document.getElementById('liquid').setAttribute('y', 180 - score * 1.3);
      const c = document.getElementById('loveComment');
      if (score < 40) c.textContent = "まだまだ音楽の旅は始まったばかり。";
      else if (score < 70) c.textContent = "音楽を通じて、あなたの世界が広がっています。";
      else c.textContent = "音楽はあなたの人生そのもの。最高のシンフォニーを。";
    }

    /* === Vector・Work・Recommendations === */
    function randomVec() {
      return {
        energy: Math.random(), sophistication: Math.random(), groove: Math.random(),
        structure: Math.random(), experiment: Math.random(), urban: Math.random(), global: Math.random()
      };
    }

    function drawProfile(v) {
      const el = document.getElementById('profileBars');
      el.innerHTML = '';
      const labels = {
        energy: "エネルギー", sophistication: "洗練", groove: "ノリ",
        structure: "構成力", experiment: "実験性", urban: "都会感", global: "グローバル感"
      };
      for (const [k, val] of Object.entries(v)) {
        const pct = Math.round(val * 100);
        el.innerHTML += `
        <div class="kpi">
          <div>${labels[k]}</div><div class="badge">${pct}%</div>
        </div>
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>`;
      }
      const msgs = [
        "今日は自分の感性を信じて動ける日。",
        "穏やかに流れながらも、芯の強さが光ります。",
        "ひらめきが冴えるタイミング。新しい発想に挑戦して。",
        "音のリズムのように自然体で過ごすと運気アップ。",
        "周囲と調和しながらも、独自の世界観が輝く日。"
      ];
      const insight = document.getElementById('vectorInsight');
      insight.style.display = 'block';
      insight.textContent = msgs[Math.floor(Math.random() * msgs.length)];
    }

    function drawAbilities(v) {
      const el = document.getElementById('abilities');
      el.innerHTML = '';
      const factors = {
        collaboration: (v.groove + v.urban) / 2,
        planning: (v.structure + v.sophistication) / 2,
        creativity: (v.experiment + v.energy) / 2,
        empathy: (v.urban + v.global) / 2,
        leadership: (v.energy + v.structure) / 2
      };
      const labels = {
        collaboration: "協働力", planning: "計画力", creativity: "創造力",
        empathy: "共感力", leadership: "リーダーシップ"
      };
      for (const [k, val] of Object.entries(factors)) {
        const pct = Math.round(val * 100);
        el.innerHTML += `
        <div class="kpi">
          <div>${labels[k]}</div><div class="badge">${pct}%</div>
        </div>
        <div class="bar"><div class="fill" style="width:${pct}%"></div></div>`;
      }
      const hints = [
        "協力しながら進めると良い成果が出やすい日です。",
        "計画的に進めることで安心感が生まれます。",
        "創造性が高まっています。新しい企画に挑戦を。",
        "共感力が高まり、人との絆が深まりやすい日です。",
        "リーダーシップを発揮してチームを導けるタイミング。"
      ];
      const insight = document.getElementById('abilitiesInsight');
      insight.style.display = 'block';
      insight.textContent = hints[Math.floor(Math.random() * hints.length)];
    }

    function buildRecs(tokens) {
      const pool = [
        "FKJ", "Thundercat", "SZA", "Robert Glasper", "Disclosure",
        "Khruangbin", "Bonobo", "Yaeji", "Tom Misch", "Cimafunk",
        "Peggy Gou", "Vulfpeck", "Rosalía", "Kaytranada", "Toro y Moi"
      ];
      const used = new Set(tokens.map(t => t.toLowerCase()));
      return pool.filter(n => !used.has(n.toLowerCase())).sort(() => .5 - Math.random()).slice(0, 6);
    }

    function renderRecs() {
      const recs = document.getElementById('recs');
      const list = buildRecs(TOKENS);
      recs.innerHTML = list.map(p => `
      <div style="display:flex;align-items:center;margin:6px 0">
        <img src="https://picsum.photos/seed/${encodeURIComponent(p)}/60/60" style="border-radius:50%;margin-right:8px"/>
        <div>
          <strong>${p}</strong><br>
          <a href="https://music.apple.com/us/search?term=${encodeURIComponent(p)}"
             target="_blank" style="color:#ffe28a">Apple</a> ／
          <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(p + ' official')}"
             target="_blank" style="color:#ffe28a">YouTube</a>
        </div>
      </div>`).join('');
    }

    /* === Analyze === */
    async function analyze() {
      if (!TOKENS.length) return;
      runProgress(async () => {
        await renderMap();
        calcLove();
        const v = randomVec();
        drawProfile(v);
        drawAbilities(v);
        renderRecs();
      });
    }

    document.getElementById('analyzeBtn').onclick = analyze;
  </script>
</body>

</html>
