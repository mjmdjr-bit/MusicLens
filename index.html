<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MusicLens — Sound Journey</title>
  <style>
    :root {
      --gold: #ffcc33;
      --gold2: #ff8800;
      --ink: #0a0a0e;
      --ink2: #151722;
      --txt: #eef2ff;
      --muted: #a9b2c7;
      --glass: rgba(255, 255, 255, .18);
      --stroke: rgba(255, 255, 255, .22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Roboto, Segoe UI, sans-serif;
      background: linear-gradient(180deg, var(--ink), var(--ink2));
      color: var(--txt);
      overflow-x: hidden;
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none
    }

    /* === TOP === */
    #title {
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
      position: relative;
      z-index: 2
    }

    .hero {
      max-width: 900px;
      padding: 40px;
      border: 1px solid var(--stroke);
      border-radius: 28px;
      background: linear-gradient(180deg, var(--glass), rgba(255, 255, 255, .07));
      backdrop-filter: blur(22px)
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      animation: float 6s ease-in-out infinite
    }

    .cta {
      margin-top: 20px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      color: #111;
      font-weight: 900;
      cursor: pointer
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    /* === APP === */
    #app {
      display: none;
      opacity: 0;
      transition: opacity .6s ease
    }

    #app.show {
      display: block;
      opacity: 1
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px
    }

    .titleSmall {
      font-weight: 900;
      font-size: 20px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent
    }

    #backTop {
      color: #ffe28a;
      text-decoration: underline;
      cursor: pointer;
      font-size: 14px
    }

    /* === Panel === */
    .panel {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px
    }

    .section-title {
      font-weight: 800;
      color: #ffd36b;
      margin-bottom: 8px;
      font-size: 14px
    }

    input[type=text] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .25);
      background: rgba(255, 255, 255, .1);
      color: #fff
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 900
    }

    .btn-primary {
      background: linear-gradient(90deg, #ffd766, #ff9f1c);
      color: #111
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .3)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px
    }

    .chip {
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      padding: 6px 10px
    }

    /* === Bubble Map === */
    #bubbleMap {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      min-height: 260px;
      padding: 8px
    }

    .bubble {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: rgba(255, 200, 80, .35);
      border: 1px solid rgba(255, 255, 255, .3);
      animation: float 5s ease-in-out infinite
    }

    .bubble:hover {
      transform: scale(1.15);
      background: rgba(255, 220, 120, .6)
    }

    /* === Artist Info === */
    #artistInfo img {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      margin-right: 8px;
      vertical-align: middle;
      object-fit: cover
    }

    #artistInfo div {
      margin-bottom: 8px
    }

    /* === Music Love === */
    #loveFill {
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffcc33, #ff8800);
      transition: width .6s ease
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <!-- TOP -->
  <section id="title">
    <div class="hero">
      <div class="logo">MusicLens</div>
      <p>今日の気分で音を選んで、新しい自分を見つけよう。</p>
      <button id="startBtn" class="cta">SOUND JOURNEY ▶︎</button>
    </div>
  </section>

  <!-- APP -->
  <section id="app">
    <main class="container">
      <header class="header">
        <div class="titleSmall">MusicLens</div>
        <div id="backTop">← TOPへ戻る</div>
      </header>

      <!-- Today's Feeling -->
      <section class="panel">
        <div class="section-title">Today's Feeling（いま聴きたいアーティストを入力）</div>
        <input id="inputBox" type="text" placeholder="例：Daft Punk, BLACKPINK, FKJ…">
        <div style="margin-top:8px">
          <button id="addBtn" class="btn btn-ghost">Add</button>
          <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
        </div>
        <div id="chips" class="chips"></div>
      </section>

      <!-- Listening Map + Artist Info -->
      <section class="panel">
        <div class="section-title">Listening Map（アーティスト分布）</div>
        <div id="bubbleMap"></div>
        <div id="artistInfo" style="margin-top:10px"></div>
      </section>

      <!-- Music Love -->
      <section class="panel">
        <div class="section-title">Music Love（音楽愛）</div>
        <div class="bar" style="height:12px;background:rgba(255,255,255,.1);border-radius:999px">
          <div id="loveFill" style="width:0%"></div>
        </div>
        <div id="lovePercent" style="margin-top:6px;text-align:right;font-size:13px">—%</div>
      </section>
    </main>
  </section>

  <script>
    /* === 背景パーティクル === */
    (function () {
      const cvs = document.getElementById('fx'), ctx = cvs.getContext('2d', { alpha: true });
      let W = 0, H = 0, stars = [];
      function size() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
      function make() { stars = Array.from({ length: 150 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3, r: 1 + Math.random() * 2, h: 20 + Math.random() * 40, a: .2 + .2 * Math.random() })); }
      function draw() { ctx.clearRect(0, 0, W, H); for (const s of stars) { s.x += s.vx; s.y += s.vy; if (s.x < 0 || s.x > W) s.vx *= -1; if (s.y < 0 || s.y > H) s.vy *= -1; const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 8); g.addColorStop(0, `hsla(${40 + s.h},100%,60%,${s.a})`); g.addColorStop(1, 'transparent'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 8, 0, 6.283); ctx.fill(); } requestAnimationFrame(draw); }
      addEventListener('resize', () => { size(); make(); }); size(); make(); draw();
    })();

    /* === 遷移 === */
    document.getElementById('startBtn').onclick = () => { document.getElementById('title').style.display = 'none'; document.getElementById('app').style.display = 'block'; requestAnimationFrame(() => document.getElementById('app').classList.add('show')); }
    document.getElementById('backTop').onclick = () => { document.getElementById('app').classList.remove('show'); document.getElementById('app').style.display = 'none'; document.getElementById('title').style.display = 'grid'; }

    /* === 入力管理 === */
    let TOKENS = []; const input = document.getElementById('inputBox'), chips = document.getElementById('chips');
    function renderChips() { chips.innerHTML = TOKENS.map((t, i) => `<span class="chip">${t}<a onclick="remove(${i})">✕</a></span>`).join(''); }
    function add() { if (!input.value.trim()) return; TOKENS.push(input.value.trim()); input.value = ''; renderChips(); }
    function remove(i) { TOKENS.splice(i, 1); renderChips(); }
    document.getElementById('addBtn').onclick = add;

    /* === アーティスト情報 === */
    async function fetchArtistInfo(name) {
      try {
        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`);
        const j = await res.json();
        const image = j.thumbnail?.source || `https://picsum.photos/seed/${encodeURIComponent(name)}/100/100`;
        const desc = j.extract?.slice(0, 100) + "…" || "詳細情報なし";
        const locs = ["🇯🇵 Tokyo", "🇺🇸 Los Angeles", "🇫🇷 Paris", "🇬🇧 London", "🇰🇷 Seoul", "🇨🇦 Toronto"];
        const loc = locs[Math.floor(Math.random() * locs.length)];
        return { name, image, desc, loc };
      } catch (_) { return { name, image: `https://picsum.photos/seed/${encodeURIComponent(name)}/100/100`, desc: "情報取得失敗", loc: "" }; }
    }
    async function renderMap() {
      const map = document.getElementById('bubbleMap'), info = document.getElementById('artistInfo');
      map.innerHTML = ""; info.innerHTML = "";
      const data = await Promise.all(TOKENS.map(fetchArtistInfo));
      data.forEach(d => {
        const b = document.createElement('div');
        b.className = 'bubble'; b.innerHTML = `<div>${d.name}</div><div style="font-size:9px">${d.loc}</div>`;
        b.onclick = () => window.open(`https://music.apple.com/us/search?term=${encodeURIComponent(d.name)}`, '_blank');
        map.appendChild(b);
        info.innerHTML += `<div><img src="${d.image}"><strong>${d.name}</strong>：${d.desc}</div>`;
      });
    }

    /* === Music Love === */
    function calcLove() {
      const n = TOKENS.length; const genres = [...new Set(TOKENS.map(t => t.toLowerCase().charAt(0)))].length;
      const score = Math.min(100, Math.round((n * 10) + (genres * 15)));
      document.getElementById('loveFill').style.width = score + '%';
      document.getElementById('lovePercent').textContent = score + '%';
    }

    /* === Analyze === */
    document.getElementById('analyzeBtn').onclick = async () => {
      if (!TOKENS.length) return;
      await renderMap();
      calcLove();
      TOKENS = []; renderChips();
    };
  </script>
</body>

</html>
