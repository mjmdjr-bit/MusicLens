<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MusicLens — Final Integrated Edition</title>
  <style>
    :root {
      --gold: #ffcc33;
      --gold2: #ff8800;
      --ink: #0a0a0e;
      --ink2: #151722;
      --txt: #eef2ff;
      --glass: rgba(255, 255, 255, .18);
      --stroke: rgba(255, 255, 255, .22);
      --spotify: #1DB954;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Roboto, Segoe UI, sans-serif;
      background: linear-gradient(180deg, var(--ink), var(--ink2));
      color: var(--txt);
      overflow-x: hidden;
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none
    }

    /* === TOP === */
    #title {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      z-index: 5;
    }

    #title-left,
    #title-right {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 1.8s cubic-bezier(.2, .8, .2, 1);
      background: linear-gradient(180deg, var(--glass), rgba(255, 255, 255, .05));
      backdrop-filter: blur(25px);
    }

    .hero {
      text-align: center;
      padding: 40px;
      border: 1px solid var(--stroke);
      border-radius: 28px;
      background: linear-gradient(180deg, var(--glass), rgba(255, 255, 255, .07));
      backdrop-filter: blur(22px);
    }

    .logo {
      font-size: 56px;
      font-weight: 900;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: float 6s ease-in-out infinite, shine 5s linear infinite, glow 3s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    @keyframes shine {
      0% {
        background-position: 0% 50%
      }

      100% {
        background-position: 300% 50%
      }
    }

    @keyframes glow {

      0%,
      100% {
        filter: drop-shadow(0 0 0 rgba(255, 220, 120, 0))
      }

      50% {
        filter: drop-shadow(0 0 16px rgba(255, 220, 120, .75))
      }
    }

    .cta {
      margin-top: 20px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      color: #111;
      font-weight: 900;
      cursor: pointer
    }

    .hero small {
      display: block;
      margin-top: 14px;
      color: #ccc
    }

    .spotify-login {
      margin-top: 16px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: var(--spotify);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background .3s;
    }

    .spotify-login:hover {
      background: #1ed760
    }

    /* === スライド扉 === */
    body.sliding #title-left {
      transform: translateX(-100%)
    }

    body.sliding #title-right {
      transform: translateX(100%)
    }

    #app {
      display: none;
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }

    #app.show {
      display: block;
      opacity: 1;
      transform: translateY(0)
    }

    /* === Panel共通 === */
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px
    }

    .panel {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px
    }

    .section-title {
      font-weight: 800;
      color: #ffd36b;
      margin-bottom: 8px;
      font-size: 14px
    }

    input[type=text] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .25);
      background: rgba(255, 255, 255, .1);
      color: #fff
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 900
    }

    .btn-primary {
      background: linear-gradient(90deg, #ffd766, #ff9f1c);
      color: #111
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .3)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px
    }

    .chip {
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      padding: 6px 10px
    }

    /* === Listening Map === */
    .genreGroup {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin: 30px 0;
      justify-content: center
    }

    .bubble {
      position: relative;
      border-radius: 50%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      color: #fff;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      width: 120px;
      height: 120px;
      border: 2px solid currentColor;
      box-shadow: 0 0 20px currentColor;
      animation: floaty 6s ease-in-out infinite alternate;
      transition: transform .25s ease;
    }

    .bubble:hover {
      transform: scale(1.08)
    }

    .bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      z-index: 0
    }

    .bubble span {
      position: absolute;
      bottom: 6px;
      font-size: 11px;
      z-index: 1;
      background: rgba(0, 0, 0, .4);
      border-radius: 8px;
      padding: 2px 4px
    }

    /* === Music Love === */
    #loveSvg {
      width: 220px;
      height: 220px;
      margin: 20px auto;
      filter: drop-shadow(0 0 10px rgba(255, 200, 255, .5))
    }

    #heartGlass {
      fill: rgba(255, 182, 193, 0.2);
      stroke: rgba(255, 215, 0, 0.95);
      stroke-width: 2.2;
      backdrop-filter: blur(12px)
    }

    #liquid {
      animation: wave 4s ease-in-out infinite alternate
    }

    @keyframes wave {
      0% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-4px)
      }

      100% {
        transform: translateY(0)
      }
    }

    .bar {
      height: 10px;
      background: rgba(255, 255, 255, .12);
      border-radius: 999px;
      overflow: hidden
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #ffcc33, #ff8800);
      width: 0%
    }

    .insight {
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      color: #111;
      font-weight: 700
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>
  <!-- === TOP（左右スライド構造） === -->
  <section id="title">
    <div id="title-left">
      <div class="hero">
        <div class="logo">MusicLens</div>
        <p>Spotifyであなたの音楽世界を分析しよう。</p>
        <button id="spotifyLogin" class="spotify-login">Login with Spotify</button>
        <button id="startBtn" class="cta">SOUND JOURNEY ▶︎</button>
        <small>Produced by Daijiro Majima</small>
      </div>
    </div>
    <div id="title-right">
      <div class="hero" style="opacity:0.8">
        <div class="logo">MusicLens</div>
      </div>
    </div>
  </section>

  <!-- === APP === -->
  <section id="app">
    <main class="container">
      <header class="header">
        <div class="titleSmall">MusicLens</div>
        <div id="userStatus" style="font-size:13px;opacity:0.9;text-align:right"></div>
        <div id="backTop" style="cursor:pointer;color:#ffd36b">← TOPへ戻る</div>
      </header>
      <section class="panel">
        <div class="section-title">Today's Feeling（いま聴きたいアーティストを入力）</div>
        <input id="inputBox" type="text" placeholder="例：Daft Punk, Disclosure, 7co,…（カンマ区切りOK）">
        <div style="margin-top:8px">
          <button id="addBtn" class="btn btn-ghost">Add</button>
          <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
        </div>
        <div id="chips" class="chips"></div>
        <div id="progressWrap">
          <div id="progbar">
            <div id="progfill"></div>
          </div>
          <div id="progtext">0%</div>
        </div>
      </section>

      <section class="panel">
        <div class="section-title">Listening Map</div>
        <div id="mapArea"></div>
      </section>

      <section class="panel" style="text-align:center">
        <div class="section-title">Music Love</div>
        <svg id="loveSvg" viewBox="0 0 200 200">
          <defs>
            <clipPath id="heartClip">
              <path id="heartGlass"
                d="M100 175c-3 0-6-.9-8.2-2.9C75 160 30 123 30 85 30 60 50 40 73 40c12 0 24 6 31 15 7-9 19-15 31-15 23 0 43 20 43 45 0 38-45 75-61.8 87.1-2.2 2-5.2 2.9-8.2 2.9z" />
            </clipPath>
            <linearGradient id="liquidGrad" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#ff9f1c" />
              <stop offset="100%" stop-color="#fff3b0" />
            </linearGradient>
          </defs>
          <use href="#heartGlass" />
          <g clip-path="url(#heartClip)">
            <rect id="liquid" x="20" y="150" width="160" height="60" fill="url(#liquidGrad)" />
          </g>
        </svg>
        <div id="lovePercent" style="font-size:18px;margin-top:6px">—%</div>
        <div id="loveComment" class="small" style="margin-top:4px"></div>
      </section>

      <section class="panel">
        <div class="section-title">Your Music Vector</div>
        <div id="profileBars"></div>
        <div id="vectorInsight" class="insight" style="display:none"></div>
      </section>
      <section class="panel">
        <div class="section-title">Work Strengths</div>
        <div id="abilities"></div>
        <div id="abilitiesInsight" class="insight" style="display:none"></div>
      </section>
      <section class="panel">
        <div class="section-title">Music Recommendations</div>
        <div id="recs" class="small">Analyze後に表示されます。</div>
      </section>
      <section class="panel" style="text-align:center"><button id="bgmBtn" class="btn btn-ghost">BGM: FKJ – TUI
          ■</button>
      </section>
    </main>
  </section>
  <script>
    // ===== Spotify OAuth設定 =====
    const clientId = "9ba439fa2d564681aaabe96e6c4a5fd4";
    const redirectUri = "https://mjmdjr-bit.github.io/MusicLens/callback.html";
    const scopes = ["user-read-private", "user-read-email"];
    const authUrl = `https://accounts.spotify.com/authorize?client_id=${clientId}&response_type=token&redirect_uri=${encodeURIComponent(redirectUri)}&scope=${scopes.join("%20")}`;
    document.getElementById("spotifyLogin").onclick = () => window.location.href = authUrl;

    // ===== スライド扉アニメ =====
    const startBtn = document.getElementById("startBtn");
    startBtn.onclick = () => {
      document.body.classList.add("sliding");
      setTimeout(() => {
        document.getElementById("title").style.display = "none";
        const app = document.getElementById("app");
        app.classList.add("show");
      }, 1800);
    };

    // ===== TOPへ戻る =====
    document.getElementById("backTop").onclick = () => {
      const app = document.getElementById("app");
      app.classList.remove("show");
      document.getElementById("title").style.display = "flex";
      document.body.classList.remove("sliding");
    };

    // ===== 背景パーティクル =====
    (function () {
      const cvs = document.getElementById('fx'), ctx = cvs.getContext('2d', { alpha: true });
      let W = 0, H = 0, stars = [];
      function size() { W = cvs.width = innerWidth; H = cvs.height = innerHeight }
      function make() { stars = Array.from({ length: 160 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: 1 + Math.random() * 2, a: .2 + .2 * Math.random() })) }
      function draw() {
        ctx.clearRect(0, 0, W, H); for (const s of stars) {
          s.x += s.vx; s.y += s.vy; if (s.x < 0 || s.x > W) s.vx *= -1; if (s.y < 0 || s.y > H) s.vy *= -1;
          const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 8);
          g.addColorStop(0, `rgba(255,255,200,${s.a})`); g.addColorStop(1, 'transparent');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 8, 0, 6.283); ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      addEventListener('resize', () => { size(); make() }); size(); make(); draw();
    })();

    // ===== Spotifyユーザー名表示 =====
    const token = localStorage.getItem("spotify_token") || "";
    async function fetchSpotifyUser() {
      if (!token) return;
      const res = await fetch("https://api.spotify.com/v1/me", { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) return;
      const user = await res.json();
      document.getElementById("userStatus").innerHTML = `🎵 Spotify: ${user.display_name}`;
    }
    fetchSpotifyUser();
  </script>
  <script>
    // ===== 入力と追加・削除 =====
    let TOKENS = [];
    const input = document.getElementById('inputBox');
    const chips = document.getElementById('chips');
    function renderChips() {
      chips.innerHTML = TOKENS.map((t, i) => `<span class="chip">${t}<a onclick="remove(${i})">✕</a></span>`).join('');
    }
    function add() {
      if (!input.value.trim()) return;
      const items = input.value.split(",").map(t => t.trim()).filter(t => t);
      TOKENS.push(...items);
      input.value = '';
      renderChips();
    }
    function remove(i) {
      TOKENS.splice(i, 1);
      renderChips();
    }
    document.getElementById('addBtn').onclick = add;

    // ===== Progressバー =====
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progfill');
    const progressText = document.getElementById('progtext');
    function runProgress(cb) {
      progressWrap.style.display = 'block';
      let p = 0;
      const id = setInterval(() => {
        p += 3 + Math.random() * 5;
        if (p >= 100) {
          clearInterval(id); p = 100;
          progressFill.style.width = '100%';
          progressText.textContent = '100%';
          setTimeout(() => { progressWrap.style.display = 'none'; cb(); }, 400);
        } else {
          progressFill.style.width = p + '%';
          progressText.textContent = Math.floor(p) + '%';
        }
      }, 80);
    }

    // ===== Spotify + iTunes連携 =====
    async function fetchITunesPreview(n) {
      try {
        const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(n)}&entity=musicTrack&limit=1`);
        const j = await r.json(); const t = j.results?.[0];
        return { preview: t?.previewUrl || "", art: t?.artworkUrl100?.replace('100x100', '200x200') || "" };
      } catch { return { preview: "", art: "" } }
    }
    async function buildRecs() {
      const recs = [];
      for (const name of TOKENS) {
        const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(name)}&entity=musicArtist&limit=3`);
        const j = await r.json();
        for (const a of j.results) {
          recs.push({
            name: a.artistName,
            art: a.artworkUrl100?.replace('100x100', '200x200') || "",
            link: `https://music.apple.com/us/artist/${a.artistId}`,
          });
        }
      }
      return recs;
    }
    async function renderRecs() {
      const recs = await buildRecs();
      const recEl = document.getElementById("recs");
      recEl.innerHTML = recs.map(a => `
              <div style="display:flex;align-items:center;gap:8px;margin:6px 0">
                <img src="${a.art}" style="width:50px;height:50px;border-radius:8px;object-fit:cover"/>
                <div><strong>${a.name}</strong><br>
                <a href="${a.link}" target="_blank" style="color:#ffe28a">Apple Music</a></div>
              </div>`).join('');
    }

    // ===== Listening Map =====
    const mapArea = document.getElementById("mapArea");
    async function renderMap() {
      mapArea.innerHTML = "";
      for (const n of TOKENS) {
        const it = await fetchITunesPreview(n);
        const b = document.createElement("div");
        b.className = "bubble";
        b.style.color = "#ffcc33";
        b.innerHTML = `<img src="${it.art || `https://picsum.photos/seed/${encodeURIComponent(n)}/160/160`}"><span>${n}</span>`;
        mapArea.appendChild(b);
      }
    }

    // ===== Music Love =====
    function calcLove() {
      const score = Math.min(100, Math.round(TOKENS.length * 5));
      document.getElementById("lovePercent").textContent = score + "%";
      document.getElementById("liquid").setAttribute("y", 180 - score * 1.2);
      const c = document.getElementById("loveComment");
      if (score < 40) c.textContent = "まだまだ音楽の旅は始まったばかり。";
      else if (score < 70) c.textContent = "音楽を通じて、あなたの世界が広がっています。";
      else c.textContent = "音楽はあなたの人生そのもの。最高のシンフォニーを。";
    }

    // ===== Vector & Work Strengths =====
    function randomVec() {
      return {
        energy: Math.random(), sophistication: Math.random(), groove: Math.random(),
        structure: Math.random(), experiment: Math.random(), urban: Math.random(), global: Math.random()
      };
    }
    function drawProfile(v) {
      const el = document.getElementById("profileBars"); el.innerHTML = "";
      const labels = { energy: "エネルギー", sophistication: "洗練", groove: "ノリ", structure: "構成力", experiment: "実験性", urban: "都会感", global: "グローバル感" };
      for (const [k, val] of Object.entries(v)) {
        const pct = Math.round(val * 100);
        el.innerHTML += `<div class="kpi"><div>${labels[k]}</div><div>${pct}%</div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div>`;
      }
    }
    function drawAbilities(v) {
      const el = document.getElementById("abilities"); el.innerHTML = "";
      const factors = {
        collaboration: (v.groove + v.urban) / 2, planning: (v.structure + v.sophistication) / 2,
        creativity: (v.experiment + v.energy) / 2, empathy: (v.urban + v.global) / 2, leadership: (v.energy + v.structure) / 2
      };
      const labels = { collaboration: "協働力", planning: "計画力", creativity: "創造力", empathy: "共感力", leadership: "リーダーシップ" };
      for (const [k, val] of Object.entries(factors)) {
        const pct = Math.round(val * 100);
        el.innerHTML += `<div class="kpi"><div>${labels[k]}</div><div>${pct}%</div></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div>`;
      }
    }

    // ===== BGM (FKJ – TUI 自動再生) =====
    let bgm = null;
    const bgmBtn = document.getElementById("bgmBtn");
    async function ensureBGM() {
      if (bgm) return bgm;
      const it = await fetchITunesPreview("FKJ TUI");
      bgm = new Audio(it.preview || ""); bgm.loop = true; bgm.preload = "auto"; return bgm;
    }
    (async () => {
      const a = await ensureBGM();
      if (a && a.src) { a.volume = 0.4; await a.play(); }
    })();
    bgmBtn.onclick = async () => {
      const a = await ensureBGM();
      if (a.paused) { await a.play(); bgmBtn.textContent = "BGM: FKJ – TUI ■"; }
      else { a.pause(); bgmBtn.textContent = "BGM: FKJ – TUI ▶︎"; }
    };

    // ===== Analyze 実行 =====
    async function analyze() {
      if (!TOKENS.length) return;
      runProgress(async () => {
        renderMap();
        calcLove();
        const v = randomVec();
        drawProfile(v);
        drawAbilities(v);
        renderRecs();
      });
    }
    document.getElementById("analyzeBtn").onclick = analyze;
  </script>
  <!doctype html>
  <html lang="ja">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Spotify Callback</title>
  </head>

  <body style="font-family:sans-serif;background:#111;color:#eee;text-align:center;padding-top:40px">
    <h2>Spotify認証処理中...</h2>
    <script>
      const hash = window.location.hash;
      const token = new URLSearchParams(hash.substring(1)).get("access_token");
      if (token) {
        localStorage.setItem("spotify_token", token);
        window.location.href = "https://mjmdjr-bit.github.io/MusicLens/";
      } else {
        document.body.innerHTML = "<h2>トークン取得に失敗しました。Spotify Developer DashboardのRedirect URIを確認してください。</h2>";
      }
    </script>
  </body>

  </html>
