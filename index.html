<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MusicLens — Apple & YouTube Edition v3.3</title>
  <style>
    :root {
      --gold: #ffcc33;
      --gold2: #ff8800;
      --ink: #0a0a0e;
      --ink2: #151722;
      --txt: #f9f9f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Roboto, sans-serif;
      background: linear-gradient(180deg, var(--ink), var(--ink2));
      color: var(--txt);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* === 背景パーティクル === */
    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* === TOP画面 === */
    #title {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .hero {
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-size: 60px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      color: transparent;
      animation: float 6s ease-in-out infinite, shine 5s linear infinite, glow 3s ease-in-out infinite;
    }

    .hero p {
      margin-top: 10px;
      font-size: 16px;
      opacity: 0.9;
    }

    .hero button {
      margin-top: 20px;
    }

    .hero small {
      display: block;
      margin-top: 18px;
      opacity: 0.7;
    }

    .cta {
      padding: 12px 26px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      color: #111;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
      border: none;
      transition: all 0.4s ease;
    }

    .cta:hover {
      transform: scale(1.05);
      filter: brightness(1.2);
    }

    /* === スライド扉 === */
    #doorContainer {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }

    .door {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px) saturate(150%);
      transform: translateX(0);
      transition: transform 3s cubic-bezier(.25, .8, .25, 1);
    }

    body.doors-active #doorContainer {
      pointer-events: auto;
    }

    body.doors-open .door.left {
      transform: translateX(-100%);
    }

    body.doors-open .door.right {
      transform: translateX(100%);
    }

    /* === 遷移後 === */
    #app {
      display: none;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }

    #app.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* === レスポンシブ対応 === */
    @media (max-width: 768px) {
      .logo {
        font-size: 42px;
      }

      .hero {
        padding: 24px;
      }

      .cta {
        width: 100%;
      }

      .panel {
        padding: 12px;
      }

      .section-title {
        font-size: 13px;
      }

      input[type=text] {
        font-size: 14px;
      }
    }

    /* === コンテナ === */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 10;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    #backTop {
      color: #ffd36b;
      cursor: pointer;
      margin-top: 6px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px;
    }

    .section-title {
      font-weight: 800;
      color: #ffd36b;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type=text] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 900;
    }

    .btn-primary {
      background: linear-gradient(90deg, #ffd766, #ff9f1c);
      color: #111;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .3);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .chip {
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      padding: 6px 10px;
    }

    /* === Progress Bar === */
    #progressWrap {
      display: none;
      margin-top: 10px;
    }

    #progbar {
      height: 10px;
      background: rgba(255, 255, 255, .1);
      border-radius: 999px;
      overflow: hidden;
    }

    #progfill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffcc33, #ff8800);
      transition: width .3s ease;
    }

    #progtext {
      margin-top: 6px;
      font-size: 13px;
      text-align: right;
      color: #fff;
    }

    /* === 背景アニメーション（パーティクル） === */
    @keyframes floaty {
      0% {
        transform: translateY(0);
      }

      100% {
        transform: translateY(-10px);
      }
    }

    /* === BGMボタン === */
    #bgmBtn {
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
    }

    #bgmBtn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* === Graph Bars === */
    .kpi {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      margin: 6px 0;
    }

    .bar {
      height: 10px;
      background: rgba(255, 255, 255, .12);
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #ffcc33, #ff8800);
      width: 0%;
      transition: width 1.2s ease;
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <!-- === TOP SCREEN === -->
  <section id="title">
    <div class="hero">
      <div class="logo">MusicLens</div>
      <p>あなたの音楽嗜好を分析して、音の旅へ。</p>
      <button id="startBtn" class="cta">SOUND JOURNEY ▶︎</button>
      <small>Produced by Daijiro Majima</small>
    </div>
  </section>

  <!-- === SLIDING DOORS === -->
  <div id="doorContainer">
    <div class="door left"></div>
    <div class="door right"></div>
  </div>

  <!-- === MAIN APP === -->
  <section id="app">
    <main class="container">
      <header class="header">
        <div class="logo">MusicLens</div>
        <div id="backTop">← TOPへ戻る</div>
      </header>

      <!-- === Today's Feeling === -->
      <section class="panel">
        <div class="section-title">Today's Feeling（アーティストを入力）</div>
        <input id="inputBox" type="text" placeholder="例：Daft Punk, Disclosure, FKJ, 7co …（カンマ区切りOK）">
        <div style="margin-top:8px">
          <button id="addBtn" class="btn btn-ghost">Add</button>
          <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
        </div>
        <div id="chips" class="chips"></div>
        <div id="progressWrap">
          <div id="progbar">
            <div id="progfill"></div>
          </div>
          <div id="progtext">0%</div>
        </div>
      </section>
      <script>
        /* === 背景パーティクル === */
        (function () {
          const cvs = document.getElementById('fx'), ctx = cvs.getContext('2d', { alpha: true });
          let W = 0, H = 0, stars = [];
          function size() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
          function make() {
            stars = Array.from({ length: 160 }, () => ({
              x: Math.random() * W,
              y: Math.random() * H,
              vx: (Math.random() - .5) * .25,
              vy: (Math.random() - .5) * .25,
              r: 1 + Math.random() * 2,
              a: .2 + .2 * Math.random()
            }));
          }
          function draw() {
            ctx.clearRect(0, 0, W, H);
            for (const s of stars) {
              s.x += s.vx; s.y += s.vy;
              if (s.x < 0 || s.x > W) s.vx *= -1;
              if (s.y < 0 || s.y > H) s.vy *= -1;
              const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 8);
              g.addColorStop(0, `rgba(255,255,200,${s.a})`);
              g.addColorStop(1, 'transparent');
              ctx.fillStyle = g;
              ctx.beginPath();
              ctx.arc(s.x, s.y, s.r * 8, 0, 6.283);
              ctx.fill();
            }
            requestAnimationFrame(draw);
          }
          addEventListener('resize', () => { size(); make(); });
          size(); make(); draw();
        })();

        /* === スライド扉アニメーション === */
        document.getElementById("startBtn").onclick = () => {
          window.scrollTo(0, 0);
          document.body.classList.add("doors-active");
          setTimeout(() => document.body.classList.add("doors-open"), 50);
          setTimeout(() => {
            document.body.classList.remove("doors-active");
            document.getElementById("title").style.display = "none";
            const app = document.getElementById("app");
            app.classList.add("show");
            playBGM();
            setTimeout(() => window.scrollTo(0, 0), 100);
          }, 3000);
        };
        document.getElementById("backTop").onclick = () => {
          const app = document.getElementById("app");
          app.classList.remove("show");
          document.getElementById("title").style.display = "flex";
          document.body.classList.remove("doors-open");
          window.scrollTo(0, 0);
        };

        /* === BGM === */
        let bgm = null;
        const bgmBtn = document.getElementById("bgmBtn");
        async function playBGM() {
          if (bgm) return;
          try {
            const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent("FKJ TUI")}&entity=musicTrack&limit=1`);
            const j = await r.json();
            const t = j.results?.[0];
            bgm = new Audio(t?.previewUrl || "");
            bgm.loop = true;
            bgm.volume = 0.5;
            await bgm.play();
          } catch (e) { console.warn("BGM load failed", e); }
        }
        bgmBtn.onclick = () => { if (!bgm) return; if (bgm.paused) { bgm.play(); bgmBtn.textContent = "BGM: FKJ – TUI ■"; } else { bgm.pause(); bgmBtn.textContent = "BGM: FKJ – TUI ▶︎"; } };

        /* === 入力管理 === */
        let TOKENS = [];
        const input = document.getElementById('inputBox');
        const chips = document.getElementById('chips');
        function renderChips() {
          chips.innerHTML = TOKENS.map((t, i) => `<span class="chip">${t}<a onclick="remove(${i})">✕</a></span>`).join('');
        }
        function add() {
          if (!input.value.trim()) return;
          const items = input.value.split(",").map(t => t.trim()).filter(Boolean);
          TOKENS.push(...items);
          input.value = ''; renderChips();
        }
        function remove(i) { TOKENS.splice(i, 1); renderChips(); }
        document.getElementById('addBtn').onclick = add;

        /* === Progressバー === */
        const progressWrap = document.getElementById('progressWrap'),
          progressFill = document.getElementById('progfill'),
          progressText = document.getElementById('progtext');
        function runProgress(cb) {
          progressWrap.style.display = 'block';
          let p = 0;
          const id = setInterval(() => {
            p += 4 + Math.random() * 5;
            if (p >= 100) {
              clearInterval(id);
              p = 100;
              progressFill.style.width = '100%';
              progressText.textContent = '100%';
              setTimeout(() => { progressWrap.style.display = 'none'; cb(); }, 400);
            } else {
              progressFill.style.width = p + '%';
              progressText.textContent = Math.floor(p) + '%';
            }
          }, 80);
        }
        /* === Listening Map === */
        const mapArea = document.getElementById("mapArea");

        /* バブル用の発光アニメーション */
        const style = document.createElement("style");
        style.innerHTML = `
  .bubble {
    position: relative;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(255,215,80,0.5);
    animation: floaty 6s ease-in-out infinite alternate, glow 3s ease-in-out infinite;
    cursor: pointer;
    transition: transform 0.4s ease;
  }
  .bubble:hover { transform: scale(1.15); }
  .bubble img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }
  @keyframes glow {
    0%,100% { box-shadow: 0 0 20px rgba(255,215,80,0.4); }
    50% { box-shadow: 0 0 40px rgba(255,215,80,0.9); }
  }
`;
        document.head.appendChild(style);

        /* デモ用バブル生成（Apple Music / YouTubeリンク） */
        async function renderMap() {
          mapArea.innerHTML = "";
          if (!TOKENS.length) {
            mapArea.innerHTML = "<p style='opacity:.7'>アーティストを入力するとマップに表示されます。</p>";
            return;
          }
          const data = await Promise.all(TOKENS.map(t => fetchArtistData(t)));
          data.forEach(a => {
            const b = document.createElement("div");
            b.className = "bubble";
            b.innerHTML = `<img src="${a.img}" alt="${a.name}">`;
            b.onclick = () => showPopup(a);
            mapArea.appendChild(b);
          });
        }

        /* ダミーデータ生成関数（Spotify削除済・Apple/YouTube中心） */
        async function fetchArtistData(name) {
          const itunes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(name)}&entity=musicArtist&limit=1`);
          const j = await itunes.json();
          const a = j.results?.[0];
          return {
            name: name,
            img: a?.artworkUrl100?.replace("100x100", "200x200") || `https://picsum.photos/seed/${encodeURIComponent(name)}/200/200`,
            desc: a?.artistName ? `${a.artistName} は世界中のファンに愛されるアーティストです。` : `${name} に関する情報が見つかりません。`,
            apple: `https://music.apple.com/us/search?term=${encodeURIComponent(name)}`,
            yt: `https://www.youtube.com/results?search_query=${encodeURIComponent(name + ' official')}`
          };
        }

        /* === ポップアップ === */
        const popup = document.createElement("div");
        popup.id = "popup";
        popup.style.cssText = `
  display:none;position:fixed;inset:0;
  justify-content:center;align-items:center;
  background:rgba(0,0,0,0.6);
  z-index:999;
`;
        popup.innerHTML = `
  <div id="popBox" style="
    max-width:340px;width:92%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:14px;
    padding:18px;text-align:center;
    backdrop-filter:blur(10px);color:#fff;">
    <img id="popImg" src="" alt="" style="width:100px;height:100px;border-radius:50%;object-fit:cover;box-shadow:0 0 20px rgba(255,215,80,0.5)"/>
    <h3 id="popName" style="margin:10px 0 6px;font-size:20px;color:#ffd36b;"></h3>
    <p id="popDesc" style="font-size:14px;opacity:0.9;margin-bottom:10px;"></p>
    <div>
      <a id="popApple" target="_blank" style="margin-right:12px;color:#ffcc33;font-weight:bold;">Apple Music</a>
      <a id="popYT" target="_blank" style="color:#ff6666;font-weight:bold;">YouTube</a>
    </div>
    <button id="popClose" class="btn btn-ghost" style="margin-top:12px">閉じる</button>
  </div>
`;
        document.body.appendChild(popup);

        /* ポップアップ表示制御 */
        function showPopup(a) {
          document.getElementById("popImg").src = a.img;
          document.getElementById("popName").textContent = a.name;
          document.getElementById("popDesc").textContent = a.desc;
          document.getElementById("popApple").href = a.apple;
          document.getElementById("popYT").href = a.yt;
          popup.style.display = "flex";
        }
        document.getElementById("popClose").onclick = () => popup.style.display = "none";

        /* === Analyze 統合 === */
        async function analyze() {
          if (!TOKENS.length) return;
          runProgress(async () => {
            await renderMap();
            calcLove();
            const v = randomVec();
            drawProfile(v);
            drawAbilities(v);
            await renderRecs();
            window.scrollTo(0, 0);
          });
        }
        document.getElementById("analyzeBtn").onclick = analyze;

        /* === Music Love（波がハートの中に収まる） === */
        function calcLove() {
          const n = TOKENS.length;
          const score = Math.min(100, Math.round(n * 7));
          document.getElementById("lovePercent").textContent = score + "%";
          const c = document.getElementById("loveComment");
          if (score < 40) c.textContent = "音楽との出会いを楽しむ第一歩。";
          else if (score < 70) c.textContent = "感性が豊かに広がる音楽の旅の途中。";
          else c.textContent = "あなたの中に、音楽が息づいています。";
        }

        /* === Vector / Work Strengths === */
        function randomVec() {
          return {
            energy: Math.random(),
            sophistication: Math.random(),
            groove: Math.random(),
            structure: Math.random(),
            experiment: Math.random(),
            urban: Math.random(),
            global: Math.random()
          };
        }
        function drawProfile(v) {
          const el = document.getElementById("profileBars");
          el.innerHTML = "";
          const labels = {
            energy: "エネルギー", sophistication: "洗練", groove: "ノリ",
            structure: "構成力", experiment: "実験性", urban: "都会感", global: "グローバル感"
          };
          for (const [k, val] of Object.entries(v)) {
            const pct = Math.round(val * 100);
            const bar = document.createElement("div");
            bar.className = "bar";
            const fill = document.createElement("div");
            fill.className = "fill";
            fill.style.width = "0%";
            bar.appendChild(fill);
            el.innerHTML += `<div class="kpi"><div>${labels[k]}</div><div>${pct}%</div></div>`;
            el.appendChild(bar);
            setTimeout(() => { fill.style.width = pct + "%"; }, 200);
          }
        }
        function drawAbilities(v) {
          const el = document.getElementById("abilities");
          el.innerHTML = "";
          const factors = {
            collaboration: (v.groove + v.urban) / 2,
            planning: (v.structure + v.sophistication) / 2,
            creativity: (v.experiment + v.energy) / 2,
            empathy: (v.urban + v.global) / 2,
            leadership: (v.energy + v.structure) / 2
          };
          const labels = {
            collaboration: "協働力", planning: "計画力", creativity: "創造力",
            empathy: "共感力", leadership: "リーダーシップ"
          };
          for (const [k, val] of Object.entries(factors)) {
            const pct = Math.round(val * 100);
            const bar = document.createElement("div");
            bar.className = "bar";
            const fill = document.createElement("div");
            fill.className = "fill";
            fill.style.width = "0%";
            bar.appendChild(fill);
            el.innerHTML += `<div class="kpi"><div>${labels[k]}</div><div>${pct}%</div></div>`;
            el.appendChild(bar);
            setTimeout(() => { fill.style.width = pct + "%"; }, 200);
          }
        }

        /* === Recommendations（Apple Music / YouTubeリンク） === */
        async function fetchITunesPreview(n) {
          try {
            const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(n)}&entity=musicArtist&limit=1`);
            const j = await r.json();
            const a = j.results?.[0];
            return a ? {
              name: a.artistName,
              art: a.artworkUrl100?.replace("100x100", "200x200"),
              link: `https://music.apple.com/us/search?term=${encodeURIComponent(a.artistName)}`
            } : {};
          } catch { return {}; }
        }
        async function renderRecs() {
          const exclude = new Set(TOKENS.map(t => t.toLowerCase()));
          const recs = [];
          for (const name of TOKENS) {
            const r = await fetchITunesPreview(name);
            if (r.name && !exclude.has(r.name.toLowerCase())) recs.push(r);
          }
          const recEl = document.getElementById("recs");
          if (!recs.length) {
            recEl.innerHTML = "<p>アーティスト入力後、音楽の世界が広がります。</p>";
            return;
          }
          recEl.innerHTML = recs.map(a => `
  <div class="recs-item">
    <img src="${a.art}" alt="${a.name}">
    <div>
      <strong>${a.name}</strong><br>
      <a href="${a.link}" target="_blank" style="color:#ffe28a">Apple Music</a> /
      <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(a.name + ' official')}"
         target="_blank" style="color:#ff6666">YouTube</a>
    </div>
  </div>`).join('');
        }

        /* === Analyze 統合 === */
        async function analyze() {
          if (!TOKENS.length) return;
          runProgress(async () => {
            await renderMap();
            calcLove();
            const v = randomVec();
            drawProfile(v);
            drawAbilities(v);
            await renderRecs();
            window.scrollTo(0, 0);
          });
        }
        document.getElementById("analyzeBtn").onclick = analyze;
        /* === 入力管理修正版 === */
        document.addEventListener("DOMContentLoaded", () => {

          let TOKENS = [];
          const input = document.getElementById("inputBox");
          const chips = document.getElementById("chips");
          const addBtn = document.getElementById("addBtn");
          const analyzeBtn = document.getElementById("analyzeBtn");

          function renderChips() {
            chips.innerHTML = TOKENS.map((t, i) =>
              `<span class="chip">${t}<a onclick="remove(${i})">✕</a></span>`
            ).join("");
          }

          function addArtists() {
            if (!input.value.trim()) return;
            const raw = input.value.replace(/，/g, ",");
            const items = raw.split(",").map(t => t.trim()).filter(Boolean);
            TOKENS.push(...items);
            input.value = "";
            renderChips();
            console.log("🎵 現在のTOKENS:", TOKENS);
          }

          window.remove = function (i) {
            TOKENS.splice(i, 1);
            renderChips();
          };

          addBtn.addEventListener("click", addArtists);
          analyzeBtn.addEventListener("click", () => {
            if (!TOKENS.length) {
              alert("アーティストを追加してください。");
              return;
            }
            runProgress(async () => {
              await renderMap();
              calcLove();
              const v = randomVec();
              drawProfile(v);
              drawAbilities(v);
              await renderRecs();
              window.scrollTo(0, 0);
            });
          });
        });

      </script>
</body>

</html>
