<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MusicLens — Living Music Edition v4.2</title>
  <style>
    :root {
      --gold: #ffcc33;
      --gold2: #ff8800;
      --ink: #0a0a0e;
      --ink2: #151722;
      --txt: #f9f9f9;
    }

    /* ============ RESET ============ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Roboto, sans-serif;
      background: linear-gradient(180deg, var(--ink), var(--ink2));
      color: var(--txt);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ============ PARTICLES ============ */
    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none
    }

    /* ============ LOGO ANIMATION ============ */
    .logo {
      font-size: 60px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff3b0, #ffd166, #ff9f1c);
      -webkit-background-clip: text;
      color: transparent;
      animation: float 6s ease-in-out infinite, glow 3s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    @keyframes glow {

      0%,
      100% {
        filter: drop-shadow(0 0 0 rgba(255, 220, 120, 0))
      }

      50% {
        filter: drop-shadow(0 0 18px rgba(255, 220, 120, .85))
      }
    }

    /* ============ HERO ============ */
    #title {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .hero {
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
    }

    .cta {
      margin-top: 20px;
      padding: 12px 26px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      color: #111;
      font-weight: 900;
      cursor: pointer;
      transition: transform .3s, filter .3s;
    }

    .cta:hover {
      transform: scale(1.05);
      filter: brightness(1.2);
    }

    .hero small {
      display: block;
      margin-top: 12px;
      opacity: .8
    }

    /* ============ DOOR EFFECT ============ */
    #doorContainer {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 5;
      overflow: hidden;
      pointer-events: none
    }

    .door {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px)saturate(150%);
      transform: translateX(0);
      transition: transform 3s cubic-bezier(.25, .8, .25, 1)
    }

    body.doors-open .door.left {
      transform: translateX(-100%)
    }

    body.doors-open .door.right {
      transform: translateX(100%)
    }

    /* ============ APP MAIN ============ */
    #app {
      display: none;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }

    #app.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 10;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    #backTop {
      color: #ffd36b;
      cursor: pointer;
      margin-top: 6px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px;
    }

    .section-title {
      font-weight: 800;
      color: #ffd36b;
      margin-bottom: 8px;
      font-size: 14px;
    }

    @media(max-width:768px) {
      .logo {
        font-size: 42px;
      }

      .hero {
        padding: 24px;
      }
    }

    /* ハートとバー共通 */
    .bar {
      height: 10px;
      background: rgba(255, 255, 255, .12);
      border-radius: 999px;
      overflow: hidden
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #ffcc33, #ff8800);
      width: 0%;
      transition: width 1.2s ease
    }

    .kpi {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      margin: 6px 0
    }

    /* ハート波 */
    #loveSvg {
      width: 200px;
      height: 200px;
      margin: 20px auto;
      display: block
    }

    #heartGlass {
      fill: rgba(255, 255, 255, .06);
      stroke: #ffd36b;
      stroke-width: 2.2
    }

    #liquid {
      animation: wave 5s ease-in-out infinite alternate
    }

    @keyframes wave {
      0% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-5px)
      }

      100% {
        transform: translateY(0)
      }
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>

  <!-- ========== TOP画面 ========== -->
  <section id="title">
    <div class="hero">
      <div class="logo">MusicLens</div>
      <p>あなたの音楽嗜好を分析して、音の旅へ。</p>
      <button id="startBtn" class="cta">SOUND JOURNEY ▶︎</button>
      <small>Produced by Daijiro Majima</small>
    </div>
  </section>

  <!-- スライド扉 -->
  <div id="doorContainer">
    <div class="door left"></div>
    <div class="door right"></div>
  </div>

  <!-- ========== アプリ本体 ========== -->
  <section id="app">
    <main class="container">
      <header class="header">
        <div class="logo">MusicLens</div>
        <div id="backTop">← TOPへ戻る</div>
      </header>

      <!-- === Today's Feeling === -->
      <section class="panel">
        <div class="section-title">Today's Feeling（アーティストを入力）</div>
        <input id="inputBox" type="text" placeholder="例：Daft Punk, FKJ, Disclosure …（カンマ区切りOK）">
        <div style="margin-top:8px">
          <button id="addBtn" class="btn btn-ghost">Add</button>
          <button id="analyzeBtn" class="btn btn-primary">Analyze</button>
        </div>
        <div id="chips" style="margin-top:8px"></div>
        <div id="progressWrap">
          <div id="progbar" style="height:10px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;">
            <div id="progfill"
              style="height:100%;width:0%;background:linear-gradient(90deg,#ffcc33,#ff8800);transition:width .3s ease;">
            </div>
          </div>
          <div id="progtext" style="font-size:13px;text-align:right;margin-top:6px;">0%</div>
        </div>
      </section>

      <!-- === Listening Map === -->
      <section class="panel">
        <div class="section-title">Listening Map（音楽ジャンル別アーティスト）</div>
        <div id="mapArea"></div>
      </section>

      <!-- === Music Love === -->
      <section class="panel" style="text-align:center">
        <div class="section-title">Music Love（音楽愛）</div>
        <svg id="loveSvg" viewBox="0 0 200 200">
          <defs>
            <clipPath id="heartClip">
              <path id="heartGlass" d="M100 175c-3 0-6-.9-8.2-2.9C75 160 30 123 30 85 30 60 50 40 73 40
              c12 0 24 6 31 15 7-9 19-15 31-15 23 0 43 20 43 45
              0 38-45 75-61.8 87.1-2.2 2-5.2 2.9-8.2 2.9z" />
            </clipPath>
            <linearGradient id="liquidGrad" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#ff9f1c" />
              <stop offset="100%" stop-color="#fff3b0" />
            </linearGradient>
          </defs>
          <g clip-path="url(#heartClip)">
            <rect id="liquid" x="20" y="150" width="160" height="60" fill="url(#liquidGrad)" />
          </g>
        </svg>
        <div id="lovePercent" style="font-size:18px;margin-top:6px">—%</div>
        <div id="loveComment" class="small" style="margin-top:4px"></div>
      </section>
      <!-- === Your Music Vector === -->
      <section class="panel">
        <div class="section-title">Your Music Vector</div>
        <div id="profileBars"></div>
      </section>

      <!-- === Work Strengths === -->
      <section class="panel">
        <div class="section-title">Work Strengths</div>
        <div id="abilities"></div>
      </section>

      <!-- === Recommendations === -->
      <section class="panel">
        <div class="section-title">Music Recommendations</div>
        <div id="recs" class="small">Analyze後に表示されます。</div>
      </section>

      <!-- === BGM (FKJ – TUI) === -->
      <div style="text-align:center;margin-top:20px;">
        <audio id="bgm"
          src="https://cdn.pixabay.com/download/audio/2023/03/07/audio_9bba87c1ee.mp3?filename=fkj-tui.mp3"
          loop></audio>
        <button id="bgmToggle" class="cta" style="margin-top:6px;font-size:14px;">🔇 停止</button>
      </div>
    </main>
  </section>

  <script>
    /* === 背景パーティクル === */
    (function () {
      const cvs = document.getElementById('fx'), ctx = cvs.getContext('2d', { alpha: true });
      let W = 0, H = 0, stars = [];
      function size() { W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
      function make() {
        stars = Array.from({ length: 150 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: 1 + Math.random() * 2, a: .2 + .2 * Math.random() }));
      }
      function draw() {
        ctx.clearRect(0, 0, W, H);
        for (const s of stars) {
          s.x += s.vx; s.y += s.vy;
          if (s.x < 0 || s.x > W) s.vx *= -1; if (s.y < 0 || s.y > H) s.vy *= -1;
          const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 8);
          g.addColorStop(0, `rgba(255,255,200,${s.a})`); g.addColorStop(1, 'transparent');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 8, 0, 6.283); ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      addEventListener('resize', () => { size(); make(); });
      size(); make(); draw();
    })();

    /* === 扉アニメーション === */
    document.getElementById("startBtn").onclick = () => {
      window.scrollTo(0, 0);
      document.body.classList.add("doors-open");
      setTimeout(() => {
        document.getElementById("title").style.display = "none";
        document.getElementById("app").classList.add("show");
      }, 3000);
    };
    document.getElementById("backTop").onclick = () => {
      document.getElementById("app").classList.remove("show");
      document.getElementById("title").style.display = "flex";
      document.body.classList.remove("doors-open");
    };

    /* === 入力管理 === */
    let TOKENS = [];
    const input = document.getElementById("inputBox");
    const chips = document.getElementById("chips");
    document.getElementById("addBtn").onclick = () => {
      if (!input.value.trim()) return;
      const raw = input.value.replace(/，/g, ",");
      const items = raw.split(",").map(t => t.trim()).filter(Boolean);
      TOKENS.push(...items);
      input.value = "";
      chips.innerHTML = TOKENS.map((t, i) =>
        `<span style='margin:4px;padding:4px 10px;border:1px solid rgba(255,255,255,.3);
              border-radius:20px;display:inline-block;'>${t}
              <a onclick='TOKENS.splice(${i},1);
              chips.innerHTML=\"\"' style='margin-left:6px;cursor:pointer;'>✕</a></span>`
      ).join("");
    };

    /* === Progressバー === */
    const progressWrap = document.getElementById("progressWrap"),
      progressFill = document.getElementById("progfill"),
      progressText = document.getElementById("progtext");
    function runProgress(cb) {
      progressWrap.style.display = 'block';
      let p = 0;
      const id = setInterval(() => {
        p += 5 + Math.random() * 4;
        if (p >= 100) {
          clearInterval(id); p = 100;
          progressFill.style.width = '100%';
          progressText.textContent = '100%';
          setTimeout(() => { progressWrap.style.display = 'none'; cb(); }, 400);
        } else {
          progressFill.style.width = p + '%';
          progressText.textContent = Math.floor(p) + '%';
        }
      }, 80);
    }

    /* === ジャンル === */
    function genreOf(name) {
      const n = name.toLowerCase();
      if (/pop/.test(n)) return "Pop";
      if (/rock|metal/.test(n)) return "Rock";
      if (/jazz/.test(n)) return "Jazz";
      if (/elect|techno|edm/.test(n)) return "Electronic";
      if (/world|latin|afro/.test(n)) return "World";
      return "Other";
    }

    /* === Listening Map === */
    async function renderMap() {
      const map = document.getElementById("mapArea");
      map.innerHTML = "";
      const data = await Promise.all(TOKENS.map(async n => {
        const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(n)}&entity=musicArtist&limit=1`);
        const j = await r.json();
        const a = j.results?.[0];
        return {
          name: n,
          genre: genreOf(a?.primaryGenreName || n),
          img: a?.artworkUrl100?.replace("100x100", "300x300") || `https://picsum.photos/seed/${encodeURIComponent(n)}/300/300`
        };
      }));
      const colors = { Pop: "#ff77aa", Rock: "#ff5555", Jazz: "#66ccff", Electronic: "#aa88ff", World: "#77ff88", Other: "#ffd966" };
      Object.entries(groupBy(data, 'genre')).forEach(([g, arr]) => {
        const h = document.createElement('h3');
        h.textContent = g;
        h.style.cssText = `text-align:center;color:${colors[g]};margin:20px 0 10px;`;
        map.appendChild(h);
        arr.forEach(a => {
          const b = document.createElement("div");
          b.className = "bubble";
          b.style.width = b.style.height = (80 + Math.random() * 40) + "px";
          b.style.boxShadow = `0 0 30px ${colors[a.genre]}`;
          b.style.margin = "10px";
          b.innerHTML = `<img src='${a.img}' alt='${a.name}' style='width:100%;height:100%;border-radius:50%;object-fit:cover;'>`;
          b.onclick = () => showPopup(a.name);
          map.appendChild(b);
        });
      });
    }
    function groupBy(arr, key) { return arr.reduce((acc, a) => (acc[a[key]] = acc[a[key]] || [], acc[a[key]].push(a), acc), {}); }
    /* === ポップアップ === */
    function showPopup(name) {
      fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(name)}&entity=musicArtist&limit=1`)
        .then(r => r.json()).then(j => {
          const a = j.results?.[0];
          const img = a?.artworkUrl100?.replace("100x100", "300x300")
            || `https://picsum.photos/seed/${encodeURIComponent(name)}/300/300`;
          const desc = a?.primaryGenreName
            ? `${a.artistName} は ${a.primaryGenreName} 系アーティストです。`
            : `${name} に関する情報が見つかりません。`;
          const apple = `https://music.apple.com/us/search?term=${encodeURIComponent(name)}`;
          const yt = `https://www.youtube.com/results?search_query=${encodeURIComponent(name)}+official`;

          const p = document.createElement('div');
          p.style.cssText = `position:fixed;inset:0;display:flex;justify-content:center;align-items:center;
      background:rgba(0,0,0,.6);z-index:999;animation:fadeIn .4s ease;`;
          p.innerHTML = `
      <div style='background:rgba(255,255,255,.12);padding:22px;border-radius:16px;
      text-align:center;backdrop-filter:blur(12px);max-width:340px;width:90%;
      color:#fff;box-shadow:0 0 25px rgba(255,215,100,.3);'>
      <img src='${img}' style='width:120px;height:120px;border-radius:50%;
        object-fit:cover;box-shadow:0 0 25px rgba(255,255,180,.5);'>
      <h3 style='color:#ffd36b;margin:10px 0 6px;'>${name}</h3>
      <p style='font-size:14px;opacity:.9;'>${desc}</p>
      <div style="margin-top:10px;">
        <a href='${apple}' target='_blank' style='color:#ffcc33;margin-right:12px;'>Apple Music</a>
        <a href='${yt}' target='_blank' style='color:#ff6666;'>YouTube</a>
      </div>
      <button style='margin-top:14px;padding:6px 18px;border-radius:8px;
        background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);
        cursor:pointer;'>閉じる</button></div>`;
          p.querySelector("button").onclick = () => p.remove();
          p.onclick = e => { if (e.target === p) p.remove(); };
          document.body.appendChild(p);
        });
    }

    /* === Music Love === */
    function calcLove() {
      const n = TOKENS.length; if (!n) return;
      const genreCounts = { Pop: 0, Rock: 0, Jazz: 0, Electronic: 0, World: 0, Other: 0 };
      TOKENS.forEach(a => { const g = genreOf(a); genreCounts[g] = (genreCounts[g] || 0) + 1; });
      const dominant = Object.entries(genreCounts).sort((a, b) => b[1] - a[1])[0][0];
      const v = randomVec();
      const avgEnergy = Math.round(((v.energy + v.groove + v.experiment) / 3) * 100);
      const score = Math.min(100, Math.round(n * 6 + avgEnergy * 0.4));
      const grad = document.getElementById("liquidGrad");
      const colors = {
        Pop: ["#ff77aa", "#ffd1dc"], Rock: ["#ff4444", "#ffbb77"], Jazz: ["#66ccff", "#b0e0ff"],
        Electronic: ["#aa88ff", "#cfc3ff"], World: ["#77ff88", "#d0ffc3"], Other: ["#ffd966", "#fff3b0"]
      };
      const [c1, c2] = colors[dominant] || colors.Other;
      grad.querySelectorAll("stop")[0].setAttribute("stop-color", c1);
      grad.querySelectorAll("stop")[1].setAttribute("stop-color", c2);

      const beatSpeed = 2 + (n * 0.2);
      const waveAmp = 10 + (avgEnergy / 10);
      const liquid = document.getElementById("liquid");
      liquid.innerHTML = `
    <animate attributeName="y"
      dur="${6 / beatSpeed}s"
      values="${160 - waveAmp};${150 - waveAmp / 2};${160 - waveAmp}"
      repeatCount="indefinite"/>
    <animateTransform attributeName="transform"
      attributeType="XML" type="scale"
      values="1;1.03;1" dur="${8 / beatSpeed}s" repeatCount="indefinite"/>`;
      document.getElementById("lovePercent").textContent = score + "%";
      const c = document.getElementById("loveComment");
      if (score < 40) c.textContent = "音楽の鼓動が静かに始まっています。";
      else if (score < 70) c.textContent = "音楽が心のリズムに寄り添いはじめました。";
      else c.textContent = "音楽とあなたの鼓動が完全に共鳴しています。";
    }

    /* === Vector === */
    function randomVec() {
      return {
        energy: Math.random(), sophistication: Math.random(),
        groove: Math.random(), structure: Math.random(),
        experiment: Math.random(), urban: Math.random(), global: Math.random()
      };
    }
    function drawProfile(v) {
      const el = document.getElementById("profileBars");
      el.innerHTML = "";
      const labels = {
        energy: "エネルギー", sophistication: "洗練", groove: "ノリ",
        structure: "構成力", experiment: "実験性", urban: "都会感", global: "グローバル感"
      };
      for (const [k, val] of Object.entries(v)) {
        const pct = Math.round(val * 100);
        const bar = document.createElement("div"); bar.className = "bar";
        const fill = document.createElement("div"); fill.className = "fill";
        fill.style.height = "10px"; fill.style.width = "0%"; bar.appendChild(fill);
        el.innerHTML += `<div class="kpi"><div>${labels[k]}</div><div>${pct}%</div></div>`;
        el.appendChild(bar);
        setTimeout(() => { fill.style.width = pct + "%"; }, 200);
      }
    }

    /* === Work Strengths === */
    function drawAbilities(v) {
      const el = document.getElementById("abilities"); el.innerHTML = "";
      const factors = {
        collaboration: (v.groove + v.urban) / 2,
        planning: (v.structure + v.sophistication) / 2,
        creativity: (v.experiment + v.energy) / 2,
        empathy: (v.urban + v.global) / 2,
        leadership: (v.energy + v.structure) / 2
      };
      const labels = {
        collaboration: "協働力", planning: "計画力", creativity: "創造力",
        empathy: "共感力", leadership: "リーダーシップ"
      };
      for (const [k, val] of Object.entries(factors)) {
        const pct = Math.round(val * 100);
        const bar = document.createElement("div"); bar.className = "bar";
        const fill = document.createElement("div"); fill.className = "fill";
        fill.style.height = "10px"; fill.style.width = "0%"; bar.appendChild(fill);
        el.innerHTML += `<div class="kpi"><div>${labels[k]}</div><div>${pct}%</div></div>`;
        el.appendChild(bar);
        setTimeout(() => { fill.style.width = pct + "%"; }, 200);
      }
    }
    /* === ポップアップ === */
    function showPopup(name) {
      fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(name)}&entity=musicArtist&limit=1`)
        .then(r => r.json()).then(j => {
          const a = j.results?.[0];
          const img = a?.artworkUrl100?.replace("100x100", "300x300")
            || `https://picsum.photos/seed/${encodeURIComponent(name)}/300/300`;
          const desc = a?.primaryGenreName
            ? `${a.artistName} は ${a.primaryGenreName} 系アーティストです。`
            : `${name} に関する情報が見つかりません。`;
          const apple = `https://music.apple.com/us/search?term=${encodeURIComponent(name)}`;
          const yt = `https://www.youtube.com/results?search_query=${encodeURIComponent(name)}+official`;

          const p = document.createElement('div');
          p.style.cssText = `position:fixed;inset:0;display:flex;justify-content:center;align-items:center;
      background:rgba(0,0,0,.6);z-index:999;animation:fadeIn .4s ease;`;
          p.innerHTML = `
      <div style='background:rgba(255,255,255,.12);padding:22px;border-radius:16px;
      text-align:center;backdrop-filter:blur(12px);max-width:340px;width:90%;
      color:#fff;box-shadow:0 0 25px rgba(255,215,100,.3);'>
      <img src='${img}' style='width:120px;height:120px;border-radius:50%;
        object-fit:cover;box-shadow:0 0 25px rgba(255,255,180,.5);'>
      <h3 style='color:#ffd36b;margin:10px 0 6px;'>${name}</h3>
      <p style='font-size:14px;opacity:.9;'>${desc}</p>
      <div style="margin-top:10px;">
        <a href='${apple}' target='_blank' style='color:#ffcc33;margin-right:12px;'>Apple Music</a>
        <a href='${yt}' target='_blank' style='color:#ff6666;'>YouTube</a>
      </div>
      <button style='margin-top:14px;padding:6px 18px;border-radius:8px;
        background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);
        cursor:pointer;'>閉じる</button></div>`;
          p.querySelector("button").onclick = () => p.remove();
          p.onclick = e => { if (e.target === p) p.remove(); };
          document.body.appendChild(p);
        });
    }

    /* === Music Love === */
    function calcLove() {
      const n = TOKENS.length; if (!n) return;
      const genreCounts = { Pop: 0, Rock: 0, Jazz: 0, Electronic: 0, World: 0, Other: 0 };
      TOKENS.forEach(a => { const g = genreOf(a); genreCounts[g] = (genreCounts[g] || 0) + 1; });
      const dominant = Object.entries(genreCounts).sort((a, b) => b[1] - a[1])[0][0];
      const v = randomVec();
      const avgEnergy = Math.round(((v.energy + v.groove + v.experiment) / 3) * 100);
      const score = Math.min(100, Math.round(n * 6 + avgEnergy * 0.4));
      const grad = document.getElementById("liquidGrad");
      const colors = {
        Pop: ["#ff77aa", "#ffd1dc"], Rock: ["#ff4444", "#ffbb77"], Jazz: ["#66ccff", "#b0e0ff"],
        Electronic: ["#aa88ff", "#cfc3ff"], World: ["#77ff88", "#d0ffc3"], Other: ["#ffd966", "#fff3b0"]
      };
      const [c1, c2] = colors[dominant] || colors.Other;
      grad.querySelectorAll("stop")[0].setAttribute("stop-color", c1);
      grad.querySelectorAll("stop")[1].setAttribute("stop-color", c2);

      const beatSpeed = 2 + (n * 0.2);
      const waveAmp = 10 + (avgEnergy / 10);
      const liquid = document.getElementById("liquid");
      liquid.innerHTML = `
    <animate attributeName="y"
      dur="${6 / beatSpeed}s"
      values="${160 - waveAmp};${150 - waveAmp / 2};${160 - waveAmp}"
      repeatCount="indefinite"/>
    <animateTransform attributeName="transform"
      attributeType="XML" type="scale"
      values="1;1.03;1" dur="${8 / beatSpeed}s" repeatCount="indefinite"/>`;
      document.getElementById("lovePercent").textContent = score + "%";
      const c = document.getElementById("loveComment");
      if (score < 40) c.textContent = "音楽の鼓動が静かに始まっています。";
      else if (score < 70) c.textContent = "音楽が心のリズムに寄り添いはじめました。";
      else c.textContent = "音楽とあなたの鼓動が完全に共鳴しています。";
    }

    /* === Vector === */
    function randomVec() {
      return {
        energy: Math.random(), sophistication: Math.random(),
        groove: Math.random(), structure: Math.random(),
        experiment: Math.random(), urban: Math.random(), global: Math.random()
      };
    }
    function drawProfile(v) {
      const el = document.getElementById("profileBars");
      el.innerHTML = "";
      const labels = {
        energy: "エネルギー", sophistication: "洗練", groove: "ノリ",
        structure: "構成力", experiment: "実験性", urban: "都会感", global: "グローバル感"
      };
      for (const [k, val] of Object.entries(v)) {
        const pct = Math.round(val * 100);
        const bar = document.createElement("div"); bar.className = "bar";
        const fill = document.createElement("div"); fill.className = "fill";
        fill.style.height = "10px"; fill.style.width = "0%"; bar.appendChild(fill);
        el.innerHTML += `<div class="kpi"><div>${labels[k]}</div><div>${pct}%</div></div>`;
        el.appendChild(bar);
        setTimeout(() => { fill.style.width = pct + "%"; }, 200);
      }
    }

    /* === Work Strengths === */
    function drawAbilities(v) {
      const el = document.getElementById("abilities"); el.innerHTML = "";
      const factors = {
        collaboration: (v.groove + v.urban) / 2,
        planning: (v.structure + v.sophistication) / 2,
        creativity: (v.experiment + v.energy) / 2,
        empathy: (v.urban + v.global) / 2,
        leadership: (v.energy + v.structure) / 2
      };
      const labels = {
        collaboration: "協働力", planning: "計画力", creativity: "創造力",
        empathy: "共感力", leadership: "リーダーシップ"
      };
      for (const [k, val] of Object.entries(factors)) {
        const pct = Math.round(val * 100);
        const bar = document.createElement("div"); bar.className = "bar";
        const fill = document.createElement("div"); fill.className = "fill";
        fill.style.height = "10px"; fill.style.width = "0%"; bar.appendChild(fill);
        el.innerHTML += `<div class="kpi"><div>${labels[k]}</div><div>${pct}%</div></div>`;
        el.appendChild(bar);
        setTimeout(() => { fill.style.width = pct + "%"; }, 200);
      }
    }
    /* === Recommendations (Apple Music / YouTube) === */
    async function fetchITunesPreview(n) {
      try {
        const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(n)}&entity=musicArtist&limit=3`);
        const j = await r.json();
        const a = j.results?.[0];
        return a ? {
          name: a.artistName,
          art: a.artworkUrl100?.replace("100x100", "200x200"),
          link: `https://music.apple.com/us/search?term=${encodeURIComponent(a.artistName)}`
        } : {};
      } catch { return {}; }
    }

    async function renderRecs() {
      const exclude = new Set(TOKENS.map(t => t.toLowerCase()));
      const pool = ["FKJ", "Daft Punk", "Disclosure", "Thundercat", "Tom Misch",
        "Robert Glasper", "Kaytranada", "Toro y Moi", "Bonobo", "Khruangbin"];
      const candidates = pool.filter(n => !exclude.has(n.toLowerCase())).sort(() => .5 - Math.random()).slice(0, 5);
      const recs = [];
      for (const name of candidates) {
        const r = await fetchITunesPreview(name);
        if (r.name) recs.push(r);
      }
      const recEl = document.getElementById("recs");
      recEl.innerHTML = recs.map(a => `
    <div class="recs-item" style="display:flex;align-items:center;gap:10px;margin:8px 0;">
      <img src="${a.art}" alt="${a.name}" style="width:50px;height:50px;border-radius:8px;object-fit:cover;"/>
      <div>
        <strong>${a.name}</strong><br>
        <a href="${a.link}" target="_blank" style="color:#ffe28a">Apple Music</a> /
        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(a.name + ' official')}"
           target="_blank" style="color:#ff6666">YouTube</a>
      </div>
    </div>`).join('');
    }

    /* === Analyze 統合 === */
    async function analyze() {
      if (!TOKENS.length) return;
      runProgress(async () => {
        await renderMap();   // Listening Map
        calcLove();          // Music Love
        const v = randomVec(); // Vector
        drawProfile(v);
        drawAbilities(v);
        await renderRecs();  // Recommendations
        window.scrollTo(0, 0);
      });
    }
    document.getElementById("analyzeBtn").onclick = analyze;

    /* === BGM: FKJ – TUI 自動再生 + 停止トグル === */
    document.addEventListener("DOMContentLoaded", () => {
      const bgm = document.getElementById("bgm");
      const btn = document.getElementById("bgmToggle");
      let playing = true; bgm.volume = 0.4;

      // Safari対策：初回クリック時に許可
      document.addEventListener("click", () => bgm.play().catch(() => { }), { once: true });

      btn.onclick = () => {
        if (playing) { bgm.pause(); btn.textContent = "▶️ 再生"; }
        else { bgm.play(); btn.textContent = "🔇 停止"; }
        playing = !playing;
      };

      /* === Glow/Heart同期 === */
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioContext();
      const src = ctx.createMediaElementSource(bgm);
      const analyser = ctx.createAnalyser();
      src.connect(analyser); analyser.connect(ctx.destination);
      analyser.fftSize = 256; const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function animateBeat() {
        requestAnimationFrame(animateBeat);
        analyser.getByteFrequencyData(dataArray);
        const avg = dataArray.reduce((a, b) => a + b, 0) / bufferLength;
        const scale = 1 + avg / 300;
        const glow = Math.min(1, avg / 200);

        // ハートのリズム連動
        const liquid = document.getElementById("liquid");
        if (liquid) liquid.setAttribute("transform", `scale(${scale})`);

        // Listening MapバブルにGlow
        document.querySelectorAll(".bubble").forEach(b => {
          b.style.filter = `brightness(${1 + glow}) drop-shadow(0 0 ${20 + avg / 8}px rgba(255,255,180,${0.3 + glow / 2}))`;
        });
      }

      bgm.onplay = async () => {
        if (ctx.state === "suspended") await ctx.resume();
        animateBeat();
      };
    });
  </script>
  </main>
